.material-symbols-outlined {

/* ==========================================================
   COLLAPSIBLE SIDEBAR — identical on every portal page, and the
   collapsed choice is shared, so it survives navigating between them.
   The header and main are sized against the sidebar's 16rem, so all
   three shift together or the layout tears. !important because the
   Tailwind CDN injects its own sm: rules after this block.
   ========================================================== */
[hidden] { display: none !important; }

@media (min-width: 640px) {
    /* Labels collapse by width + opacity rather than display:none, because display
       cannot be animated — it would snap the text away before the rail finishes
       sliding. Everything animates on the same curve and duration so the rail, the
       header, the content and the labels move as one piece. */
    aside, header, main {
        transition: width var(--dur-moderate) var(--ease-standard), padding var(--dur-moderate) var(--ease-standard), margin-left var(--dur-moderate) var(--ease-standard) !important;
    }
    aside .sidebar-label,
    aside .sidebar-brand-full {
        opacity: 1; max-width: 13rem; white-space: nowrap; overflow: hidden;
        transition: opacity var(--dur-fast) var(--ease-standard) 60ms, max-width var(--dur-moderate) var(--ease-standard) !important;
    }
    aside a, aside button:not(#sidebarToggleBtn) {
        transition: gap var(--dur-moderate) var(--ease-standard), padding var(--dur-moderate) var(--ease-standard), color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard) !important;
    }
    body.sidebar-collapsed aside { width: 5rem !important; padding-left: .75rem !important; padding-right: .75rem !important; }
    body.sidebar-collapsed header { width: calc(100% - 5rem) !important; }
    body.sidebar-collapsed main { width: calc(100% - 5rem) !important; margin-left: 5rem !important; }
    body.sidebar-collapsed aside .sidebar-label,
    body.sidebar-collapsed aside .sidebar-brand-full { opacity: 0 !important; max-width: 0 !important; transition-delay: 0s !important; }
    body.sidebar-collapsed .sidebar-brand-short { display: block !important; animation: railBrandIn .3s ease both; }
    body.sidebar-collapsed aside a,
    body.sidebar-collapsed aside button:not(#sidebarToggleBtn) {
        justify-content: center !important;
        gap: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }
}
.sidebar-brand-short { display: none; }

/* ==========================================================
   MOBILE NAVIGATION (below 640px)
   The rail is fixed and 16rem wide at every size, so on a phone it simply sat
   on top of the page: the content began underneath it and could not be read.
   Below 640px it becomes a drawer that slides in from the left, opened by the
   button in the header and closed by the scrim, the Escape key, or choosing a
   destination. The collapse rules above are desktop-only, so the two never meet.
   ========================================================== */
@media (max-width: 639px) {
    aside {
        width: 17rem !important;
        max-width: 86vw !important;
        transform: translateX(-100%);
        transition: transform var(--dur-moderate) var(--ease-decelerate) !important;
    }
    body.nav-open aside {
        transform: none;
        box-shadow: var(--ztims-shadow-overlay);
    }
    header, main {
        width: 100% !important;
        margin-left: 0 !important;
    }
    #navScrim {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: rgb(var(--ztims-background) / .6);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-moderate) var(--ease-standard);
    }
    body.nav-open #navScrim { opacity: 1; pointer-events: auto; }
    body.nav-open { overflow: hidden; }
}
@media (min-width: 640px) {
    #navScrim, #navOpenBtn { display: none !important; }
}

@keyframes railBrandIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an establishment name — must
   wrap rather than push the layout sideways. */
img, svg, video, canvas { max-width: 100%; height: auto; }
body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {              /* Chrome, Safari */
        width: 0;
        height: 0;
        display: none;
    }
}

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: 'rgb(var(--ztims-success))' },
        error:   { icon: 'error',        accent: 'rgb(var(--ztims-error))' },
        info:    { icon: 'info',         accent: 'rgb(var(--ztims-secondary))' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:0',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'color:rgb(var(--ztims-on-surface))',
            'border:1px solid var(--glass-hairline)',
            'border-left:4px solid ' + settings.accent,
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn var(--dur-moderate, 300ms) var(--ease-decelerate, ease-out)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:rgb(var(--ztims-on-surface-variant));font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut 200ms var(--ease-accelerate, ease-in) forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script>
/* ==========================================================
   ACCOUNT AVATAR + MENU (upper right)
   One button showing who is signed in, and a small menu under it. Built in
   JavaScript rather than markup so every page mounts the same thing with its
   own links, the way the toast module is shared.

   mountAccountMenu({ container, name, email, imageUrl, items, signedOutLabel,
                      signedOutHref })
     name / email : shown in the menu's header; the initial becomes the avatar
     imageUrl     : optional photo (Google accounts have one)
     items        : [{ label, icon, href }] or [{ label, icon, onSelect }]
     signedOut*   : when name and email are both empty, the avatar is replaced
                    by this link, so a guest gets a way in rather than a
                    meaningless blank circle
   ========================================================== */
(function () {
    function initialFrom(name, email) {
        var source = (name || email || '').trim();
        return source ? source.charAt(0).toUpperCase() : '?';
    }

    window.mountAccountMenu = function (options) {
        var container = options.container;
        if (!container) return;
        container.innerHTML = '';

        var signedIn = Boolean((options.name || '').trim() || (options.email || '').trim());

        if (!signedIn) {
            var signIn = document.createElement('a');
            signIn.href = options.signedOutHref || '#';
            signIn.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-full border border-current/30 text-sm font-bold hover:opacity-80 transition-opacity';
            signIn.innerHTML = '<span class="material-symbols-outlined !text-lg">account_circle</span>' +
                               '<span>' + (options.signedOutLabel || 'Sign in') + '</span>';
            container.appendChild(signIn);
            return;
        }

        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative';

        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-haspopup', 'menu');
        button.setAttribute('aria-expanded', 'false');
        button.title = options.name || options.email || 'Account';
        button.style.cssText = [
            'display:flex', 'align-items:center', 'justify-content:center',
            'width:2.5rem', 'height:2.5rem', 'border-radius:0',
            'border:2px solid rgb(var(--ztims-secondary) / .55)', 'background:rgb(var(--ztims-surface-variant))',
            'color:rgb(var(--ztims-accent))',
            'font-weight:800', 'font-size:.95rem', 'cursor:pointer', 'overflow:hidden',
            'transition:transform var(--dur-fast) var(--ease-standard)'
        ].join(';');

        if (options.imageUrl) {
            var photo = document.createElement('img');
            photo.src = options.imageUrl;
            photo.alt = '';
            photo.style.cssText = 'width:100%;height:100%;object-fit:cover';
            // A broken photo link would otherwise leave an empty circle.
            photo.addEventListener('error', function () {
                photo.remove();
                button.textContent = initialFrom(options.name, options.email);
            });
            button.appendChild(photo);
        } else {
            button.textContent = initialFrom(options.name, options.email);
        }
        button.addEventListener('mouseenter', function () { button.style.transform = 'scale(1.06)'; });
        button.addEventListener('mouseleave', function () { button.style.transform = 'none'; });

        var menu = document.createElement('div');
        menu.setAttribute('role', 'menu');
        menu.hidden = true;
        menu.style.cssText = [
            'position:absolute', 'top:calc(100% + .6rem)', 'right:0', 'z-index:1500',
            'min-width:15rem', 'padding:.4rem',
            'border-radius:var(--radius-lg, 1rem)',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'border:1px solid var(--glass-hairline)',
            'color:rgb(var(--ztims-on-surface))',
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'transform-origin:top right',
            'animation:ztimsMenuIn var(--dur-base, 220ms) var(--ease-decelerate, ease-out)',
            'font-size:.85rem'
        ].join(';');

        var header = document.createElement('div');
        header.style.cssText = 'padding:.65rem .75rem;border-bottom:1px solid rgb(var(--ztims-outline));margin-bottom:.3rem';
        var nameLine = document.createElement('div');
        nameLine.textContent = options.name || options.email;
        nameLine.style.cssText = 'font-weight:800;word-break:break-word';
        header.appendChild(nameLine);
        if (options.email && options.name) {
            var emailLine = document.createElement('div');
            emailLine.textContent = options.email;
            emailLine.style.cssText = 'font-size:.75rem;color:rgb(var(--ztims-on-surface-variant));word-break:break-all;margin-top:.1rem';
            header.appendChild(emailLine);
        }
        menu.appendChild(header);

        function close() {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
        }

        (options.items || []).forEach(function (item) {
            var entry = document.createElement(item.href ? 'a' : 'button');
            entry.setAttribute('role', 'menuitem');
            if (item.href) entry.href = item.href; else entry.type = 'button';
            entry.style.cssText = [
                'display:flex', 'align-items:center', 'gap:.6rem', 'width:100%',
                'padding:.6rem .75rem', 'border:0', 'border-radius:0',
                'background:none', 'color:' + (item.danger ? 'rgb(var(--ztims-error))' : 'inherit'),
                'font:inherit', 'text-align:left', 'text-decoration:none', 'cursor:pointer'
            ].join(';');
            entry.innerHTML = '<span class="material-symbols-outlined !text-lg">' + (item.icon || 'chevron_right') + '</span>';
            var label = document.createElement('span');
            label.textContent = item.label;   // text, never markup
            entry.appendChild(label);

            entry.addEventListener('mouseenter', function () { entry.style.background = 'rgb(var(--ztims-on-surface) / .06)'; });
            entry.addEventListener('mouseleave', function () { entry.style.background = 'none'; });
            entry.addEventListener('click', function () {
                close();
                if (item.onSelect) item.onSelect();
            });
            menu.appendChild(entry);
        });

        button.addEventListener('click', function (event) {
            event.stopPropagation();
            var opening = menu.hidden;
            menu.hidden = !opening;
            button.setAttribute('aria-expanded', String(opening));
        });
        document.addEventListener('click', function (event) {
            if (!menu.hidden && !wrap.contains(event.target)) close();
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') close();
        });

        wrap.appendChild(button);
        wrap.appendChild(menu);
        container.appendChild(wrap);
    };
})();
</script>

    <!-- Header Control Anchor -->
    <header class="fixed top-0 right-0 w-full sm:w-[calc(100%-16rem)] flex justify-between items-center gap-3 px-4 sm:px-8 py-3 sm:py-4 z-50 glass-nav border-b border-outline-variant/20 transition-colors duration-300">
        <button id="navOpenBtn" type="button" aria-label="Open navigation" aria-expanded="false"
                class="sm:hidden p-2.5 -ml-1 rounded-xl text-on-surface hover:bg-on-surface/5 transition-colors flex items-center justify-center min-h-[44px] min-w-[44px]">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="flex items-center gap-4">
            
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-surface-variant border border-outline-variant/30 hover:scale-110 transition-all flex items-center justify-center">
                <span id="themeIcon" class="material-symbols-outlined text-accent">dark_mode</span>
            </button>
            <div id="accountMenuSlot"></div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="page-enter w-full sm:w-[calc(100%-16rem)] sm:ml-64 pt-20 sm:pt-24 px-4 sm:px-6 lg:px-10 pb-10 sm:pb-12 min-h-screen transition-colors duration-300">
        <div class="max-w-[1100px] mx-auto space-y-6">

            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black font-headline tracking-tighter text-on-surface">Tickets</h1>

            <!-- Check a ticket: type the code, then let them in. -->
            <section class="glass-panel p-5 sm:p-6 space-y-4" aria-labelledby="checkHeading">
                <h2 id="checkHeading" class="text-lg font-extrabold text-on-surface">Check a ticket</h2>
                <form id="checkForm" class="flex flex-wrap gap-2">
                    <label for="checkCode" class="sr-only">Ticket code</label>
                    <input id="checkCode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
                           placeholder="Ticket code" class="field flex-1 min-w-[200px] min-h-[48px] !text-xl font-mono uppercase tracking-widest"/>
                    <button type="submit" class="btn btn-primary min-h-[48px]">
                        <span class="material-symbols-outlined !text-base" aria-hidden="true">search</span> Check
                    </button>
                </form>
                <div id="checkResult" aria-live="polite"></div>
            </section>

            <!-- The day's tickets: counts that filter, then one box per place. -->
            <section class="space-y-4" aria-labelledby="listHeading">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h2 id="listHeading" class="text-xl font-extrabold text-on-surface">Tickets for <span id="listDay"></span></h2>
                    <div class="flex items-center gap-2">
                        <label for="listDate" class="sr-only">Date</label>
                        <input id="listDate" type="date" class="field !w-auto min-h-[44px]"/>
                        <button id="listRefresh" type="button" class="dest-more" aria-label="Refresh the list" title="Refresh">
                            <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                        </button>
                    </div>
                </div>
                <div id="ticketFilter" class="dest-chips" role="group" aria-label="Show">
                    <button type="button" data-show="all" aria-pressed="true">All <b id="countAll">0</b></button>
                    <button type="button" data-show="waiting" aria-pressed="false">Not yet used <b id="countWaiting">0</b></button>
                    <button type="button" data-show="used" aria-pressed="false">Used <b id="countUsed">0</b></button>
                    <button type="button" data-show="other" aria-pressed="false" class="dest-chips__warn">Cancelled or closed <b id="countOther">0</b></button>
                </div>
                <div id="ticketList" class="space-y-4"></div>
            </section>
        </div>
    </main>

    <script>
        const API_BASE = "/api";
        const authHeaders = extra =>
            Object.assign({ 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` }, extra || {});
        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

        function signOutStaff() {
            try { window.ztimsTheme.clearStorage(); sessionStorage.clear(); } catch (e) { /* private browsing */ }
            if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
            setTimeout(function () { window.location.replace('../../index.html'); }, 600);
        }
        function mountPortalAccountMenu() {
            mountAccountMenu({
                container: document.getElementById('accountMenuSlot'),
                name: localStorage.getItem('userName') || 'Tourism Officer',
                email: localStorage.getItem('userEmail') || '',
                items: [
                    { label: 'Settings', icon: 'settings', href: 'admin_profile.html' },
                    { label: 'Sign out', icon: 'logout', danger: true, onSelect: signOutStaff }
                ]
            });
        }
        function guardOfficerSession() {
            if (localStorage.getItem('userRole') !== 'admin' || !localStorage.getItem('authToken')) {
                window.location.href = '../staff_login.html';
                return false;
            }
            return true;
        }
        function handleExpiredSession() {
            showToast('Your session has expired. Please sign in again.', 'error');
            ['authToken', 'userRole', 'userEmail', 'userId'].forEach(k => localStorage.removeItem(k));
            setTimeout(() => window.location.replace('../staff_login.html'), 900);
        }
        const manilaToday = () => new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
        const timeOf = value => new Date(value).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Manila' });
        function dayLabel(key) {
            const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-PH', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
        }

        async function api(path, method = 'GET', body) {
            const res = await fetch(`${API_BASE}${path}`, { method, headers: authHeaders({ 'Content-Type': 'application/json' }), body: body ? JSON.stringify(body) : undefined });
            if (res.status === 401) { handleExpiredSession(); throw new Error('Signed out.'); }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || `The server refused (status ${res.status}).`);
            return data;
        }

        /* ---- the check -------------------------------------------------- */

        const VERDICT = {
            valid:      { tone: 'tone-success', icon: 'check_circle', title: 'Valid' },
            used:       { tone: 'tone-danger',  icon: 'block',        title: 'Already used' },
            wrong_date: { tone: 'tone-warning', icon: 'event_busy',   title: 'Wrong date' },
            cancelled:  { tone: 'tone-danger',  icon: 'cancel',       title: 'Cancelled' },
            closed:     { tone: 'tone-danger',  icon: 'event_busy',   title: 'Date closed' },
            not_paid:   { tone: 'tone-danger',  icon: 'money_off',    title: 'Not paid' },
            not_found:  { tone: 'tone-danger',  icon: 'help',         title: 'Not found' }
        };

        async function check(code) {
            const box = document.getElementById('checkResult');
            if (!code.trim()) return;
            box.innerHTML = '<div class="ztims-empty">Checking…</div>';
            try {
                const r = await api('/tickets/check', 'POST', { code });
                const v = VERDICT[r.verdict] || VERDICT.not_found;
                const t = r.ticket;
                let detail = escapeHtml(r.message);
                if (r.verdict === 'used' && t.usedAt) detail = `Used at ${timeOf(t.usedAt)} on ${dayLabel(new Date(new Date(t.usedAt).getTime() + 8 * 3600000).toISOString())}${t.usedByEmail ? ` by ${escapeHtml(t.usedByEmail)}` : ''}.`;
                box.innerHTML = `
                    <div class="ztims-card ${v.tone} p-5 flex flex-wrap items-center gap-4" style="border-left:6px solid rgb(var(--tone))">
                        <span class="material-symbols-outlined !text-5xl">${v.icon}</span>
                        <div class="flex-1 min-w-[200px] text-on-surface">
                            <p class="text-2xl font-black ${v.tone}">${v.title}</p>
                            <p class="text-on-surface">${detail}</p>
                            ${t ? `<p class="text-support mt-1"><span class="font-mono font-bold">${escapeHtml(t.code)}</span> · ${escapeHtml(t.spot)} · ${dayLabel(t.visitDate)} · ${escapeHtml(t.kindsText || `${t.people} ${t.people === 1 ? 'person' : 'people'}`)} · ${escapeHtml(t.name)}
                               ${t.isDemo ? '<span class="tone-warning tone-pill rounded-pill text-[11px] font-bold px-2 py-0.5 ml-1">Demo</span>' : ''}</p>` : ''}
                        </div>
                        ${r.verdict === 'valid' ? `<button type="button" id="admitBtn" data-id="${escapeHtml(t._id)}" class="btn btn-primary min-h-[48px] !text-base">
                            <span class="material-symbols-outlined">login</span> Let them in</button>` : ''}
                    </div>`;
                const admit = document.getElementById('admitBtn');
                if (admit) {
                    admit.focus();
                    admit.addEventListener('click', async () => {
                        admit.disabled = true;
                        try {
                            const a = await api(`/tickets/${admit.dataset.id}/admit`, 'POST');
                            showToast(a.message, 'success');
                            document.getElementById('checkCode').value = '';
                            box.innerHTML = `<div class="ztims-card tone-success p-5 font-bold">${escapeHtml(a.message)}</div>`;
                            document.getElementById('checkCode').focus();
                            loadList();
                        } catch (e) { showToast(e.message, 'error'); admit.disabled = false; }
                    });
                }
            } catch (error) {
                box.innerHTML = `<div class="ztims-empty tone-danger">${escapeHtml(error.message)}</div>`;
            }
        }

        /* ---- the day's list ----------------------------------------------- */

        const STATUS = {
            valid: ['tone-success', 'Not yet used'], used: ['tone-info', 'Used'], cancelled: ['tone-danger', 'Cancelled'], expired: ['tone-neutral', 'Expired'],
            closed: ['tone-warning', 'Closed, visitor to choose']
        };

        let dayTickets = null;     // { tickets, today, date } for the day shown
        let activeShow = 'all';    // the pressed count

        const groupOf = t => t.status === 'used' ? 'used' : t.status === 'valid' ? 'waiting' : 'other';

        async function loadList() {
            const box = document.getElementById('ticketList');
            const date = document.getElementById('listDate').value;
            document.getElementById('listDay').textContent = date === manilaToday() ? 'today' : dayLabel(date);
            box.innerHTML = '<div class="ztims-empty">Loading tickets…</div>';
            try {
                const r = await api(`/tickets?date=${date}`);
                dayTickets = { tickets: r.tickets, today: r.today, date };
                renderList();
            } catch (error) {
                dayTickets = null;
                box.innerHTML = `<div class="ztims-empty tone-danger">${escapeHtml(error.message)}</div>`;
            }
        }

        function renderList() {
            const box = document.getElementById('ticketList');
            const { tickets, today, date } = dayTickets;
            const count = group => tickets.filter(t => groupOf(t) === group).length;
            document.getElementById('countAll').textContent = tickets.length;
            document.getElementById('countWaiting').textContent = count('waiting');
            document.getElementById('countUsed').textContent = count('used');
            document.getElementById('countOther').textContent = count('other');

            const shown = tickets.filter(t => activeShow === 'all' || groupOf(t) === activeShow);
            if (!shown.length) {
                box.innerHTML = `<div class="ztims-empty">${tickets.length ? 'No ticket matches.' : 'No tickets for this day.'}</div>`;
                return;
            }
            const bySpot = new Map();
            for (const t of shown) {
                if (!bySpot.has(t.spot)) bySpot.set(t.spot, []);
                bySpot.get(t.spot).push(t);
            }
            box.innerHTML = [...bySpot.entries()].map(([spot, list]) => {
                const all = tickets.filter(t => t.spot === spot && t.status !== 'cancelled');
                const people = all.reduce((a, t) => a + t.people, 0);
                const inside = all.filter(t => t.status === 'used').reduce((a, t) => a + t.people, 0);
                return `
                <div class="glass-panel">
                    <div class="flex flex-wrap items-baseline justify-between gap-2 px-5 pt-4 pb-3">
                        <h3 class="text-lg font-extrabold text-on-surface">${escapeHtml(spot)}</h3>
                        <p class="text-sm text-on-surface"><b>${inside}</b> of <b>${people}</b> ${people === 1 ? 'person' : 'people'} let in</p>
                    </div>
                    <div class="divide-y divide-outline-variant/20 border-t border-outline-variant/30">${list.map(t => {
                        const [tone, label] = STATUS[t.status] || ['tone-neutral', t.status];
                        // No one at the entrance (a falls, a beach): the office
                        // ticks it used, on the day or after.
                        const canMark = t.status === 'valid' && date <= today;
                        return `<div class="tk-row">
                            <span class="tk-row__code">${escapeHtml(t.code)}</span>
                            <span class="tk-row__who"><b>${escapeHtml(t.name)}</b>
                                <span class="text-support">${t.people} ${t.people === 1 ? 'person' : 'people'}${t.kindsText ? ` · ${escapeHtml(t.kindsText)}` : ''}</span></span>
                            <span class="tk-row__status">
                                ${t.isDemo ? '<span class="tone-warning tone-pill rounded-pill text-[11px] font-bold px-2 py-0.5">Demo</span>' : ''}
                                <span class="${tone} tone-pill rounded-pill text-xs font-bold px-2.5 py-0.5">${label}${t.status === 'used' && t.usedAt ? ` · ${timeOf(t.usedAt)}` : ''}</span>
                                ${canMark ? `<button type="button" class="btn btn-secondary btn-sm rounded-pill" data-mark="${escapeHtml(t._id)}">
                                    <span class="material-symbols-outlined !text-base" aria-hidden="true">check</span> Mark used</button>` : ''}</span>
                        </div>`;
                    }).join('')}</div>
                </div>`;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!guardOfficerSession()) return;
            mountPortalAccountMenu();
            document.getElementById('checkForm').addEventListener('submit', event => {
                event.preventDefault();
                check(document.getElementById('checkCode').value);
            });
            const date = document.getElementById('listDate');
            date.value = manilaToday();
            date.addEventListener('change', loadList);
            document.getElementById('listRefresh').addEventListener('click', loadList);
            document.getElementById('ticketFilter').addEventListener('click', event => {
                const chip = event.target.closest('[data-show]');
                if (!chip) return;
                activeShow = chip.dataset.show;
                document.querySelectorAll('#ticketFilter [data-show]').forEach(btn =>
                    btn.setAttribute('aria-pressed', String(btn.dataset.show === activeShow)));
                if (dayTickets) renderList();
            });
            document.getElementById('ticketList').addEventListener('click', async event => {
                const btn = event.target.closest('[data-mark]');
                if (!btn) return;
                const t = dayTickets && dayTickets.tickets.find(x => x._id === btn.dataset.mark);
                if (!t) return;
                const ok = await window.ztimsDialog.confirm({
                    title: `Mark ${t.code} used?`,
                    message: `${t.people} ${t.people === 1 ? 'person' : 'people'} · ${t.name} · ${t.spot}. A used ticket can no longer be moved or refunded.`,
                    confirmLabel: 'Mark used'
                });
                if (!ok) return;
                btn.disabled = true;
                try {
                    const r = await api(`/tickets/${t._id}/admit`, 'POST');
                    showToast(r.message, 'success');
                    loadList();
                } catch (e) { showToast(e.message, 'error'); btn.disabled = false; }
            });
            loadList();
            document.getElementById('checkCode').focus();
        });
    </script>

<script>
/* Collapsed sidebar state, shared across every portal page via one key. */
(function () {
    var btn = document.getElementById('sidebarToggleBtn');
    var icon = document.getElementById('sidebarToggleIcon');
    if (!btn || !icon) return;

    function apply(collapsed) {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        icon.textContent = collapsed ? 'left_panel_open' : 'left_panel_close';
        var label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        btn.title = label;
        btn.setAttribute('aria-label', label);
    }

    btn.addEventListener('click', function () {
        var collapsed = !document.body.classList.contains('sidebar-collapsed');
        apply(collapsed);
        try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) { /* private browsing */ }
    });

    try { apply(localStorage.getItem('sidebarCollapsed') === '1'); }
    catch (e) { apply(false); }
})();
</script>

<script>
/* Signing out goes straight back to the public site: the session is cleared here
   and the person lands on the main page, instead of stopping at a page whose only
   purpose was to say they had left. */
(function () {
    var link = document.getElementById('logoutLink');
    if (!link) return;

    link.addEventListener('click', function (event) {
        event.preventDefault();
        try {
            window.ztimsTheme.clearStorage();
            sessionStorage.clear();
        } catch (e) { /* private browsing */ }

        if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
        // replace(), not href: the portal must not come back with the back button.
        setTimeout(function () { window.location.replace('../../index.html'); }, 600);
    });
})();
</script>

<script>
/* The drawer's open state. Only ever active below 640px, where the CSS above
   turns the rail into one; above that the button and scrim are hidden and this
   does nothing. */
(function () {
    var openBtn = document.getElementById('navOpenBtn');
    var scrim = document.getElementById('navScrim');
    var aside = document.querySelector('aside');
    if (!openBtn || !scrim || !aside) return;

    function setOpen(open) {
        document.body.classList.toggle('nav-open', open);
        openBtn.setAttribute('aria-expanded', String(open));
    }

    openBtn.addEventListener('click', function () {
        setOpen(!document.body.classList.contains('nav-open'));
    });
    scrim.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

    // Choosing a destination should take you there, not leave the drawer over it.
    aside.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
    });

    // Rotating to landscape or resizing past the breakpoint must not leave the
    // body locked by a drawer that is no longer on screen.
    window.addEventListener('resize', function () {
        if (window.innerWidth >= 640) setOpen(false);
    });
})();
</script>
