/* ==========================================================
   COLLAPSIBLE SIDEBAR — identical on every portal page, and the
   collapsed choice is shared, so it survives navigating between them.
   The header and main are sized against the sidebar's 16rem, so all
   three shift together or the layout tears. !important because the
   Tailwind CDN injects its own sm: rules after this block.
   ========================================================== */
[hidden] { display: none !important; }

@media (min-width: 640px) {
    /* Labels collapse by width + opacity rather than display:none, because display
       cannot be animated — it would snap the text away before the rail finishes
       sliding. Everything animates on the same curve and duration so the rail, the
       header, the content and the labels move as one piece. */
    aside, header, main {
        transition: width .3s cubic-bezier(.4, 0, .2, 1), padding .3s cubic-bezier(.4, 0, .2, 1), margin-left .3s cubic-bezier(.4, 0, .2, 1) !important;
    }
    aside .sidebar-label,
    aside .sidebar-brand-full {
        opacity: 1; max-width: 13rem; white-space: nowrap; overflow: hidden;
        transition: opacity .2s ease .06s, max-width .3s cubic-bezier(.4, 0, .2, 1) !important;
    }
    aside a, aside button:not(#sidebarToggleBtn) {
        transition: gap .3s cubic-bezier(.4, 0, .2, 1), padding .3s cubic-bezier(.4, 0, .2, 1), color .2s ease, background-color .2s ease !important;
    }
    body.sidebar-collapsed aside { width: 5rem !important; padding-left: .75rem !important; padding-right: .75rem !important; }
    body.sidebar-collapsed header { width: calc(100% - 5rem) !important; }
    body.sidebar-collapsed main { width: calc(100% - 5rem) !important; margin-left: 5rem !important; }
    body.sidebar-collapsed aside .sidebar-label,
    body.sidebar-collapsed aside .sidebar-brand-full { opacity: 0 !important; max-width: 0 !important; transition-delay: 0s !important; }
    body.sidebar-collapsed .sidebar-brand-short { display: block !important; animation: railBrandIn .3s ease both; }
    body.sidebar-collapsed aside a,
    body.sidebar-collapsed aside button:not(#sidebarToggleBtn) {
        justify-content: center !important;
        gap: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }
}
.sidebar-brand-short { display: none; }

/* ==========================================================
   MOBILE NAVIGATION (below 640px)
   The rail is fixed and 16rem wide at every size, so on a phone it simply sat
   on top of the page: the content began underneath it and could not be read.
   Below 640px it becomes a drawer that slides in from the left, opened by the
   button in the header and closed by the scrim, the Escape key, or choosing a
   destination. The collapse rules above are desktop-only, so the two never meet.
   ========================================================== */
@media (max-width: 639px) {
    aside {
        width: 17rem !important;
        max-width: 86vw !important;
        transform: translateX(-100%);
        transition: transform .28s cubic-bezier(.4, 0, .2, 1) !important;
    }
    body.nav-open aside {
        transform: none;
        box-shadow: 0 0 45px rgba(0, 0, 0, .55);
    }
    header, main {
        width: 100% !important;
        margin-left: 0 !important;
    }
    #navScrim {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: rgba(2, 15, 36, .6);
        opacity: 0;
        pointer-events: none;
        transition: opacity .28s ease;
    }
    body.nav-open #navScrim { opacity: 1; pointer-events: auto; }
    body.nav-open { overflow: hidden; }
}
@media (min-width: 640px) {
    #navScrim, #navOpenBtn { display: none !important; }
}

@keyframes railBrandIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

<script>
/* ==========================================================
   THEME (dark / light)
   Every page used to do this its own way — three different class names, four
   different toggle functions, and the sign-in page following none of them, so
   choosing light on one page did nothing on the next. This is the single
   implementation: it stores one choice and applies every class convention the
   pages' stylesheets rely on, so all of them respond to it.

   window.toggleTheme()            flips and remembers the choice
   window.toggleDarkMode()         the same, under the name inline onclick uses
   window.applyTheme('dark'|'light')
   ========================================================== */
(function () {
    var STORAGE_KEY = 'theme';

    function apply(theme) {
        var dark = theme !== 'light';
        var root = document.documentElement;

        // Pages define their palette against one of these three, depending on
        // when they were written. Setting all of them keeps every page correct
        // without rewriting each stylesheet.
        root.classList.toggle('dark', dark);
        root.classList.toggle('light-mode', !dark);
        if (document.body) {
            document.body.classList.toggle('light-mode', !dark);
            document.body.classList.toggle('dark-mode', dark);
        }

        // A moon while dark, a sun while light — the same way round everywhere.
        var glyph = dark ? 'dark_mode' : 'light_mode';
        ['themeIcon', 'themeToggleIcon'].forEach(function (id) {
            var icon = document.getElementById(id);
            if (icon) icon.textContent = glyph;
        });

        var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        ['themeToggleBtn', 'themeToggleButton'].forEach(function (id) {
            var button = document.getElementById(id);
            if (button) { button.title = label; button.setAttribute('aria-label', label); }
        });
    }

    function current() {
        try { return localStorage.getItem(STORAGE_KEY) === 'light' ? 'light' : 'dark'; }
        catch (e) { return 'dark'; }   // private browsing
    }

    window.applyTheme = apply;

    window.toggleTheme = function () {
        var next = current() === 'light' ? 'dark' : 'light';
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* private browsing */ }
        apply(next);
    };

    // Pages written earlier call this name from an inline onclick.
    window.toggleDarkMode = window.toggleTheme;

    apply(current());
    // The body classes cannot be set before the body exists, so they are applied
    // again once it does. The html class above already prevents the flash.
    document.addEventListener('DOMContentLoaded', function () { apply(current()); });
})();
</script>

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: '#2E7D32' },
        error:   { icon: 'error',        accent: '#E53935' },
        info:    { icon: 'info',         accent: '#FFB300' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:.9rem',
            'border-left:4px solid ' + settings.accent,
            'background:rgba(10,25,47,.97)',
            'color:#F4F6F9',
            'box-shadow:0 12px 32px -12px rgba(0,0,0,.6)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn .22s cubic-bezier(.4,0,.2,1)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:#A9BCD0;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut .2s ease forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script>
/* ==========================================================
   ACCOUNT AVATAR + MENU (upper right)
   One button showing who is signed in, and a small menu under it. Built in
   JavaScript rather than markup so every page mounts the same thing with its
   own links, the way the toast module is shared.

   mountAccountMenu({ container, name, email, imageUrl, items, signedOutLabel,
                      signedOutHref })
     name / email : shown in the menu's header; the initial becomes the avatar
     imageUrl     : optional photo (Google accounts have one)
     items        : [{ label, icon, href }] or [{ label, icon, onSelect }]
     signedOut*   : when name and email are both empty, the avatar is replaced
                    by this link, so a guest gets a way in rather than a
                    meaningless blank circle
   ========================================================== */
(function () {
    function initialFrom(name, email) {
        var source = (name || email || '').trim();
        return source ? source.charAt(0).toUpperCase() : '?';
    }

    window.mountAccountMenu = function (options) {
        var container = options.container;
        if (!container) return;
        container.innerHTML = '';

        var signedIn = Boolean((options.name || '').trim() || (options.email || '').trim());

        if (!signedIn) {
            var signIn = document.createElement('a');
            signIn.href = options.signedOutHref || '#';
            signIn.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-full border border-current/30 text-sm font-bold hover:opacity-80 transition-opacity';
            signIn.innerHTML = '<span class="material-symbols-outlined !text-lg">account_circle</span>' +
                               '<span>' + (options.signedOutLabel || 'Sign in') + '</span>';
            container.appendChild(signIn);
            return;
        }

        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative';

        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-haspopup', 'menu');
        button.setAttribute('aria-expanded', 'false');
        button.title = options.name || options.email || 'Account';
        button.style.cssText = [
            'display:flex', 'align-items:center', 'justify-content:center',
            'width:2.5rem', 'height:2.5rem', 'border-radius:9999px',
            'border:2px solid rgba(255,179,0,.55)', 'background:#0B2954', 'color:#FFB300',
            'font-weight:800', 'font-size:.95rem', 'cursor:pointer', 'overflow:hidden',
            'transition:transform .15s ease'
        ].join(';');

        if (options.imageUrl) {
            var photo = document.createElement('img');
            photo.src = options.imageUrl;
            photo.alt = '';
            photo.style.cssText = 'width:100%;height:100%;object-fit:cover';
            // A broken photo link would otherwise leave an empty circle.
            photo.addEventListener('error', function () {
                photo.remove();
                button.textContent = initialFrom(options.name, options.email);
            });
            button.appendChild(photo);
        } else {
            button.textContent = initialFrom(options.name, options.email);
        }
        button.addEventListener('mouseenter', function () { button.style.transform = 'scale(1.06)'; });
        button.addEventListener('mouseleave', function () { button.style.transform = 'none'; });

        var menu = document.createElement('div');
        menu.setAttribute('role', 'menu');
        menu.hidden = true;
        menu.style.cssText = [
            'position:absolute', 'top:calc(100% + .6rem)', 'right:0', 'z-index:1500',
            'min-width:15rem', 'padding:.4rem',
            'border-radius:1rem', 'background:rgba(10,25,47,.98)', 'color:#F4F6F9',
            'box-shadow:0 18px 40px -18px rgba(0,0,0,.75)',
            'font-size:.85rem'
        ].join(';');

        var header = document.createElement('div');
        header.style.cssText = 'padding:.65rem .75rem;border-bottom:1px solid rgba(169,188,208,.18);margin-bottom:.3rem';
        var nameLine = document.createElement('div');
        nameLine.textContent = options.name || options.email;
        nameLine.style.cssText = 'font-weight:800;word-break:break-word';
        header.appendChild(nameLine);
        if (options.email && options.name) {
            var emailLine = document.createElement('div');
            emailLine.textContent = options.email;
            emailLine.style.cssText = 'font-size:.75rem;color:#A9BCD0;word-break:break-all;margin-top:.1rem';
            header.appendChild(emailLine);
        }
        menu.appendChild(header);

        function close() {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
        }

        (options.items || []).forEach(function (item) {
            var entry = document.createElement(item.href ? 'a' : 'button');
            entry.setAttribute('role', 'menuitem');
            if (item.href) entry.href = item.href; else entry.type = 'button';
            entry.style.cssText = [
                'display:flex', 'align-items:center', 'gap:.6rem', 'width:100%',
                'padding:.6rem .75rem', 'border:0', 'border-radius:.7rem',
                'background:none', 'color:' + (item.danger ? '#FF8A80' : 'inherit'),
                'font:inherit', 'text-align:left', 'text-decoration:none', 'cursor:pointer'
            ].join(';');
            entry.innerHTML = '<span class="material-symbols-outlined !text-lg">' + (item.icon || 'chevron_right') + '</span>';
            var label = document.createElement('span');
            label.textContent = item.label;   // text, never markup
            entry.appendChild(label);

            entry.addEventListener('mouseenter', function () { entry.style.background = 'rgba(255,255,255,.07)'; });
            entry.addEventListener('mouseleave', function () { entry.style.background = 'none'; });
            entry.addEventListener('click', function () {
                close();
                if (item.onSelect) item.onSelect();
            });
            menu.appendChild(entry);
        });

        button.addEventListener('click', function (event) {
            event.stopPropagation();
            var opening = menu.hidden;
            menu.hidden = !opening;
            button.setAttribute('aria-expanded', String(opening));
        });
        document.addEventListener('click', function (event) {
            if (!menu.hidden && !wrap.contains(event.target)) close();
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') close();
        });

        wrap.appendChild(button);
        wrap.appendChild(menu);
        container.appendChild(wrap);
    };
})();
</script>

        </button>
        <div class="flex items-center gap-4">
            
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-surface-variant border border-outline-variant/30 hover:scale-110 transition-all flex items-center justify-center">
                <span id="themeIcon" class="material-symbols-outlined text-[#FFB300]">dark_mode</span>
            </button>
            <div id="accountMenuSlot"></div>
        </div>
    </header>

    <main class="w-full sm:w-[calc(100%-16rem)] sm:ml-64 pt-20 sm:pt-24 px-4 sm:px-6 lg:px-10 pb-10 sm:pb-12">
        <div class="max-w-[1400px] mx-auto space-y-8">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-3xl sm:text-4xl lg:text-3xl sm:text-4xl lg:text-5xl font-black font-headline tracking-tighter text-on-surface mb-1">Review Moderation</h1>
                    <p class="text-on-surface-variant">Approve, moderate, hide, or delete community posts dynamically.</p>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-panel p-6 rounded-2xl">
                    <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">Average Rating</p>
                    <h3 class="text-3xl font-extrabold text-primary">4.8</h3>
                </div>
                <div class="glass-panel p-6 rounded-2xl">
                    <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">Total Reviews</p>
                    <h3 class="text-3xl font-extrabold text-on-surface">128</h3>
                </div>
                <div class="glass-panel p-6 rounded-2xl border-l-4 border-amber-500">
                    <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">Pending Actions</p>
                    <h3 class="text-3xl font-extrabold text-amber-400">12</h3>
                </div>
            </div>

            <!-- Review Feed -->
            <div class="glass-panel p-6 rounded-2xl">
                <div id="reviewsListContainer" class="space-y-4">
                    <!-- Dynamic Rows go here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://ztims-api.onrender.com/api/reviews';
        let currentTabFilter = 'all';
        let fullCachedReviewsArray = [];

        // The API sleeps on Render's free tier, so a cold start can take most of a
        // minute — after 5s the spinner says so rather than looking frozen.
        function showLoading(target, message, colspan) {
            const spinner =
                '<div class="flex flex-col items-center justify-center gap-3 py-12 w-full text-center">' +
                    '<div class="w-10 h-10 rounded-full border-4 border-current border-t-transparent animate-spin opacity-80"></div>' +
                    '<p class="text-sm opacity-80">' + message + '</p>' +
                    '<p data-slow class="text-xs opacity-60 hidden">Waking the server — this can take up to a minute.</p>' +
                '</div>';
            target.innerHTML = colspan ? '<tr><td colspan="' + colspan + '">' + spinner + '</td></tr>' : spinner;
            const timer = setTimeout(() => {
                const note = target.querySelector('[data-slow]');
                if (note) note.classList.remove('hidden');
            }, 5000);
            return () => clearTimeout(timer);
        }

        function setButtonLoading(btn, label) {
            if (!btn) return () => {};
            const originalHTML = btn.innerHTML;
            const wasDisabled = btn.disabled;
            btn.disabled = true;
            btn.innerHTML =
                '<span class="inline-block w-3 h-3 rounded-full border-2 border-current border-t-transparent animate-spin align-[-1px] mr-1.5"></span>' + label;
            return () => {
                btn.innerHTML = originalHTML;
                btn.disabled = wasDisabled;
            };
        }

        async function loadAdminReviewsData() {
            const container = document.getElementById('reviewsListContainer');
            if (!container) return;

            const doneLoading = showLoading(container, 'Loading reviews...');

            try {
                // Fetch full data array from your server.js API
                const baseResponse = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` } });
                const rawData = await baseResponse.json();

                // Normalize data structure seamlessly to support backend schema layout keys
                fullCachedReviewsArray = rawData.map(rev => ({
                    _id: rev._id,
                    status: rev.status || 'approved', // Defaults to approved if no moderation status exists
                    rating: rev.rating || 5,
                    spotName: rev.destinationId || 'Zamboanguita Destination', // Map destinationId to spotName
                    userName: rev.guestName || 'Anonymous Traveler',           // Map guestName to userName
                    reviewText: rev.comment || '',                              // Map comment to reviewText
                    userAvatar: rev.userAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde',
                    createdAt: rev.createdAt
                }));

                // Track state numbers on upper widgets metrics
                calculateSystemMetrics(fullCachedReviewsArray);

                // Filter content matching active UI options
                let displayedReviews = [...fullCachedReviewsArray];

                if (currentTabFilter !== 'all') {
                    displayedReviews = displayedReviews.filter(r => r.status === currentTabFilter);
                }

                const destSelectElement = document.getElementById('destinationFilterSelect');
                const destSelect = destSelectElement ? destSelectElement.value : 'all';
                if (destSelect !== 'all') {
                    displayedReviews = displayedReviews.filter(r => r.spotName === destSelect);
                }

                // Render out matching structured cards
                renderReviewCards(displayedReviews);

            } catch (err) {
                console.error("Database connection runtime loop interrupted:", err);
                container.innerHTML = `<p class="text-error text-center py-8 font-medium">Failed to connect to backend engine loop. Ensure server.js is running.</p>`;
            } finally {
                doneLoading();
            }
        }

        function renderReviewCards(reviews) {
            const container = document.getElementById('reviewsListContainer');
            if (!container) return;
            container.innerHTML = '';

            const footerCounter = document.getElementById('footerCounterString');

            if (!reviews || reviews.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-12 rounded-xl text-center">
                        <span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2">folder_open</span>
                        <p class="text-on-surface-variant text-sm font-medium">No reviews found matching the selected parameters.</p>
                    </div>`;
                if (footerCounter) footerCounter.innerText = "Showing 0 reviews";
                return;
            }

            if (footerCounter) footerCounter.innerText = `Showing ${reviews.length} total entries`;

            reviews.forEach(review => {
                const reviewStatus = review.status;
                const reviewRating = review.rating;
                const spotName = review.spotName;
                const userName = review.userName;
                const reviewText = review.reviewText;
                const userAvatar = review.userAvatar;

                let badgeStyle = 'bg-green-500/10 text-green-400';
                if (reviewStatus === 'pending') badgeStyle = 'bg-amber-500/10 text-amber-400';
                if (reviewStatus === 'hidden') badgeStyle = 'bg-zinc-500/20 text-zinc-400';
                if (reviewStatus === 'reported') badgeStyle = 'bg-red-500/10 text-red-400';

                const dateString = review.createdAt ? new Date(review.createdAt).toLocaleDateString('en-US', {
                    month: 'long', day: 'numeric', year: 'numeric'
                }) : 'Just Now';

                let dynamicStars = '';
                for (let i = 1; i <= 5; i++) {
                    dynamicStars += `<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' ${i <= reviewRating ? 1 : 0};">star</span>`;
                }

                const cardHtml = `
                    <div class="glass-card p-4 sm:p-6 rounded-xl hover:bg-surface-variant/40 transition-all duration-300">
                        <div class="flex flex-col lg:flex-row gap-4 sm:gap-6">
                            <div class="flex-1 flex gap-4">
                                <img class="w-12 h-12 rounded-full object-cover border border-zinc-800" src="${userAvatar}" alt="User Avatar"/>
                                <div class="space-y-1.5 flex-1">
                                    <div class="flex items-center gap-3">
                                        <h4 class="font-bold text-on-surface font-headline">${userName}</h4>
                                        <span class="px-2.5 py-0.5 ${badgeStyle} text-[10px] uppercase font-black rounded tracking-widest">${reviewStatus}</span>
                                    </div>
                                    <div class="flex items-center gap-1 text-primary">
                                        ${dynamicStars}
                                        <span class="ml-2 text-xs text-on-surface-variant font-medium">${dateString}</span>
                                    </div>
                                    <p class="text-on-surface-variant text-sm leading-relaxed max-w-3xl sm:pr-4 mt-1 font-medium break-words">"${reviewText}"</p>
                                    <div class="flex items-center gap-1.5 pt-1 text-xs font-bold text-primary">
                                        <span class="material-symbols-outlined text-sm">location_on</span>
                                        ${spotName}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex flex-row flex-wrap lg:flex-col justify-end gap-2 lg:min-w-[140px] h-fit w-full lg:w-auto self-stretch lg:self-center">
                                ${reviewStatus !== 'approved' ? `
                                    <button onclick="updateStatusHandler('${review._id}', 'approved', this)" class="flex-1 min-h-[40px] py-2.5 px-3 text-xs font-bold text-on-surface bg-surface-container-high rounded-lg hover:bg-primary/20 hover:text-primary transition-all flex items-center justify-center gap-1.5">
                                        <span class="material-symbols-outlined text-sm">check_circle</span> Approve
                                    </button>
                                ` : ''}
                                
                                ${reviewStatus !== 'hidden' ? `
                                    <button onclick="updateStatusHandler('${review._id}', 'hidden', this)" class="flex-1 min-h-[40px] py-2.5 px-3 text-xs font-bold text-on-surface bg-surface-container-high rounded-lg hover:bg-stone-700 transition-all flex items-center justify-center gap-1.5">
                                        <span class="material-symbols-outlined text-sm">visibility_off</span> Hide
                                    </button>
                                ` : ''}

                                <button onclick="deleteEntryHandler('${review._id}', this)" class="flex-1 min-h-[40px] py-2.5 px-3 text-xs font-bold text-error bg-error/10 rounded-lg hover:bg-error hover:text-white transition-all flex items-center justify-center gap-1.5">
                                    <span class="material-symbols-outlined text-sm">delete</span> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function calculateSystemMetrics(arr) {
            const totalCountLabel = document.getElementById('metricTotalCount');
            const pendingCountLabel = document.getElementById('metricPendingCount');
            const averageRatingLabel = document.getElementById('metricAverageRating');

            if (totalCountLabel) totalCountLabel.innerText = arr.length;
            
            const pendingArr = arr.filter(r => r.status === 'pending');
            if (pendingCountLabel) pendingCountLabel.innerText = pendingArr.length;

            const approvedArr = arr.filter(r => r.status === 'approved');
            if (approvedArr.length === 0) {
                if (averageRatingLabel) averageRatingLabel.innerText = "0.0";
                renderMetricStars(0);
                return;
            }

            const totalSum = approvedArr.reduce((acc, current) => acc + current.rating, 0);
            const avg = (totalSum / approvedArr.length).toFixed(1);
            if (averageRatingLabel) averageRatingLabel.innerText = avg;
            renderMetricStars(Math.round(avg));
        }

        function renderMetricStars(count) {
            const starBox = document.getElementById('metricStarsContainer');
            if (!starBox) return;
            starBox.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                starBox.insertAdjacentHTML('beforeend', `<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' ${i <= count ? 1 : 0};">star</span>`);
            }
        }

        // Neither handler restores its button on success — the feed re-renders and
        // the button is replaced along with its card.
        async function updateStatusHandler(id, nextState, button) {
            const restoreButton = setButtonLoading(button, nextState === 'approved' ? 'Approving...' : 'Hiding...');
            try {
                const response = await fetch(`${API_URL}/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` },
                    body: JSON.stringify({ status: nextState })
                });

                if (response.ok) {
                    await loadAdminReviewsData();
                } else {
                    restoreButton();
                    showToast('The server would not change that review\u2019s status.', 'error');
                }
            } catch (err) {
                restoreButton();
                console.error("Error patching state attribute:", err);
            }
        }

        async function deleteEntryHandler(id, button) {
            if (!confirm("Are you sure you want to permanently delete this user review from the database?")) return;

            const restoreButton = setButtonLoading(button, 'Deleting...');
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` } });
                if (response.ok) {
                    await loadAdminReviewsData();
                } else {
                    restoreButton();
                    showToast('That review could not be deleted.', 'error');
                }
            } catch (err) {
                restoreButton();
                console.error("Network deletion runtime trace failed:", err);
            }
        }

        function handleSearchFilter() {
            const queryElement = document.getElementById('reviewSearchInput');
            const query = queryElement ? queryElement.value.toLowerCase().trim() : '';
            let subset = [...fullCachedReviewsArray];

            if (currentTabFilter !== 'all') {
                subset = subset.filter(r => r.status === currentTabFilter);
            }

            const destSelectElement = document.getElementById('destinationFilterSelect');
            const destSelect = destSelectElement ? destSelectElement.value : 'all';
            if (destSelect !== 'all') {
                subset = subset.filter(r => r.spotName === destSelect);
            }

            if (query) {
                subset = subset.filter(r => 
                    (r.userName && r.userName.toLowerCase().includes(query)) || 
                    (r.reviewText && r.reviewText.toLowerCase().includes(query))
                );
            }

            renderReviewCards(subset);
        }

        function switchModerationTab(tab) {
            currentTabFilter = tab;
            const buttons = document.querySelectorAll('#filterTabsContainer button');
            
            buttons.forEach(btn => {
                if (btn.id === `btnTab-${tab}`) {
                    btn.className = "px-6 py-2 rounded-full bg-primary text-on-primary-container font-bold text-sm transition-all shadow-md";
                } else {
                    btn.className = "px-6 py-2 rounded-full text-on-surface-variant hover:text-on-surface font-bold text-sm transition-all";
                }
            });

            loadAdminReviewsData();
        }

        // Shared with the sidebar's Log Out, so both doors behave identically.
        function signOutStaff() {
            try {
                localStorage.clear();
                sessionStorage.clear();
            } catch (e) { /* private browsing */ }
            if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
            setTimeout(function () { window.location.replace('../../index.html'); }, 600);
        }

        // Who is signed in, in the corner, with the way out of the portal.
        function mountPortalAccountMenu() {
            mountAccountMenu({
                container: document.getElementById('accountMenuSlot'),
                name: 'Tourist Officer',
                email: localStorage.getItem('userEmail') || '',
                items: [
                    { label: 'Settings', icon: 'settings', href: 'admin_profile.html' },
                    { label: 'Sign out', icon: 'logout', danger: true, onSelect: signOutStaff }
                ]
            });
        }


        window.addEventListener('DOMContentLoaded', () => {
            mountPortalAccountMenu();
            const savedTheme = localStorage.getItem("theme");
            const body = document.body;
            const html = document.documentElement;
            const icon = document.getElementById("themeIcon");

            if(savedTheme === "light") {
                body.classList.add("light-mode");
                html.classList.remove("dark");
                if (icon) icon.innerHTML = "dark_mode";
            } else {
                body.classList.remove("light-mode");
                html.classList.add("dark");
                if (icon) icon.innerHTML = "light_mode";
            }

            loadAdminReviewsData();
        });
</script>

<script>
/* Collapsed sidebar state, shared across every portal page via one key. */
(function () {
    var btn = document.getElementById('sidebarToggleBtn');
    var icon = document.getElementById('sidebarToggleIcon');
    if (!btn || !icon) return;

    function apply(collapsed) {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        icon.textContent = collapsed ? 'left_panel_open' : 'left_panel_close';
        var label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        btn.title = label;
        btn.setAttribute('aria-label', label);
    }

    btn.addEventListener('click', function () {
        var collapsed = !document.body.classList.contains('sidebar-collapsed');
        apply(collapsed);
        try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) { /* private browsing */ }
    });

    try { apply(localStorage.getItem('sidebarCollapsed') === '1'); }
    catch (e) { apply(false); }
})();
</script>

<script>
/* Signing out goes straight back to the public site: the session is cleared here
   and the person lands on the main page, instead of stopping at a page whose only
   purpose was to say they had left. */
(function () {
    var link = document.getElementById('logoutLink');
    if (!link) return;

    link.addEventListener('click', function (event) {
        event.preventDefault();
        try {
            localStorage.clear();
            sessionStorage.clear();
        } catch (e) { /* private browsing */ }

        if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
        // replace(), not href: the portal must not come back with the back button.
        setTimeout(function () { window.location.replace('../../index.html'); }, 600);
    });
})();
</script>

<script>
/* The drawer's open state. Only ever active below 640px, where the CSS above
   turns the rail into one; above that the button and scrim are hidden and this
   does nothing. */
(function () {
    var openBtn = document.getElementById('navOpenBtn');
    var scrim = document.getElementById('navScrim');
    var aside = document.querySelector('aside');
    if (!openBtn || !scrim || !aside) return;

    function setOpen(open) {
        document.body.classList.toggle('nav-open', open);
        openBtn.setAttribute('aria-expanded', String(open));
    }

    openBtn.addEventListener('click', function () {
        setOpen(!document.body.classList.contains('nav-open'));
    });
    scrim.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

    // Choosing a destination should take you there, not leave the drawer over it.
    aside.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
    });

    // Rotating to landscape or resizing past the breakpoint must not leave the
    // body locked by a drawer that is no longer on screen.
    window.addEventListener('resize', function () {
        if (window.innerWidth >= 640) setOpen(false);
    });
})();
</script>
