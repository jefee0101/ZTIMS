.material-symbols-outlined {

/* ==========================================================
   COLLAPSIBLE SIDEBAR — identical on every portal page, and the
   collapsed choice is shared, so it survives navigating between them.
   The header and main are sized against the sidebar's 16rem, so all
   three shift together or the layout tears. !important because the
   Tailwind CDN injects its own sm: rules after this block.
   ========================================================== */
[hidden] { display: none !important; }

@media (min-width: 640px) {
    /* Labels collapse by width + opacity rather than display:none, because display
       cannot be animated — it would snap the text away before the rail finishes
       sliding. Everything animates on the same curve and duration so the rail, the
       header, the content and the labels move as one piece. */
    aside, header, main {
        transition: width var(--dur-moderate) var(--ease-standard), padding var(--dur-moderate) var(--ease-standard), margin-left var(--dur-moderate) var(--ease-standard) !important;
    }
    aside .sidebar-label,
    aside .sidebar-brand-full {
        opacity: 1; max-width: 13rem; white-space: nowrap; overflow: hidden;
        transition: opacity var(--dur-fast) var(--ease-standard) 60ms, max-width var(--dur-moderate) var(--ease-standard) !important;
    }
    aside a, aside button:not(#sidebarToggleBtn) {
        transition: gap var(--dur-moderate) var(--ease-standard), padding var(--dur-moderate) var(--ease-standard), color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard) !important;
    }
    body.sidebar-collapsed aside { width: 5rem !important; padding-left: .75rem !important; padding-right: .75rem !important; }
    body.sidebar-collapsed header { width: calc(100% - 5rem) !important; }
    body.sidebar-collapsed main { width: calc(100% - 5rem) !important; margin-left: 5rem !important; }
    body.sidebar-collapsed aside .sidebar-label,
    body.sidebar-collapsed aside .sidebar-brand-full { opacity: 0 !important; max-width: 0 !important; transition-delay: 0s !important; }
    body.sidebar-collapsed .sidebar-brand-short { display: block !important; animation: railBrandIn .3s ease both; }
    body.sidebar-collapsed aside a,
    body.sidebar-collapsed aside button:not(#sidebarToggleBtn) {
        justify-content: center !important;
        gap: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }
}
.sidebar-brand-short { display: none; }

/* ==========================================================
   MOBILE NAVIGATION (below 640px)
   The rail is fixed and 16rem wide at every size, so on a phone it simply sat
   on top of the page: the content began underneath it and could not be read.
   Below 640px it becomes a drawer that slides in from the left, opened by the
   button in the header and closed by the scrim, the Escape key, or choosing a
   destination. The collapse rules above are desktop-only, so the two never meet.
   ========================================================== */
@media (max-width: 639px) {
    aside {
        width: 17rem !important;
        max-width: 86vw !important;
        transform: translateX(-100%);
        transition: transform var(--dur-moderate) var(--ease-decelerate) !important;
    }
    body.nav-open aside {
        transform: none;
        box-shadow: var(--ztims-shadow-overlay);
    }
    header, main {
        width: 100% !important;
        margin-left: 0 !important;
    }
    #navScrim {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: rgb(var(--ztims-background) / .6);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-moderate) var(--ease-standard);
    }
    body.nav-open #navScrim { opacity: 1; pointer-events: auto; }
    body.nav-open { overflow: hidden; }
}
@media (min-width: 640px) {
    #navScrim, #navOpenBtn { display: none !important; }
}

@keyframes railBrandIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an establishment name — must
   wrap rather than push the layout sideways. */
img, svg, video, canvas { max-width: 100%; height: auto; }
body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {              /* Chrome, Safari */
        width: 0;
        height: 0;
        display: none;
    }
}

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: 'rgb(var(--ztims-success))' },
        error:   { icon: 'error',        accent: 'rgb(var(--ztims-error))' },
        info:    { icon: 'info',         accent: 'rgb(var(--ztims-secondary))' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:0',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'color:rgb(var(--ztims-on-surface))',
            'border:1px solid var(--glass-hairline)',
            'border-left:4px solid ' + settings.accent,
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn var(--dur-moderate, 300ms) var(--ease-decelerate, ease-out)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:rgb(var(--ztims-on-surface-variant));font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut 200ms var(--ease-accelerate, ease-in) forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script>
/* ==========================================================
   ACCOUNT AVATAR + MENU (upper right)
   One button showing who is signed in, and a small menu under it. Built in
   JavaScript rather than markup so every page mounts the same thing with its
   own links, the way the toast module is shared.

   mountAccountMenu({ container, name, email, imageUrl, items, signedOutLabel,
                      signedOutHref })
     name / email : shown in the menu's header; the initial becomes the avatar
     imageUrl     : optional photo (Google accounts have one)
     items        : [{ label, icon, href }] or [{ label, icon, onSelect }]
     signedOut*   : when name and email are both empty, the avatar is replaced
                    by this link, so a guest gets a way in rather than a
                    meaningless blank circle
   ========================================================== */
(function () {
    function initialFrom(name, email) {
        var source = (name || email || '').trim();
        return source ? source.charAt(0).toUpperCase() : '?';
    }

    window.mountAccountMenu = function (options) {
        var container = options.container;
        if (!container) return;
        container.innerHTML = '';

        var signedIn = Boolean((options.name || '').trim() || (options.email || '').trim());

        if (!signedIn) {
            var signIn = document.createElement('a');
            signIn.href = options.signedOutHref || '#';
            signIn.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-full border border-current/30 text-sm font-bold hover:opacity-80 transition-opacity';
            signIn.innerHTML = '<span class="material-symbols-outlined !text-lg">account_circle</span>' +
                               '<span>' + (options.signedOutLabel || 'Sign in') + '</span>';
            container.appendChild(signIn);
            return;
        }

        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative';

        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-haspopup', 'menu');
        button.setAttribute('aria-expanded', 'false');
        button.title = options.name || options.email || 'Account';
        button.style.cssText = [
            'display:flex', 'align-items:center', 'justify-content:center',
            'width:2.5rem', 'height:2.5rem', 'border-radius:0',
            'border:2px solid rgb(var(--ztims-secondary) / .55)', 'background:rgb(var(--ztims-surface-variant))',
            'color:rgb(var(--ztims-accent))',
            'font-weight:800', 'font-size:.95rem', 'cursor:pointer', 'overflow:hidden',
            'transition:transform var(--dur-fast) var(--ease-standard)'
        ].join(';');

        if (options.imageUrl) {
            var photo = document.createElement('img');
            photo.src = options.imageUrl;
            photo.alt = '';
            photo.style.cssText = 'width:100%;height:100%;object-fit:cover';
            // A broken photo link would otherwise leave an empty circle.
            photo.addEventListener('error', function () {
                photo.remove();
                button.textContent = initialFrom(options.name, options.email);
            });
            button.appendChild(photo);
        } else {
            button.textContent = initialFrom(options.name, options.email);
        }
        button.addEventListener('mouseenter', function () { button.style.transform = 'scale(1.06)'; });
        button.addEventListener('mouseleave', function () { button.style.transform = 'none'; });

        var menu = document.createElement('div');
        menu.setAttribute('role', 'menu');
        menu.hidden = true;
        menu.style.cssText = [
            'position:absolute', 'top:calc(100% + .6rem)', 'right:0', 'z-index:1500',
            'min-width:15rem', 'padding:.4rem',
            'border-radius:var(--radius-lg, 1rem)',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'border:1px solid var(--glass-hairline)',
            'color:rgb(var(--ztims-on-surface))',
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'transform-origin:top right',
            'animation:ztimsMenuIn var(--dur-base, 220ms) var(--ease-decelerate, ease-out)',
            'font-size:.85rem'
        ].join(';');

        var header = document.createElement('div');
        header.style.cssText = 'padding:.65rem .75rem;border-bottom:1px solid rgb(var(--ztims-outline));margin-bottom:.3rem';
        var nameLine = document.createElement('div');
        nameLine.textContent = options.name || options.email;
        nameLine.style.cssText = 'font-weight:800;word-break:break-word';
        header.appendChild(nameLine);
        if (options.email && options.name) {
            var emailLine = document.createElement('div');
            emailLine.textContent = options.email;
            emailLine.style.cssText = 'font-size:.75rem;color:rgb(var(--ztims-on-surface-variant));word-break:break-all;margin-top:.1rem';
            header.appendChild(emailLine);
        }
        menu.appendChild(header);

        function close() {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
        }

        (options.items || []).forEach(function (item) {
            var entry = document.createElement(item.href ? 'a' : 'button');
            entry.setAttribute('role', 'menuitem');
            if (item.href) entry.href = item.href; else entry.type = 'button';
            entry.style.cssText = [
                'display:flex', 'align-items:center', 'gap:.6rem', 'width:100%',
                'padding:.6rem .75rem', 'border:0', 'border-radius:0',
                'background:none', 'color:' + (item.danger ? 'rgb(var(--ztims-error))' : 'inherit'),
                'font:inherit', 'text-align:left', 'text-decoration:none', 'cursor:pointer'
            ].join(';');
            entry.innerHTML = '<span class="material-symbols-outlined !text-lg">' + (item.icon || 'chevron_right') + '</span>';
            var label = document.createElement('span');
            label.textContent = item.label;   // text, never markup
            entry.appendChild(label);

            entry.addEventListener('mouseenter', function () { entry.style.background = 'rgb(var(--ztims-on-surface) / .06)'; });
            entry.addEventListener('mouseleave', function () { entry.style.background = 'none'; });
            entry.addEventListener('click', function () {
                close();
                if (item.onSelect) item.onSelect();
            });
            menu.appendChild(entry);
        });

        button.addEventListener('click', function (event) {
            event.stopPropagation();
            var opening = menu.hidden;
            menu.hidden = !opening;
            button.setAttribute('aria-expanded', String(opening));
        });
        document.addEventListener('click', function (event) {
            if (!menu.hidden && !wrap.contains(event.target)) close();
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') close();
        });

        wrap.appendChild(button);
        wrap.appendChild(menu);
        container.appendChild(wrap);
    };
})();
</script>

    <header class="fixed top-0 right-0 w-full sm:w-[calc(100%-16rem)] flex justify-between items-center gap-3 px-4 sm:px-8 py-3 sm:py-4 z-50 glass-nav border-b border-outline-variant/20 transition-colors duration-300">
        <button id="navOpenBtn" type="button" aria-label="Open navigation" aria-expanded="false"
                class="sm:hidden p-2.5 -ml-1 rounded-xl text-on-surface hover:bg-on-surface/5 transition-colors flex items-center justify-center min-h-[44px] min-w-[44px]">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="flex items-center gap-4">
            
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-surface-variant border border-outline-variant/30 hover:scale-110 transition-all flex items-center justify-center">
                <span id="themeIcon" class="material-symbols-outlined text-accent">dark_mode</span>
            </button>
            <div id="accountMenuSlot"></div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="page-enter w-full sm:w-[calc(100%-16rem)] sm:ml-64 pt-20 sm:pt-24 px-4 sm:px-6 lg:px-10 pb-10 sm:pb-12 min-h-screen transition-colors duration-300">
        <div class="max-w-[1100px] mx-auto space-y-6">

            <div class="flex flex-wrap items-end justify-between gap-4">
                <div class="space-y-2">
                    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black font-headline tracking-tighter text-on-surface">Collections</h1>
                    <span id="gatewayPill" class="tone-pill rounded-pill text-xs font-bold px-3 py-1 inline-flex"></span>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <label for="colMonth" class="sr-only">Month</label>
                    <select id="colMonth" class="field !w-auto min-h-[44px]"></select>
                    <button id="colDownload" type="button" class="btn btn-secondary min-h-[44px]">
                        <span class="material-symbols-outlined !text-base" aria-hidden="true">download</span> Excel
                    </button>
                </div>
            </div>

            <div id="colTiles" class="grid grid-cols-2 xl:grid-cols-4 gap-3"></div>
            <div id="colDuplicates"></div>

            <!-- The payments: counts that filter, the search, one row each. -->
            <section class="space-y-3 min-w-0" aria-labelledby="payHeading">
                <h2 id="payHeading" class="text-xl font-extrabold text-on-surface">Payments</h2>
                <div id="colFilter" class="dest-chips" role="group" aria-label="Show">
                    <button type="button" data-show="all" aria-pressed="true">All <b id="colCountAll">0</b></button>
                    <button type="button" data-show="noor" aria-pressed="false" class="dest-chips__warn">Waiting for an OR <b id="colCountNoOr">0</b></button>
                    <button type="button" data-show="refunded" aria-pressed="false">Refunded <b id="colCountRefunded">0</b></button>
                </div>
                <div class="relative">
                    <label for="colSearch" class="sr-only">Search payments</label>
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant !text-xl pointer-events-none" aria-hidden="true">search</span>
                    <input id="colSearch" type="search" placeholder="Search by reference, ticket code, name or place" class="field !pl-11 w-full min-h-[44px]" autocomplete="off"/>
                </div>
                <div class="glass-panel">
                    <div id="colList" class="divide-y divide-outline-variant/20"></div>
                    <p id="colShown" class="px-5 py-3 border-t border-outline-variant/30 text-support"></p>
                </div>
            </section>

            <section class="glass-panel p-5 sm:p-6 space-y-3 min-w-0">
                <h2 class="text-lg font-extrabold text-on-surface">Day by day</h2>
                <div id="colDaily" class="overflow-auto max-h-[50vh] max-w-3xl"></div>
            </section>

            <section class="glass-panel p-5 sm:p-6 flex flex-wrap items-center justify-between gap-3" aria-labelledby="demoHeading">
                <div>
                    <h2 id="demoHeading" class="text-lg font-extrabold text-on-surface">Demo data</h2>
                    <p id="demoCounts" class="text-support"></p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="demoLoad" type="button" class="btn btn-secondary min-h-[44px]">Load demo data</button>
                    <button id="demoRemove" type="button" class="btn btn-danger min-h-[44px]">Remove demo data</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_BASE = "/api";
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        const authHeaders = extra =>
            Object.assign({ 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` }, extra || {});
        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        const peso = n => {
            const value = Number(n) || 0;
            const cents = Math.round(value * 100) % 100 !== 0;
            return '₱' + value.toLocaleString('en-PH', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
        };
        const METHOD = { gcash: 'GCash', maya: 'Maya', card: 'Card', grabpay: 'GrabPay', shopeepay: 'ShopeePay', qrph: 'QR Ph', bank: 'Online banking', cash: 'Cash' };

        function signOutStaff() {
            try { window.ztimsTheme.clearStorage(); sessionStorage.clear(); } catch (e) { /* private browsing */ }
            if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
            setTimeout(function () { window.location.replace('../../index.html'); }, 600);
        }
        function mountPortalAccountMenu() {
            mountAccountMenu({
                container: document.getElementById('accountMenuSlot'),
                name: localStorage.getItem('userName') || 'Tourism Officer',
                email: localStorage.getItem('userEmail') || '',
                items: [
                    { label: 'Settings', icon: 'settings', href: 'admin_profile.html' },
                    { label: 'Sign out', icon: 'logout', danger: true, onSelect: signOutStaff }
                ]
            });
        }
        function guardOfficerSession() {
            if (localStorage.getItem('userRole') !== 'admin' || !localStorage.getItem('authToken')) {
                window.location.href = '../staff_login.html';
                return false;
            }
            return true;
        }
        function handleExpiredSession() {
            showToast('Your session has expired. Please sign in again.', 'error');
            ['authToken', 'userRole', 'userEmail', 'userId'].forEach(k => localStorage.removeItem(k));
            setTimeout(() => window.location.replace('../staff_login.html'), 900);
        }
        function manilaToday() { return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10); }
        function when(value) {
            return new Date(value).toLocaleString('en-PH', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Manila' });
        }
        function dayLabel(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-PH', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
        }

        let data = null;

        async function load() {
            const month = document.getElementById('colMonth').value;
            document.getElementById('colList').innerHTML = '<div class="ztims-empty">Loading payments…</div>';
            try {
                const res = await fetch(`${API_BASE}/payments?month=${month}`, { headers: authHeaders() });
                if (res.status === 401) { handleExpiredSession(); return; }
                if (!res.ok) throw new Error('The collections could not be loaded.');
                data = await res.json();
                render();
            } catch (error) {
                document.getElementById('colList').innerHTML = `<div class="ztims-empty tone-danger">${escapeHtml(error.message)}</div>`;
            }
        }

        function render() {
            const s = data.summary;
            const g = data.gateway;
            const pill = document.getElementById('gatewayPill');
            pill.className = `${g.online ? 'tone-success' : 'tone-neutral'} tone-pill rounded-pill text-xs font-bold px-3 py-1 inline-flex`;
            pill.textContent = g.online ? 'Online payments on (test mode)'
                : g.reason === 'live_key_refused' ? 'Online payments off: only a Xendit test key is accepted'
                : 'Online payments off: Xendit test key not set';

            const tile = (label, value, sub, tone) => `
                <div class="glass-panel p-4 sm:p-5 space-y-1 min-w-0">
                    <p class="text-sm font-semibold text-on-surface-variant">${label}</p>
                    <p class="text-2xl sm:text-3xl font-black tabular-nums ${tone || 'text-on-surface'}">${value}</p>
                    ${sub ? `<p class="text-support">${sub}</p>` : ''}
                </div>`;
            document.getElementById('colTiles').innerHTML =
                tile('Collected', peso(s.total), s.refunded ? `${peso(s.refunded)} refunded` : '') +
                tile('Online', peso(s.online), '') +
                tile('Onsite', peso(s.counter), '') +
                tile('Waiting for an OR', String(s.awaitingReceipt), '',
                     s.awaitingReceipt ? 'text-error' : 'text-on-surface');

            const dup = data.duplicates || [];
            document.getElementById('colDuplicates').innerHTML = dup.length ? `
                <div class="ztims-card tone-danger p-4 text-sm">
                    <b>${dup.length} payment${dup.length === 1 ? '' : 's'} arrived for something already paid or cancelled.</b>
                    Refund ${dup.length === 1 ? 'it' : 'them'} in the payment service's dashboard:
                    ${dup.map(d => `${escapeHtml(d.reference || d.code)} (${peso(d.amount)}, ${escapeHtml(d.payment_ref)})`).join(' · ')}
                </div>` : '';

            const max = Math.max(1, ...s.daily.map(d => d.entranceFees));
            document.getElementById('colDaily').innerHTML = s.daily.length ? `
                <table class="ztims-table w-full text-left border-collapse text-sm">
                    <thead><tr class="text-label font-bold uppercase tracking-wider border-b border-outline-variant/30">
                        <th class="px-2 py-2">Day</th><th class="px-2 py-2 text-right">Payments</th><th class="px-2 py-2 text-right">Total</th>
                    </tr></thead>
                    <tbody class="divide-y divide-outline-variant/20">${s.daily.map(d => {
                        const total = d.entranceFees;
                        return `<tr>
                            <td class="px-2 py-2 whitespace-nowrap">${dayLabel(d.day)}</td>
                            <td class="px-2 py-2 text-right tabular-nums">${d.count}</td>
                            <td class="px-2 py-2 text-right tabular-nums font-bold text-on-surface">
                                ${peso(total)}
                                <span class="block h-1.5 mt-1 ml-auto" style="width:${(total / max * 100).toFixed(0)}%;background:rgb(var(--brand-tangerine))"></span>
                            </td></tr>`;
                    }).join('')}</tbody>
                </table>` : '<div class="ztims-empty">No payments this month.</div>';

            renderList();
            document.getElementById('demoCounts').textContent = data.demo.payments
                ? `${data.demo.tickets} tickets and ${data.demo.payments} payments, each marked Demo.`
                : 'None loaded.';
        }

        let activeShow = 'all';    // the pressed count: all, noor or refunded
        const waitsForOr = p => !p.receiptNumber && !p.refundedAt;

        function renderList() {
            const q = document.getElementById('colSearch').value.trim().toLowerCase();
            const all = data.payments;
            document.getElementById('colCountAll').textContent = all.length;
            document.getElementById('colCountNoOr').textContent = all.filter(waitsForOr).length;
            document.getElementById('colCountRefunded').textContent = all.filter(p => p.refundedAt).length;
            const rows = all.filter(p =>
                (!q || [p.reference, p.payer, p.place].some(v => String(v || '').toLowerCase().includes(q))) &&
                (activeShow === 'all' || (activeShow === 'noor' ? waitsForOr(p) : p.refundedAt)));
            document.getElementById('colShown').innerHTML = `Showing <b class="text-on-surface">${rows.length}</b> of <b class="text-on-surface">${all.length}</b>`;
            const box = document.getElementById('colList');
            if (!rows.length) { box.innerHTML = `<div class="p-4"><div class="ztims-empty">${all.length ? 'No payment matches.' : 'No payments this month.'}</div></div>`; return; }
            box.innerHTML = rows.map(p => {
                const refunded = p.refundedAt && !p.kept;
                // Read in one order on every row: the place, what was paid for,
                // then each fact with its own label.
                const what = `Entrance tickets${p.people ? ` · ${p.people} ${p.people === 1 ? 'person' : 'people'}` : ''}`;
                const fact = (label, value, mono) => `<div><dt>${label}</dt><dd${mono ? ' class="font-mono"' : ''}>${value}</dd></div>`;
                const facts = [
                    fact('Ticket', escapeHtml(p.reference), true),
                    fact('Paid by', escapeHtml(p.payer || '—')),
                    fact('Paid with', `${escapeHtml(METHOD[p.method] || p.method)}, ${p.channel === 'online' ? 'online' : 'onsite'}`),
                    fact('Paid on', when(p.paidAt))
                ].join('');
                const pills = [
                    p.isDemo ? '<span class="tone-warning tone-pill rounded-pill text-[11px] font-bold px-2 py-0.5">Demo</span>' : '',
                    p.refundedAt ? `<span class="tone-neutral tone-pill rounded-pill text-xs font-bold px-2.5 py-0.5" title="${escapeHtml(p.refundReason)}">${p.kept ? `Part refunded · ${peso(p.refundAmount)} back` : 'Refunded'}</span>` : '',
                    p.ticketStatus === 'used' ? '<span class="tone-info tone-pill rounded-pill text-xs font-bold px-2.5 py-0.5">Used at the entrance</span>' : ''
                ].filter(Boolean).join('');
                const or = p.receiptNumber
                    ? `<span class="pay-row__or"><span>OR no.</span> ${escapeHtml(p.receiptNumber)}</span>`
                    : p.refundedAt ? ''
                    : `<form data-or class="flex gap-1.5"><input name="or" placeholder="OR number" class="field !py-1.5 !w-32 min-h-[40px]" aria-label="OR number for ${escapeHtml(p.reference)}"/><button class="btn btn-primary btn-sm min-h-[40px]">Save</button></form>`;
                const canRefund = !p.refundedAt && p.ticketStatus !== 'used';
                return `
                <div data-id="${escapeHtml(p._id)}" class="pay-row">
                    <div class="pay-row__body${refunded ? ' opacity-60' : ''}">
                        <p class="pay-row__title">${escapeHtml(p.place || '—')}</p>
                        <p class="pay-row__what">${what}</p>
                        <dl class="pay-facts">${facts}</dl>
                        ${pills ? `<div class="dest-row__issues">${pills}</div>` : ''}
                    </div>
                    <p class="pay-row__amount${refunded ? ' line-through opacity-60' : ''}">${peso(p.amount)}</p>
                    <div class="pay-row__actions">
                        ${or}
                        ${canRefund ? `<div class="relative">
                            <button type="button" data-more="${escapeHtml(p._id)}" aria-haspopup="true" aria-expanded="false" aria-label="More for ${escapeHtml(p.reference)}"
                                    class="dest-more"><span class="material-symbols-outlined" aria-hidden="true">more_horiz</span></button>
                            <div class="ztims-dropdown dest-menu" data-menu="${escapeHtml(p._id)}" hidden>
                                <button type="button" data-refund class="is-danger"><span class="material-symbols-outlined" aria-hidden="true">undo</span>Cancel and refund</button>
                            </div>
                        </div>` : '<span class="hidden sm:block w-10 shrink-0" aria-hidden="true"></span>'}
                    </div>
                </div>`;
            }).join('');
        }

        async function send(url, method, body) {
            const res = await fetch(url, { method, headers: authHeaders({ 'Content-Type': 'application/json' }), body: body ? JSON.stringify(body) : undefined });
            if (res.status === 401) { handleExpiredSession(); throw new Error('Signed out.'); }
            const result = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(result.message || `The server refused (status ${res.status}).`);
            return result;
        }

        function wire() {
            const select = document.getElementById('colMonth');
            const today = manilaToday();
            let y = Number(today.slice(0, 4)), m = Number(today.slice(5, 7));
            const options = [];
            for (let i = 0; i < 12; i++) {
                options.push(`<option value="${y}-${String(m).padStart(2, '0')}">${MONTHS[m - 1]} ${y}</option>`);
                if (--m === 0) { m = 12; y--; }
            }
            select.innerHTML = options.join('');
            select.addEventListener('change', load);
            document.getElementById('colSearch').addEventListener('input', () => data && renderList());
            document.getElementById('colFilter').addEventListener('click', event => {
                const chip = event.target.closest('[data-show]');
                if (!chip) return;
                activeShow = chip.dataset.show;
                document.querySelectorAll('#colFilter [data-show]').forEach(btn =>
                    btn.setAttribute('aria-pressed', String(btn.dataset.show === activeShow)));
                if (data) renderList();
            });

            // The ⋯ menu on each row: one open at a time; a click elsewhere or
            // Escape closes it.
            const closeMenus = except => document.querySelectorAll('.dest-menu').forEach(menu => {
                if (menu === except) return;
                menu.hidden = true;
                const opener = document.querySelector(`[data-more="${menu.dataset.menu}"]`);
                if (opener) opener.setAttribute('aria-expanded', 'false');
            });
            document.addEventListener('click', event => {
                const opener = event.target.closest('[data-more]');
                if (opener) {
                    const menu = [...document.querySelectorAll('.dest-menu')].find(m => m.dataset.menu === opener.dataset.more);
                    closeMenus(menu);
                    if (menu) { menu.hidden = !menu.hidden; opener.setAttribute('aria-expanded', String(!menu.hidden)); }
                    return;
                }
                closeMenus();
            });
            document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenus(); });

            document.getElementById('colList').addEventListener('submit', async event => {
                event.preventDefault();
                const row = event.target.closest('[data-id]');
                const value = event.target.elements.or.value.trim();
                if (!value) return;
                try {
                    const r = await send(`${API_BASE}/payments/${row.dataset.id}/receipt`, 'PATCH', { receiptNumber: value });
                    showToast(r.message, 'success');
                    load();
                } catch (e) { showToast(e.message, 'error'); }
            });
            document.getElementById('colList').addEventListener('click', async event => {
                const btn = event.target.closest('[data-refund]');
                if (!btn) return;
                const row = btn.closest('[data-id]');
                const p = data.payments.find(x => x._id === row.dataset.id);
                const values = await ztimsDialog.form({
                    title: `Cancel and refund ${peso(p.amount)} for ${p.reference}?`,
                    message: 'Refunds are for when the office cancels. The ticket is cancelled, and an online payment goes back through the payment service.',
                    confirmLabel: 'Cancel and refund', tone: 'danger',
                    fields: [
                        { name: 'reason', label: 'Reason', placeholder: 'e.g. Bad weather, attraction closed', required: true },
                        { name: 'confirmPassword', label: 'Your password', type: 'password', required: true, autocomplete: 'current-password' }
                    ],
                    validate: v => (!v.reason.trim() ? 'Give the reason.' : !v.confirmPassword ? 'Enter your password to confirm.' : '')
                });
                if (!values) return;
                try {
                    const r = await send(`${API_BASE}/payments/${p._id}/refund`, 'POST', { reason: values.reason.trim(), confirmPassword: values.confirmPassword });
                    showToast(r.message, 'success');
                    load();
                } catch (e) { showToast(e.message, 'error'); }
            });

            document.getElementById('colDownload').addEventListener('click', async () => {
                const btn = document.getElementById('colDownload');
                btn.disabled = true;
                try {
                    const res = await fetch(`${API_BASE}/payments/export.xlsx?month=${select.value}`, { headers: authHeaders() });
                    if (res.status === 401) { handleExpiredSession(); return; }
                    if (!res.ok) throw new Error('The Excel file could not be made.');
                    const url = URL.createObjectURL(await res.blob());
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ZTIMS_Collections_${select.value}.xlsx`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 2000);
                } catch (e) { showToast(e.message, 'error'); }
                finally { btn.disabled = false; }
            });

            document.getElementById('demoLoad').addEventListener('click', async () => {
                const ok = await ztimsDialog.confirm({
                    title: 'Load demo data?',
                    message: 'About three months of sample tickets and payments, each marked Demo. A sample already loaded is replaced; test-mode payments and real records are kept.',
                    confirmLabel: 'Load demo data'
                });
                if (!ok) return;
                const btn = document.getElementById('demoLoad');
                btn.disabled = true;
                try { const r = await send(`${API_BASE}/payments/demo`, 'POST'); showToast(r.message, 'success'); load(); }
                catch (e) { showToast(e.message, 'error'); }
                finally { btn.disabled = false; }
            });
            document.getElementById('demoRemove').addEventListener('click', async () => {
                const values = await ztimsDialog.form({
                    title: 'Remove all demo data?',
                    message: 'Every record marked Demo goes: sample data and test-mode payments, with their tickets. Real records stay.',
                    confirmLabel: 'Remove demo data', tone: 'danger',
                    fields: [{ name: 'confirmPassword', label: 'Your password', type: 'password', required: true, autocomplete: 'current-password' }],
                    validate: v => (v.confirmPassword ? '' : 'Enter your password to confirm.')
                });
                if (!values) return;
                try { const r = await send(`${API_BASE}/payments/demo`, 'DELETE', { confirmPassword: values.confirmPassword }); showToast(r.message, 'success'); load(); }
                catch (e) { showToast(e.message, 'error'); }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!guardOfficerSession()) return;
            mountPortalAccountMenu();
            wire();
            load();
        });
    </script>

<script>
/* Collapsed sidebar state, shared across every portal page via one key. */
(function () {
    var btn = document.getElementById('sidebarToggleBtn');
    var icon = document.getElementById('sidebarToggleIcon');
    if (!btn || !icon) return;

    function apply(collapsed) {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        icon.textContent = collapsed ? 'left_panel_open' : 'left_panel_close';
        var label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        btn.title = label;
        btn.setAttribute('aria-label', label);
    }

    btn.addEventListener('click', function () {
        var collapsed = !document.body.classList.contains('sidebar-collapsed');
        apply(collapsed);
        try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) { /* private browsing */ }
    });

    try { apply(localStorage.getItem('sidebarCollapsed') === '1'); }
    catch (e) { apply(false); }
})();
</script>

<script>
/* Signing out goes straight back to the public site: the session is cleared here
   and the person lands on the main page, instead of stopping at a page whose only
   purpose was to say they had left. */
(function () {
    var link = document.getElementById('logoutLink');
    if (!link) return;

    link.addEventListener('click', function (event) {
        event.preventDefault();
        try {
            window.ztimsTheme.clearStorage();
            sessionStorage.clear();
        } catch (e) { /* private browsing */ }

        if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
        // replace(), not href: the portal must not come back with the back button.
        setTimeout(function () { window.location.replace('../../index.html'); }, 600);
    });
})();
</script>

<script>
/* The drawer's open state. Only ever active below 640px, where the CSS above
   turns the rail into one; above that the button and scrim are hidden and this
   does nothing. */
(function () {
    var openBtn = document.getElementById('navOpenBtn');
    var scrim = document.getElementById('navScrim');
    var aside = document.querySelector('aside');
    if (!openBtn || !scrim || !aside) return;

    function setOpen(open) {
        document.body.classList.toggle('nav-open', open);
        openBtn.setAttribute('aria-expanded', String(open));
    }

    openBtn.addEventListener('click', function () {
        setOpen(!document.body.classList.contains('nav-open'));
    });
    scrim.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

    // Choosing a destination should take you there, not leave the drawer over it.
    aside.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
    });

    // Rotating to landscape or resizing past the breakpoint must not leave the
    // body locked by a drawer that is no longer on screen.
    window.addEventListener('resize', function () {
        if (window.innerWidth >= 640) setOpen(false);
    });
})();
