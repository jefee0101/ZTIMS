<div class="absolute inset-0 bg-gradient-to-r from-black/60 to-transparent flex flex-col justify-between p-16">
<div>

<div>

<div id="rightPanel" class="w-full lg:w-2/5 h-full bg-white dark:bg-surface transition-all duration-500 flex items-center justify-center p-8 overflow-y-auto">
<div class="w-full max-w-md">

<div class="lg:hidden mb-10 text-center">

</div>

<div class="mb-10">

<div class="mb-8 p-1 flex bg-gray-100 dark:bg-gray-800 rounded-xl">

<form id="loginForm" class="space-y-6">

        name="email"

    </div>

  <div>
    <div class="flex justify-between mb-2">

</main>

<script>
function togglePasswordVisibility() {
  const passwordInput = document.getElementById("passwordInput");
  const icon = document.getElementById("togglePasswordIcon");
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    icon.innerHTML = "visibility_off";
  } else {
    passwordInput.type = "password";
    icon.innerHTML = "visibility";
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const body = document.getElementById("body");
  const icon = document.getElementById("themeIcon");
  html.classList.toggle("dark");
  if(html.classList.contains("dark")) {
    body.classList.remove("light-mode");
    body.classList.add("dark-mode");
    icon.innerHTML = "light_mode";
    localStorage.setItem("theme", "dark");
  } else {
    body.classList.remove("dark-mode");
    body.classList.add("light-mode");
    icon.innerHTML = "dark_mode";
    localStorage.setItem("theme", "light");
  }
}

window.onload = () => {
  const savedTheme = localStorage.getItem("theme");
  if(savedTheme === "light") {
    document.documentElement.classList.remove("dark");
    document.getElementById("body").classList.remove("dark-mode");
    document.getElementById("body").classList.add("light-mode");
    document.getElementById("themeIcon").innerHTML = "dark_mode";
  }
}

// --- FIXED BACKEND CONNECTION LOGIC ---
document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault(); 

  const email = document.getElementById('emailInput').value;
  const password = document.getElementById('passwordInput').value;

  // We are on user_login.html, but let's safely deduce role from email address pattern 
  // or set default value to match what the backend authenticates.
  const inferredRole = email.includes('admin') ? 'admin' : 'user';

  const credentials = {
    email: email,
    password: password,
    role: inferredRole
  };

  try {
    const response = await fetch('http://localhost:5000/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(credentials)
    });

    const result = await response.json();

    if (response.ok) {
  alert(`Welcome back! Logging in.`);

  localStorage.setItem('userRole', inferredRole);
  localStorage.setItem('userEmail', email);

  // Dynamically build the path using the current location to keep your live server port active
  const currentPath = window.location.pathname;
  const projectRoot = currentPath.substring(0, currentPath.indexOf('/src/'));

  if (inferredRole === 'admin') {
      // Safely navigate from the user login to the admin landing page
      window.location.href = window.location.origin + projectRoot + "/src/admin/admin_dashboard.html";
  } else {
      // Safely navigate to the user dashboard panel
      window.location.href = window.location.origin + projectRoot + "/src/user/user_dashboard.html"; 
  }
} else {
  alert("Authentication failed: " + (result.message || "Invalid Credentials"));
}

  } catch (error) {
    console.error("Network Error Details:", error);
    alert("Could not connect to the authentication server. Ensure your backend is running.");
  }
});
</script>

</body>
