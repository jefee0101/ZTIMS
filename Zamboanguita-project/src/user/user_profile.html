<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Profile Settings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2E7D32",                   // Vibrant Leaf Green
                        "on-primary": "#FFFFFF",                // White text over green
                        "surface": "var(--color-surface, #051D40)", // Deep Ocean Navy Blue
                        "background": "var(--color-background, #020F24)", // Rich Midnight Blue
                        "surface-variant": "var(--color-surface-variant, #0B2954)", // Medium Ocean Tint
                        "on-surface": "var(--color-on-surface, #FEFCF4)",
                        "on-surface-variant": "var(--color-on-surface-variant, #A0B2C6)",
                        "outline-variant": "#1E3D6B",
                        "primary-container": "#4CAF50",        // Sunset Light Green Accent
                        "secondary-container": "#00838F",      // Pure Ocean Sea Blue
                        "on-secondary-container": "#E0F7FA",
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "sans-serif"],
                        body: ["Plus Jakarta Sans", "sans-serif"],
                    }
                },
            },
        }
    </script>
    <style>
        /* ROOT DARK CONFIG */
        :root {
            --color-surface: #051D40; 
            --color-background: #020F24; 
            --color-surface-variant: #0B2954;
            --color-on-surface: #FEFCF4;
            --color-on-surface-variant: #A0B2C6;
        }

        /* LIGHT MODE HARMONY */
        .light-mode, [class*="light-mode"] {
            --color-surface: #FFFFFF !important;
            --color-background: #F4F7FA !important;
            --color-surface-variant: #E6EEF8 !important;
            --color-on-surface: #020F24 !important;
            --color-on-surface-variant: #4A5D73 !important;
        }

        body, main, header, aside, div, section, button, h1, h2, h3, h4, h5, p, span, a, input, select, textarea, label {
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        /* Mode Structural Enforcement */
        .light-mode { background: #F4F7FA !important; color: #020F24 !important; }
        .light-mode main { background: #F4F7FA !important; }
        .light-mode aside { background: #FFFFFF !important; border-color: #E2E8F0 !important; }
        .light-mode header { background: rgba(255, 255, 255, 0.9) !important; border-color: #E2E8F0 !important; }
        
        .light-mode .glass-card { 
            background: #FFFFFF !important; 
            color: #020F24 !important; 
            border-color: #E2E8F0 !important; 
        }
        
        /* Clear Text Visibility Across Dark and Light Ecosystems */
        .dark input, .dark select, .dark textarea {
            color: #FEFCF4 !important;
            background-color: rgba(11, 41, 84, 0.6) !important;
        }
        .light-mode input, .light-mode select, .light-mode textarea { 
            background: #FFFFFF !important; 
            color: #020F24 !important; 
            border: 1px solid #CBD5E1 !important; 
        }
        
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4,
        .light-mode p:not(#nextDestinationWidget p), 
        .light-mode span:not(.material-symbols-outlined, #nextDestinationWidget span), 
        .light-mode a, .light-mode label { 
            color: #020F24 !important; 
        }
        
        .light-mode .text-primary { color: #2E7D32 !important; }
        .light-mode button:not(.submit-btn) { color: #020F24; }
        .light-mode #themeIcon { color: #FFB300 !important; }
        .light-mode aside .text-on-surface-variant { color: #4A5D73 !important; }
        .light-mode aside a:hover { background-color: #E6EEF8 !important; color: #2E7D32 !important; }

        .glass-card {
            background-color: rgba(11, 41, 84, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 61, 107, 0.3);
        }
    </style>>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary selection:text-on-primary min-h-screen dark:bg-[#020F24] dark:text-[#FEFCF4] bg-[#FEFCF4] text-[#020F24] transition-colors duration-300">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="fixed left-0 top-0 h-full w-64 bg-[#051D40] dark:bg-[#051D40] max-sm:hidden border-r border-outline-variant/30 z-[100] flex flex-col p-6 transition-colors duration-300">
            <div class="mb-10 px-2">
                <h1 class="text-xl font-extrabold text-primary tracking-tight font-headline text-[#2E7D32] dark:text-[#2E7D32]">
                    EXPLORE <br><span class="text-[#FFB300]">ZAMBOANGUITA</span>
                </h1>
            </div>

            <nav class="flex-1 space-y-2 font-body">
                <a class="flex items-center gap-3 text-on-surface-variant dark:text-on-surface-variant px-5 py-3.5 rounded-xl transition-all duration-300 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 hover:translate-x-1" href="user_dashboard.html">
                    <span class="material-symbols-outlined text-[#FFB300]">dashboard</span>
                    <span>Destinations</span>
                </a>
                <a class="flex items-center gap-3 text-on-surface-variant dark:text-on-surface-variant px-5 py-3.5 rounded-xl transition-all duration-300 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 hover:translate-x-1" href="user_booking.html">
                    <span class="material-symbols-outlined text-[#FFB300]">event_available</span>
                    <span>Bookings</span>
                </a>
                <a class="flex items-center gap-3 text-on-surface-variant dark:text-on-surface-variant px-5 py-3.5 rounded-xl transition-all duration-300 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 hover:translate-x-1" href="user_reviews.html">
                    <span class="material-symbols-outlined text-[#FFB300]" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span>Reviews</span>
                </a>
                <a class="flex items-center gap-3 text-on-surface-variant dark:text-on-surface-variant px-5 py-3.5 rounded-xl transition-all duration-300 hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 hover:translate-x-1" href="user_profile.html">
                    <span class="material-symbols-outlined text-[#FFB300]">settings</span>
                    <span class="capitalize">Settings</span>

            </nav>
            
            <div class="mt-auto pt-4 border-t border-outline-variant/30">
                <a class="flex items-center gap-3 text-on-surface-variant dark:text-on-surface-variant px-5 py-3.5 rounded-xl hover:text-red-500 dark:hover:text-red-400 transition-all duration-300 hover:translate-x-1" href="user_logout.html">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Log Out</span>
                </a>
            </div>
        </aside>

        <div class="flex-1 sm:pl-64 flex flex-col min-h-screen">
            <!-- Top Header -->
            <header class="fixed top-0 right-0 w-full sm:w-[calc(100%-16rem)] flex justify-between items-center px-8 py-4 z-50 bg-background/80 dark:bg-[#020F24]/80 backdrop-blur-md border-b border-outline-variant/20 transition-colors duration-300">
                <div class="flex items-center gap-2"></div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-surface-variant dark:bg-surface-variant text-amber-500 dark:text-yellow-400 hover:scale-110 flex items-center justify-center transition-all" aria-label="Toggle Dark Mode">
                        <span id="themeIcon" class="material-symbols-outlined">dark_mode</span>
                    </button>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="pt-24 pb-12 px-6 sm:px-10 flex-1">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    <!-- LEFT COLUMN: Account Information -->
                    <div class="lg:col-span-7 space-y-8">
                        <section class="glass-card rounded-xl p-8 bg-surface-variant/40">
                            <h3 class="text-xl font-headline font-bold text-primary mb-8 flex items-center gap-2">
                                <span class="material-symbols-outlined text-[#FFB300]">person</span> Personal Information
                            </h3>
                            
                            <form id="profileDetailsForm" class="space-y-6">
                                <div class="flex flex-col md:flex-row gap-8 items-start mb-4">
                                    <div class="relative group flex-shrink-0">
                                        <div class="w-32 h-32 rounded-full overflow-hidden border-2 border-primary/20 group-hover:border-primary transition-colors">
                                            <img id="avatarImage" class="w-full h-full object-cover" alt="Profile avatar picture" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80"/>
                                        </div>
                                        <button id="avatarUploadBtn" type="button" class="absolute bottom-0 right-0 bg-primary p-2 rounded-full text-on-primary hover:scale-110 transition-transform shadow-lg flex items-center justify-center">
                                            <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
                                        </button>

                                        <input type="file" id="avatarFileInput" accept="image/*" class="hidden" />

                                        <div>

                                            <input id="profileName" class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-all text-on-surface placeholder-on-surface-variant/40" type="text" required/>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Email Address (Read-only)</label>
                                            <input id="profileEmail" class="w-full bg-surface-variant/20 border border-outline-variant/20 rounded-xl px-4 py-3 opacity-60 cursor-not-allowed text-on-surface" type="email" readonly/>
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-4">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Nationality</label>
                                            <select id="profileNationality" class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-all text-on-surface">
                                                <option value="" class="text-neutral-900">Select Country</option>
                                                <option value="United Kingdom" class="text-neutral-900">United Kingdom</option>
                                                <option value="United States" class="text-neutral-900">United States</option>
                                                <option value="Philippines" class="text-neutral-900">Philippines</option>
                                                <option value="Germany" class="text-neutral-900">Germany</option>
                                                <option value="Russia" class="text-neutral-900">Russia</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Phone Number</label>
                                            <input id="profilePhone" class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-all text-on-surface" type="tel"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Bio</label>
                                        <textarea id="profileBio" class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-colors resize-none text-on-surface" rows="3"></textarea>
                                    </div>
                                </div>
                                <div class="pt-2">
                                    <button type="submit" class="submit-btn w-full md:w-auto px-6 py-3 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold rounded-xl hover:scale-[1.01] active:scale-[0.99] transition-all shadow-md shadow-primary/20">
                                        Save Information Changes
                                    </button>
                                </div>
                            </form>
                        </section>

                        <!-- Preferences Section -->
                        <section class="glass-card rounded-xl p-8 bg-surface-variant/40">
                            <h3 class="text-xl font-headline font-bold text-primary mb-8 flex items-center gap-2">
                                <span class="material-symbols-outlined text-[#FFB300]">tune</span> Preferences
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Language</label>
                                    <select class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-colors text-on-surface">
                                        <option class="text-neutral-900">English (US)</option>
                                        <option class="text-neutral-900">Cebuano</option>
                                        <option class="text-neutral-900">Tagalog</option>
                                        <option class="text-neutral-900">Spanish</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Currency</label>

                                        <option class="text-neutral-900">PHP - Philippine Peso</option>
                                        <option class="text-neutral-900">USD - US Dollar</option>
                                        <option class="text-neutral-900">EUR - Euro</option>
                                    </select>
                                </div>
                            </div>
                        </section>
                    </div>

                    <!-- RIGHT COLUMN: Credentials / Password Reset -->
                    <div class="lg:col-span-5 space-y-8">
                        <section class="glass-card rounded-xl p-8 bg-surface-variant/40">
                            <h3 class="text-xl font-headline font-bold text-primary mb-8 flex items-center gap-2">
                                <span class="material-symbols-outlined text-[#FFB300]">security</span> Security Credentials
                            </h3>
                            <form id="profileSecurityForm" class="space-y-6">

                                </div>
                                <div>

                                    <input id="newPassword" class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-colors text-on-surface placeholder-on-surface-variant/30" placeholder="••••••••" type="password" minlength="6" required/>
                                </div>
                                <div>
                                    <label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Confirm New Password</label>
                                    <input id="confirmNewPassword" class="w-full bg-surface-variant/40 border border-outline-variant/30 rounded-xl px-4 py-3 focus:border-primary focus:ring-0 transition-colors text-on-surface placeholder-on-surface-variant/30" placeholder="••••••••" type="password" minlength="6" required/>
                                </div>

                        <div id="nextDestinationWidget" class="relative h-64 rounded-xl overflow-hidden shadow-2xl border border-outline-variant/20">

                </div>
            </main>
        </div>

    <!-- Scripts Area -->
    <script>
        function toggleDarkMode(){
            const body = document.body;
            const html = document.documentElement;
            const icon = document.getElementById("themeIcon");

            body.classList.toggle("light-mode");
            html.classList.toggle("dark");

            if(body.classList.contains("light-mode")){
                localStorage.setItem("theme", "light");
                icon.innerHTML = "dark_mode";
            } else {
                localStorage.setItem("theme", "dark");
                icon.innerHTML = "light_mode";
            }
        }

        async function initializeNextDestination() {
            const widget = document.getElementById('nextDestinationWidget');
            if (!widget) return;

            const fallbackImages = {
                "apo island": "https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=800&q=80",
                "malatapay": "https://images.unsplash.com/photo-1533777857889-4be7c70b33f7?auto=format&fit=crop&w=800&q=80",
                "thalatta": "https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=80",
                "najandig": "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"
            };

            let liveBookingsList = [];
            const activeUserId = localStorage.getItem('userId');

            if (activeUserId && activeUserId !== "anonymous_guest") {
                try {
                    const response = await fetch(`http://localhost:5000/api/bookings?userId=${activeUserId}`);
                    if (response.ok) {
                        liveBookingsList = await response.json();
                    }
                } catch (err) {
                    console.error("❌ Failed to resolve upcoming itineraries:", err);
                    liveBookingsList = JSON.parse(localStorage.getItem('userBookings')) || [];
                }
            }

            const rightNow = new Date();
            let upcomingTrip = null;

            if (liveBookingsList && liveBookingsList.length > 0) {
                const sortedTrips = liveBookingsList.map(b => {
                    const targetDateStr = b.checkInDate || b.date || b.checkIn;
                    return { ...b, parsedDate: new Date(targetDateStr) };
                }).sort((x, y) => x.parsedDate - y.parsedDate);

                upcomingTrip = sortedTrips.find(t => t.parsedDate >= rightNow.setHours(0,0,0,0));
            }

            if (upcomingTrip) {
                const destLower = (upcomingTrip.destination || "").toLowerCase();
                let matchingHeroBanner = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80";
                
                for (const key in fallbackImages) {
                    if (destLower.includes(key)) {
                        matchingHeroBanner = fallbackImages[key];
                        break;
                    }
                }

                const displayLocationName = upcomingTrip.destination || "Zamboanguita Getaway";
                const displayScheduleDate = upcomingTrip.parsedDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

                widget.innerHTML = `
                    <img class="w-full h-full object-cover" alt="${displayLocationName}" src="${matchingHeroBanner}"/>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-90"></div>
                    <div class="absolute bottom-4 left-6 right-6">
                        <span class="bg-primary/20 text-primary border border-primary/30 text-[10px] uppercase font-bold tracking-widest px-2.5 py-1 rounded-full mb-2 inline-block">
                            Confirmed Next Trip
                        </span>
                        <p class="text-white font-headline font-extrabold text-xl uppercase tracking-tight mt-1 truncate">${displayLocationName}</p>
                        <p class="text-stone-300 text-xs mt-0.5 flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm text-primary">calendar_month</span> ${displayScheduleDate}
                        </p>
                    </div>
                `;
            } else {
                widget.innerHTML = `
                    <img class="w-full h-full object-cover" alt="Scenic Zamboanguita" src="https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=800&q=80"/>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent opacity-80"></div>
                    <div class="absolute bottom-4 left-6">
                        <p class="text-primary font-headline font-extrabold text-lg uppercase tracking-tighter">Your Next Destination</p>
                        <p class="text-stone-300 text-sm">Apo Island Marine Sanctuary</p>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem("theme");
            const body = document.body;
            const html = document.documentElement;
            const icon = document.getElementById("themeIcon");

            if(savedTheme === "light"){
                body.classList.add("light-mode");
                html.classList.remove("dark");
                icon.innerHTML = "dark_mode";
            } else {
                body.classList.remove("light-mode");
                html.classList.add("dark");
                icon.innerHTML = "light_mode";
            }

            const activeUserSession = JSON.parse(localStorage.getItem('currentUser'));
            if (activeUserSession) {
                if(activeUserSession.fullName) document.getElementById('profileName').value = activeUserSession.fullName;
                if(activeUserSession.email) document.getElementById('profileEmail').value = activeUserSession.email;
                if(activeUserSession.phone) document.getElementById('profilePhone').value = activeUserSession.phone;
                if(activeUserSession.bio) document.getElementById('profileBio').value = activeUserSession.bio;
                
                // AUTOMATICALLY MAP AND VIEW NATIONALITY SELECTION
                if(activeUserSession.nationality) {
                    const selectEl = document.getElementById('profileNationality');
                    const targetValue = activeUserSession.nationality.trim();
                    
                    // Verify if choice exists in original dropdown markup
                    let matchingOption = Array.from(selectEl.options).find(opt => opt.value.toLowerCase() === targetValue.toLowerCase());
                    
                    if (matchingOption) {
                        selectEl.value = matchingOption.value;
                    } else if (targetValue !== "") {
                        // Dynamic generation fallback if country is not explicitly listed in static HTML layout
                        const dynamicOpt = document.createElement('option');
                        dynamicOpt.value = targetValue;
                        dynamicOpt.textContent = targetValue;
                        dynamicOpt.className = "text-neutral-900";
                        selectEl.appendChild(dynamicOpt);
                        selectEl.value = targetValue;
                    }
                }
            }

            initializeNextDestination();

            // Newly Added: Handling Avatar upload action dynamically
            const uploadBtn = document.getElementById('avatarUploadBtn');
            const fileInput = document.getElementById('avatarFileInput');
            const avatarImg = document.getElementById('avatarImage');

            if (uploadBtn && fileInput && avatarImg) {
                uploadBtn.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            avatarImg.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        });

        const profileDetailsForm = document.getElementById('profileDetailsForm');
        if (profileDetailsForm) {
            profileDetailsForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                
                const activeUserId = localStorage.getItem('userId');
                if (!activeUserId || activeUserId === "anonymous_guest") {
                    alert("❌ Session Error: Please log in to modify profile configurations.");
                    return;
                }

                const updatedPayload = {
                    fullName: document.getElementById('profileName').value.trim(),
                    phone: document.getElementById('profilePhone').value.trim(),
                    nationality: document.getElementById('profileNationality').value.trim(),
                    bio: document.getElementById('profileBio') ? document.getElementById('profileBio').value.trim() : ""
                };

                try {
                    const response = await fetch(`http://localhost:5000/api/users/${activeUserId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedPayload)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        const cachedSession = JSON.parse(localStorage.getItem('currentUser')) || {};
                        const mergedSession = { ...cachedSession, ...updatedPayload, name: updatedPayload.fullName };
                        localStorage.setItem('currentUser', JSON.stringify(mergedSession));

                        alert("🎉 Profile information synchronized successfully!");
                    } else {
                        alert("Update Failed: " + (result.error || "Could not complete profile save."));
                    }
                } catch (err) {
                    console.error("❌ Communication Error:", err);
                    // Update LocalStorage anyway as fallback
                    const cachedSession = JSON.parse(localStorage.getItem('currentUser')) || {};
                    const mergedSession = { ...cachedSession, ...updatedPayload, name: updatedPayload.fullName };
                    localStorage.setItem('currentUser', JSON.stringify(mergedSession));
                    alert("Profile updated locally. Ensure your backend server is streaming data loops.");
                }
            });
        }

        document.getElementById('profileSecurityForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const currentInputPass = document.getElementById('currentPassword').value;
            const newInputPass = document.getElementById('newPassword').value;
            const confirmInputPass = document.getElementById('confirmNewPassword').value;

            const activeUserSession = JSON.parse(localStorage.getItem('currentUser'));

            if (!activeUserSession) {
                alert("❌ Session Error: Please log in again.");
                return;
            }

            if (activeUserSession.password && currentInputPass !== activeUserSession.password) {
                alert("❌ Authentication Failure: Current password configuration is incorrect.");
                return;
            }

            if (newInputPass !== confirmInputPass) {
                alert("❌ Input Error: Confirmation field doesn't match.");
                return;
            }

            if (currentInputPass === newInputPass) {
                alert("💡 System Notice: New credentials must not match the active account keys.");
                return;
            }

            activeUserSession.password = newInputPass;
            localStorage.setItem('currentUser', JSON.stringify(activeUserSession));

            alert("🎉 Verification Success! Password updated dynamically.");
            this.reset();
        });
    </script>
</body>
</html>
