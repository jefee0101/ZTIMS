                                <p id="routeWhy" class="text-support mt-0.5"></p>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-surface-container-high border border-outline-variant/20 rounded-xl p-4">
                                    <p class="text-label uppercase tracking-widest font-bold mb-1">Distance</p>
                                    <p id="routeDistance" class="text-xl font-display font-bold text-on-surface">—</p>
                                </div>
                                <div class="bg-surface-container-high border border-outline-variant/20 rounded-xl p-4">
                                    <p class="text-label uppercase tracking-widest font-bold mb-1">Estimated time</p>
                                    <p id="routeDuration" class="text-xl font-display font-bold text-on-surface">—</p>
                                </div>
                            </div>
                        </div>

                        <p id="directionsStatus" hidden class="text-support"></p>

                        <div id="directionsMap" hidden class="relative z-0 h-64 sm:h-80 w-full rounded-xl overflow-hidden border border-outline-variant/40 bg-surface-container-high"></div>


                        <a id="openInMapsBtn" href="#" target="_blank" rel="noopener noreferrer"
                           class="w-full bg-surface-container-high border border-outline-variant/40 text-on-surface px-6 py-3.5 min-h-[44px] rounded-full font-display font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2 hover:bg-outline-variant/30 transition-colors">
                            <span class="material-symbols-outlined !text-lg">open_in_new</span> Open in Maps
                        </a>
                        <p class="text-support text-center">
                            ZTIMS shows the route and the estimate. Turn-by-turn navigation continues in your maps app.
                        </p>
                    </div>
                </div>
            </section>
        `;
    }

    /* ---- Book a room (a private place to stay that takes bookings) -------
       A request, not a sale: the resort confirms or declines by email, and its
       payment instructions come with the confirmation. The server prices the
       stay and checks every rule again; this only shows them first. Steps:
       Dates and guests → Rooms (only what is free) → Your details → Payment
       (at the property, or online once the resort confirms) → Sent. */
    const manilaDay = (offsetDays = 0) => new Date(Date.now() + (8 + 24 * offsetDays) * 3600 * 1000).toISOString().slice(0, 10);
    const addDay = (key, n) => { const d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const nightsFrom = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
    const longDay = key => new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }).format(new Date(key + 'T00:00:00Z'));
    const clock12 = hhmm => { const [h, m] = String(hhmm || '00:00').split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
    const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

    async function renderRoomOffer(spot) {
        const slot = document.getElementById('roomOffer');
        if (!slot || !isStayPlace(spot)) return;
        let offer = null;
        try {
            const response = await fetch(`${API_BASE}/rooms/${encodeURIComponent(spot._id)}`);
            if (response.ok) offer = await response.json();
        } catch (e) { /* not taking bookings here: the resort's own link stays */ }
        if (!offer || !offer.open) return;
        const rules = offer.rules;
        const place = offer.spot.enterpriseName || spot.title;
        const times = `Check-in from ${clock12(rules.checkInTime)} · check-out by ${clock12(rules.checkOutTime)}`;
        // The ways this resort takes payment now (the server checks again).
        const pay = offer.payment || { atProperty: true, online: false };

        // Book a room replaces the resort's own booking link.
        actions.rooms = true;
        actions.bookingUrl = '';
        drawActions();
        const linkPanel = document.getElementById('stayLinkPanel');
        if (linkPanel) linkPanel.hidden = true;
        const lowest = Math.min(...offer.rooms.map(r => r.rate));
        slot.innerHTML = `
            <section class="sd-panel" aria-labelledby="stayHeading">
                <h2 id="stayHeading" class="sd-h2">Book your stay</h2>
                <p class="rb-times"><span class="material-symbols-outlined" aria-hidden="true">schedule</span>${escapeHtml(times)}</p>
                <ul class="rb-list">${offer.rooms.map(r => `
                    <li><span><b>${escapeHtml(r.name)}</b> · sleeps ${r.maxGuests}</span><span>${escapeHtml(peso(r.rate))} a night</span></li>`).join('')}
                </ul>
                <button type="button" data-act="rooms" class="btn btn-primary btn-pill min-h-[48px] mt-4">
                    <span class="material-symbols-outlined !text-base" aria-hidden="true">bed</span>Book a room · from ${escapeHtml(peso(lowest))} a night</button>
            </section>`;

        const today = manilaDay(0), last = addDay(today, rules.advanceDays);
        const modal = document.createElement('div');
        modal.id = 'roomModal';
        modal.hidden = true;
        modal.className = 'fixed inset-0 z-[70] bg-black/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.setAttribute('aria-labelledby', 'roomHeading');
        document.body.appendChild(modal);
        const field = (id, label, input) => `<div><label for="${id}" class="bk-label">${label}</label>${input}</div>`;
        modal.innerHTML = `
            <div class="bg-surface border border-outline-variant/40 w-full max-w-xl p-6 sm:p-7 max-h-[95vh] overflow-y-auto relative">
                <button type="button" data-rb-close aria-label="Close"
                        class="absolute top-4 right-4 p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <h3 id="roomHeading" class="text-xl font-display font-bold text-on-surface mb-1 pr-10">Book a room</h3>
                <p class="text-on-surface"><b>${escapeHtml(place)}</b></p>
                <p class="text-support mt-1">${escapeHtml(times)}</p>
                <ol id="rbSteps" class="journey-steps mt-4" aria-label="Booking steps"></ol>

                <form id="roomForm" class="mt-5" novalidate>
                    <div data-rb-step="0" class="bk-group">
                        <h3 class="bk-group-title"><span class="material-symbols-outlined" aria-hidden="true">event</span>Your stay</h3>
                        <div class="bk-row bk-row--2">
                            ${field('rbIn', 'Check-in', `<input id="rbIn" type="date" required min="${today}" max="${last}" value="${today}" class="bk-field"/>`)}
                            ${field('rbOut', 'Check-out', `<input id="rbOut" type="date" required min="${addDay(today, 1)}" max="${addDay(last, rules.maxNights)}" value="${addDay(today, rules.minNights)}" class="bk-field"/>`)}
                        </div>
                        <p id="rbNights" class="rb-nights"></p>
                        <fieldset>
                            <legend class="bk-label">Who is coming</legend>
                            <div class="bk-people">
                                ${[['adults', 'Adults', 1, 1], ['children', 'Children', 0, 0]].map(([key, label, min, value]) => `
                                <div class="bk-person">
                                    <span class="bk-person__name">${label}</span>
                                    <span class="qty" data-qty>
                                        <button type="button" data-step="-1" aria-label="${label}: one fewer">−</button>
                                        <input type="number" id="rb-${key}" min="${min}" max="60" step="1" inputmode="numeric" value="${value}" aria-label="${label}"/>
                                        <button type="button" data-step="1" aria-label="${label}: one more">+</button>
                                    </span>
                                </div>`).join('')}
                            </div>
                        </fieldset>
                    </div>

                    <div data-rb-step="1" hidden>
                        <div class="bk-group">
                            <h3 class="bk-group-title"><span class="material-symbols-outlined" aria-hidden="true">bed</span>Rooms free</h3>
                            <p id="rbWhen" class="rb-nights"></p>
                            <div id="rbRooms" class="rb-rooms"></div>
                        </div>
                    </div>

                    <div data-rb-step="2" hidden class="bk-group">
                        <h3 class="bk-group-title"><span class="material-symbols-outlined" aria-hidden="true">person</span>Your details</h3>
                        <p id="rbWho" class="bk-who"></p>
                        <div class="bk-row bk-row--2">
                            <div id="rbPhoneRow" hidden>${field('rbPhone', 'Phone', '<input id="rbPhone" type="tel" autocomplete="tel" maxlength="40" class="bk-field" placeholder="0917 123 4567"/>')}</div>
                            <div id="rbCountryRow" hidden>${field('rbCountry', 'Country where you live', '<select id="rbCountry" class="bk-field"><option value="">Loading…</option></select>')}</div>
                        </div>
                        ${field('rbNote', 'Note for the resort (optional)', '<textarea id="rbNote" rows="2" maxlength="1000" class="bk-field"></textarea>')}
                        <div class="rb-trap" aria-hidden="true"><label>Website <input id="rbWebsite" type="text" tabindex="-1" autocomplete="off"/></label></div>
                    </div>

                    <div data-rb-step="3" hidden class="bk-group">
                        <h3 class="bk-group-title"><span class="material-symbols-outlined" aria-hidden="true">payments</span>How would you like to pay?</h3>
                        <div class="rb-pay" role="radiogroup" aria-label="Payment">
                            ${pay.atProperty ? `
                            <label class="rb-pay__opt">
                                <input type="radio" name="rbPay" value="property"${pay.atProperty ? ' checked' : ''}/><span class="rb-pay__radio" aria-hidden="true"></span>
                                <span class="rb-pay__body">
                                    <span class="rb-pay__title">Pay at the property <span class="rb-pay__pill rb-pay__pill--teal">Nothing to pay now</span></span>
                                    <span class="rb-pay__text">Pay the resort when you arrive.</span>
                                    <span class="rb-pay__more">How to pay comes with the resort's confirmation.</span>
                                </span>
                            </label>` : ''}
                            ${pay.online ? `
                            <label class="rb-pay__opt">
                                <input type="radio" name="rbPay" value="online"${pay.atProperty ? '' : ' checked'}/><span class="rb-pay__radio" aria-hidden="true"></span>
                                <span class="rb-pay__body">
                                    <span class="rb-pay__title">Pay online <span class="rb-pay__pill">Secure checkout</span></span>
                                    <span class="rb-pay__text">Pay the full amount before you arrive.</span>
                                    <span class="rb-pay__chips" aria-label="Ways to pay"><span>GCash</span><span>Maya</span><span>QR Ph</span><span>Card</span><span>Bank transfer</span></span>
                                    <span class="rb-pay__more">You pay <b>after the resort confirms</b> your request. We email you the link, and it waits in My account. Nothing is charged if the resort declines.</span>
                                </span>
                            </label>` : ''}
                        </div>
                        <p class="rb-pay__note"><span class="material-symbols-outlined" aria-hidden="true">info</span>You can change this from My account until you pay.</p>
                    </div>

                    <div data-rb-step="4" hidden class="rb-sent" aria-live="polite"></div>

                    <div id="rbSummary" class="bk-summary mt-5" aria-live="polite" hidden>
                        <div id="rbLines" class="space-y-1"></div>
                        <p class="bk-summary__total"><span>Total</span><span id="rbTotal"></span></p>
                    </div>
                    <p id="rbError" hidden class="mt-3 text-sm text-error bg-error/10 border border-error/20 px-4 py-3"></p>
                    <div class="rb-foot">
                        <button type="button" id="rbBack" class="btn btn-secondary btn-pill min-h-[48px]" hidden>Back</button>
                        <button type="submit" id="rbNext" class="btn btn-primary btn-pill min-h-[48px]"><span id="rbNextLabel">See free rooms</span></button>
                    </div>
                    <p id="rbPrivacy" class="text-support mt-3" hidden>
                        Your name, email, phone and country go to the resort for this booking only. See the
                        <a href="privacy.html#collect" target="_blank" rel="noopener" class="underline font-bold">Privacy Notice</a>.
                    </p>
                </form>
            </div>`;
        wireQty(modal);

        const $ = id => document.getElementById(id);
        const state = { step: 0, rooms: [], picks: {}, nights: 0 };
        const guests = () => (Number($('rb-adults').value) || 0) + (Number($('rb-children').value) || 0);
        const say = message => { $('rbError').textContent = message || ''; $('rbError').hidden = !message; };

        function show(step) {
            state.step = step;
            modal.querySelectorAll('[data-rb-step]').forEach(p => { p.hidden = Number(p.dataset.rbStep) !== step; });
            $('rbSteps').innerHTML = journeySteps(['Dates and guests', 'Rooms', 'Your details', 'Payment', 'Sent'], step);
            $('rbBack').hidden = step === 0 || step === 4;
            $('rbSummary').hidden = !(step >= 1 && step <= 3);
            $('rbPrivacy').hidden = step !== 2;
            $('rbNextLabel').textContent = ['See free rooms', 'Continue', 'Continue', sendLabel(), 'Done'][step];
            // Each step starts usable; the rooms step's own rule may hold it back.
            $('rbNext').disabled = false;
            say('');
            if (step >= 1 && step <= 3) summarise();
            modal.firstElementChild.scrollTop = 0;
        }

        function drawNights() {
            const a = $('rbIn').value, b = $('rbOut').value;
            const n = a && b ? nightsFrom(a, b) : 0;
            $('rbNights').textContent = n > 0 ? `${plural(n, 'night')} · ${longDay(a)} to ${longDay(b)}` : '';
        }
        $('rbIn').addEventListener('change', () => {
            const a = $('rbIn').value;
            if (!a) return;
            $('rbOut').min = addDay(a, 1);
            if (!$('rbOut').value || $('rbOut').value <= a) $('rbOut').value = addDay(a, rules.minNights);
            drawNights();
        });
        $('rbOut').addEventListener('change', drawNights);
        drawNights();

        /* Step 1: the rooms free on every night of the stay, and the price. */
        async function findRooms() {
            const a = $('rbIn').value, b = $('rbOut').value;
            const n = a && b ? nightsFrom(a, b) : 0;
            if (!a || !b) return say('Choose the check-in and check-out dates.');
            if (n < 1) return say('Check-out must be after check-in.');
            if (n < rules.minNights) return say(`The shortest stay here is ${plural(rules.minNights, 'night')}.`);
            if (n > rules.maxNights) return say(`The longest stay here is ${plural(rules.maxNights, 'night')}.`);
            if (guests() < 1 || (Number($('rb-adults').value) || 0) < 1) return say('At least one adult.');
            const button = $('rbNext');
            button.disabled = true;
            try {
                const response = await fetch(`${API_BASE}/rooms/${encodeURIComponent(spot._id)}/availability?checkIn=${a}&checkOut=${b}`);
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.message || 'The rooms could not be checked just now.');
                state.nights = data.nights;
                state.rooms = data.rooms.filter(r => r.free > 0);
                state.picks = {};
                // One room picked to start with, when one room is enough.
                const fits = state.rooms.find(r => r.maxGuests >= guests());
                if (fits) state.picks[fits._id] = 1;
                drawRooms();
                show(1);
            } catch (e) { say(e.message); }
            // On the rooms step, Continue waits for a room that fits everyone.
            finally { if (state.step === 0) button.disabled = false; else summarise(); }
        }

        function drawRooms() {
            $('rbWhen').textContent = `${longDay($('rbIn').value)} to ${longDay($('rbOut').value)} · ${plural(state.nights, 'night')}`;
            const box = $('rbRooms');
            if (!state.rooms.length) {
                box.innerHTML = '<div class="ztims-empty rb-empty">No rooms are free for those dates. Go back and try other dates.</div>';
                return;
            }
            box.innerHTML = state.rooms.map(r => `
                <div class="rb-room${state.picks[r._id] ? ' is-picked' : ''}" data-room="${escapeHtml(r._id)}">
                    <div class="rb-room__photo">${r.photoUrl ? `<img src="${escapeHtml(r.photoUrl)}" alt="${escapeHtml(r.name)}" loading="lazy"/>` : '<span class="material-symbols-outlined" aria-hidden="true">bed</span>'}</div>
                    <div class="rb-room__body">
                        <p class="rb-room__name">${escapeHtml(r.name)}</p>
                        ${(r.photos || []).length>1?`<details class="rb-room-gallery"><summary>View ${r.photos.length} photos</summary><div class="grid grid-cols-2 gap-2 my-3">${r.photos.map((url,i)=>`<img class="w-full" src="${escapeHtml(url)}" alt="${escapeHtml(r.name)} · photo ${i+1}" loading="lazy"/>`).join('')}</div></details>`:''}
                        <p class="rb-room__facts">${plural(r.beds, 'bed')} · sleeps ${r.maxGuests} · This room</p>
                        ${r.description ? `<p class="rb-room__desc">${escapeHtml(r.description)}</p>` : ''}
                        <p class="rb-room__price"><b>${escapeHtml(peso(r.rate))}</b> a night · ${escapeHtml(peso(r.stayPrice))} for ${plural(state.nights, 'night')}</p>
                    </div>
                    <span class="qty" data-qty>
                        <button type="button" data-step="-1" aria-label="${escapeHtml(r.name)}: one room fewer">−</button>
                        <input type="number" data-room-units="${escapeHtml(r._id)}" min="0" max="${r.free}" step="1" inputmode="numeric" value="${state.picks[r._id] || 0}" aria-label="${escapeHtml(r.name)}: rooms"/>
                        <button type="button" data-step="1" aria-label="${escapeHtml(r.name)}: one room more">+</button>
                    </span>
                </div>`).join('');
            wireQty(box);
            box.querySelectorAll('[data-room-units]').forEach(input => input.addEventListener('input', () => {
                state.picks[input.dataset.roomUnits] = Math.max(0, Math.min(Number(input.max), Math.floor(Number(input.value)) || 0));
                input.closest('.rb-room').classList.toggle('is-picked', state.picks[input.dataset.roomUnits] > 0);
                summarise();
            }));
        }

        const payChoice = () => { const picked = modal.querySelector('input[name="rbPay"]:checked'); return picked ? picked.value : 'property'; };
        const sendLabel = () => payChoice() === 'online' ? 'Send request and pay later' : 'Send request';
        modal.querySelectorAll('input[name="rbPay"]').forEach(r => r.addEventListener('change', () => { if (state.step === 3) $('rbNextLabel').textContent = sendLabel(); }));

        const chosen = () => state.rooms.filter(r => state.picks[r._id] > 0).map(r => ({ room: r, units: state.picks[r._id] }));
        function summarise() {
            const lines = chosen();
            const total = lines.reduce((t, l) => t + l.units * l.room.stayPrice, 0);
            const sleeps = lines.reduce((t, l) => t + l.units * l.room.maxGuests, 0);
            $('rbLines').innerHTML = (lines.length ? lines.map(l =>
                `<p class="bk-summary__line"><span>${l.units} × ${escapeHtml(l.room.name)} · ${plural(state.nights, 'night')}</span><span>${escapeHtml(peso(l.units * l.room.stayPrice))}</span></p>`).join('')
                : '<p class="bk-summary__line"><span>No room chosen yet</span><span></span></p>')
                + `<p class="bk-summary__line"><span>${plural(Number($('rb-adults').value) || 0, 'adult')}${Number($('rb-children').value) ? `, ${plural(Number($('rb-children').value), 'child', 'children')}` : ''}</span><span></span></p>`;
            $('rbTotal').textContent = peso(total);
            const short = lines.length && sleeps < guests();
            if (state.step === 1) {
                $('rbNext').disabled = !lines.length || Boolean(short);
                say(short ? `These rooms sleep ${sleeps}; you are ${guests()}. Add a room.` : '');
            }
        }

        let countriesLoaded = false;
        async function loadCountries() {
            if (countriesLoaded) return;
            try {
                const list = await (await fetch(`${API_BASE}/rooms/countries`)).json();
                $('rbCountry').innerHTML = '<option value="">Choose…</option>' + list.map(c => `<option value="${escapeHtml(c.code)}">${escapeHtml(c.name)}</option>`).join('');
                countriesLoaded = true;
            } catch (e) { $('rbCountry').innerHTML = '<option value="">Could not load the list. Close and try again.</option>'; }
        }

        /* Step 2 → Payment. */
        function checkDetails() {
            const phone = $('rbPhone').value.trim();
            if (!$('rbPhoneRow').hidden && phone.replace(/[^0-9]/g, '').length < 7) return say('Give a phone number the resort can call.');
            if (!$('rbCountryRow').hidden && !$('rbCountry').value) return say('Choose the country where you live.');
            show(3);
        }

        /* Step 3 → Sent. */
        async function send() {
            const phone = $('rbPhone').value.trim();
            const choice = payChoice();
            const button = $('rbNext');
            button.disabled = true;
            $('rbNextLabel').textContent = 'Sending…';
            try {
                const response = await fetch(`${API_BASE}/bookings`, {
                    method: 'POST', headers: visitorHeaders(),
                    body: JSON.stringify({
                        spotId: spot._id, phone, countryCode: $('rbCountry').value, paymentChoice: choice,
                        adults: Number($('rb-adults').value) || 0, children: Number($('rb-children').value) || 0,
                        checkIn: $('rbIn').value, checkOut: $('rbOut').value, note: $('rbNote').value.trim(),
                        rooms: chosen().map(l => ({ roomId: l.room._id, units: l.units })), website: $('rbWebsite').value
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (response.status === 401) { location.assign(signInFor('rooms')); return; }
                if (result.code === 'PROFILE_INCOMPLETE') { $('rbPhoneRow').hidden = false; $('rbCountryRow').hidden = false; show(2); say(result.message); return; }
                if (!response.ok) {
                    // Rooms taken meanwhile: back to the rooms, counted again.
                    if (response.status === 409 && /room|booked|free/i.test(result.message || '')) { await findRooms(); say(result.message); return; }
                    throw new Error(result.message || 'The request could not be sent just now.');
                }
                const sent = modal.querySelector('[data-rb-step="4"]');
                sent.innerHTML = `
                    <span class="rb-sent__icon material-symbols-outlined" aria-hidden="true">mark_email_read</span>
                    <p class="rb-sent__title">Request sent</p>
                    <p>${escapeHtml(place)} will reply by email${rules.responseHours ? ` within ${plural(rules.responseHours, 'hour')}` : ''}. Nothing is booked until it confirms.</p>
                    <p class="rb-sent__label">Your booking code</p>
                    <p class="rb-sent__code">${escapeHtml(result.code || '')}</p>
                    <p class="rb-sent__facts">${longDay($('rbIn').value)} to ${longDay($('rbOut').value)} · ${plural(result.nights || state.nights, 'night')} · ${escapeHtml(peso(result.totalAmount))}</p>
                    ${choice === 'online'
                        ? `<p class="rb-pay__box rb-pay__box--due"><b>Pay ${escapeHtml(peso(result.totalAmount))} online after the resort confirms.</b> We will email you the payment link. Nothing is charged if the resort declines.</p>`
                        : `<p class="rb-pay__box"><b>You pay the resort when you arrive: ${escapeHtml(peso(result.totalAmount))}.</b> How to pay comes with its confirmation.</p>`}
                    <a href="user/account.html#bookings" class="rb-sent__link">See it in My account<span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>`;
                show(4);
            } catch (e) { say(e.message); }
            finally {
                button.disabled = false;
                if (state.step === 3) $('rbNextLabel').textContent = sendLabel();
            }
        }

        $('roomForm').addEventListener('submit', event => {
            event.preventDefault();
            if (state.step === 0) return findRooms();
            if (state.step === 1) { loadCountries(); return show(2); }
            if (state.step === 2) return checkDetails();
            if (state.step === 3) return send();
            closeRooms();
        });
        $('rbBack').addEventListener('click', () => show(Math.max(0, state.step - 1)));
        const closeRooms = () => {
            modal.hidden = true;
            // After a request is sent, the window starts again next time.
            if (state.step === 4) { $('roomForm').reset(); drawNights(); show(0); }
        };
        modal.querySelector('[data-rb-close]').addEventListener('click', closeRooms);
        modal.addEventListener('click', event => { if (event.target === modal) closeRooms(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) closeRooms(); });
        show(0);
    }
    async function openRooms() {
        const modal = document.getElementById('roomModal');
        if (!modal) return;
        const visitor = await needAccount('rooms');
        if (!visitor) return;
        fillWho(visitor, 'rb');
        modal.hidden = false;
    }

    /* − / + steppers ([data-qty]): change the number between the input's own
       min and max, tell the page it changed, and grey out a button at the end
       of its range. */
    function wireQty(root) {
        root.querySelectorAll('[data-qty]').forEach(box => {
            const input = box.querySelector('input');
            const buttons = box.querySelectorAll('[data-step]');
            const bounds = () => [Number(input.min || 0), input.max === '' ? Infinity : Number(input.max)];
            const paint = () => {
                const [min, max] = bounds();
                const n = Number(input.value) || 0;
                buttons.forEach(b => { b.disabled = Number(b.dataset.step) < 0 ? n <= min : n >= max; });
            };
            buttons.forEach(b => b.addEventListener('click', () => {
                const [min, max] = bounds();
                const next = Math.min(max, Math.max(min, (Number(input.value) || 0) + Number(b.dataset.step)));
                input.value = String(next);
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            }));
            input.addEventListener('input', paint);
            input.addEventListener('change', paint);
            paint();
        });
    }

    function wireDirections(spot) {
        const destination = spotPoint(spot);
        const openButton = document.getElementById('getDirectionsBtn');
        if (!destination || !openButton) return;

        const panel = document.getElementById('directionsPanel');
        const originLabel = document.getElementById('originLabel');
        const manualOrigin = document.getElementById('manualOrigin');
        const originSearch = document.getElementById('originSearch');
        const originResults = document.getElementById('originResults');
        const modeRow = document.getElementById('modeRow');
        const routeStats = document.getElementById('routeStats');
        const statusLine = document.getElementById('directionsStatus');

        const mapBox = document.getElementById('directionsMap');
        const openInMaps = document.getElementById('openInMapsBtn');

        // The destination in words, so the panel names both ends of the journey.
        // The listing's own address where it has one, its title otherwise.
        const destinationLabel = document.getElementById('destinationLabel');
        if (destinationLabel) {
            destinationLabel.textContent =
                String(spot.location || '').trim() || String(spot.title || '').trim() || 'This destination';
        }

        // Held in this page only, for as long as the tab is open.
        let origin = null;
        let mode = 'car';
        let modesLoaded = false;
        let map = null;
        let routeLine = null;
        let originMarker = null;

        function setStatus(message, tone) {
            statusLine.textContent = message || '';
            statusLine.hidden = !message;
            statusLine.style.color = tone === 'error' ? '#f87171' : '';
        }

        function refreshMapsLink() {
            openInMaps.href = googleMapsLink(destination, origin, mode);
        }

        async function ensureMap() {
            if (map) return map;
            await loadLeaflet();
            mapBox.hidden = false;

            map = window.L.map(mapBox, { scrollWheelZoom: false }).setView([destination.lat, destination.lng], 14);
            window.L.tileLayer(window.ZTIMS_MAP.OSM_TILES, {
                maxZoom: 19,
                attribution: window.ZTIMS_MAP.OSM_ATTRIBUTION
            }).addTo(map);
            // The same category marker the tourism map uses, so a place looks
            // the same wherever a visitor meets it.
            // Named on the map, not only in a popup — the same as the tourism map.
            window.ZTIMS_MAP.attachLabel(
                window.L.marker([destination.lat, destination.lng], { icon: window.ZTIMS_MAP.markerIcon(spot) })
                    .addTo(map)
                    .bindPopup(spot.title),
                spot
            );
            window.ZTIMS_MAP.watchLabelZoom(map, mapBox);

            // The same control the tourism map uses. On resize it re-frames
            // whatever is currently on screen: the route if one is drawn, the
            // destination on its own if not.
            window.ZTIMS_MAP.addExpandControl(map, mapBox, function () {
                if (routeLine) map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
                else map.setView([destination.lat, destination.lng], 14);
            });

            map.invalidateSize();
            return map;
        }

        async function drawRoute(geometry) {
            await ensureMap();

            if (routeLine) map.removeLayer(routeLine);
            if (originMarker) map.removeLayer(originMarker);

            originMarker = window.L.marker([origin.lat, origin.lng], { icon: window.ZTIMS_MAP.originIcon() })
                .addTo(map)
                .bindPopup('You are here');

            routeLine = window.L.polyline(geometry, { color: '#7A2E00', weight: 5, opacity: 0.9 }).addTo(map);
            map.invalidateSize();
            map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
        }

        async function loadModes() {
            if (modesLoaded) return;
            try {
                const response = await fetch(`${API_BASE}/directions/capabilities`);
                const data = await response.json();
                const modes = Array.isArray(data.modes) ? data.modes : [];
                if (!modes.length) return;

                // Only what the configured routing service can genuinely calculate
                // is offered — never a mode whose time would have to be invented.
                mode = modes.some(function (one) { return one.id === 'car'; }) ? 'car' : modes[0].id;
                modeRow.innerHTML = '';
                modes.forEach(function (option) {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.dataset.mode = option.id;
                    chip.textContent = option.label;
                    chip.className = 'px-4 py-2.5 min-h-[44px] rounded-full text-xs font-bold border transition-colors';
                    chip.addEventListener('click', function () {
                        if (mode === option.id) return;
                        mode = option.id;
                        paintModes();
                        refreshMapsLink();
                        requestRoute();
                    });
                    modeRow.appendChild(chip);
                });
                modeRow.hidden = false;
                paintModes();
                modesLoaded = true;
            } catch (error) {
                /* The route request below reports the real problem honestly. */
            }
        }

        function paintModes() {
            [...modeRow.querySelectorAll('button')].forEach(function (chip) {
                const active = chip.dataset.mode === mode;
                chip.className = 'px-4 py-2.5 min-h-[44px] rounded-full text-xs font-bold border transition-colors '
                    + (active
                        ? 'bg-primary text-on-primary border-primary'
                        : 'bg-surface-container-high text-on-surface-variant border-outline-variant/40 hover:bg-outline-variant/30');
            });
        }

        /* Says which of the routes the service offered is the one being shown, and
           why it won. Everything here comes from the routing provider's own reply:
           the road name it reports the route mostly follows, how many routes it
           returned, and the gap between the quickest and the slowest by its own
           estimate. Where it offers no names, the panel says how the choice was
           made and nothing more — an invented description would be worse than
           none. */
        function paintRouteChoice(data) {
            const box = document.getElementById('routeChoice');
            const via = document.getElementById('routeVia');
            const why = document.getElementById('routeWhy');
            const compared = Number(data.routesCompared) || 1;
            const saved = Number(data.secondsSavedOverSlowest) || 0;

            if (!data.via && compared < 2) {
                // One unnamed route: there is nothing to say that the distance and
                // time below do not already say.
                box.hidden = true;
                return;
            }

            via.textContent = data.via ? ('via ' + data.via) : 'Quickest available route';
            why.textContent = compared < 2
                ? 'The only route available for this way of travelling.'
                : saved > 60
                    ? `Quickest of ${compared} routes — about ${formatDuration(saved)} faster than the slowest.`
                    : `Quickest of ${compared} routes, which are all close in time.`;
            box.hidden = false;
        }

        async function requestRoute() {
            if (!origin) return;

            routeStats.hidden = true;
            setStatus('Calculating the route…');

            try {
                const query = `fromLat=${origin.lat}&fromLng=${origin.lng}`
                    + `&toLat=${destination.lat}&toLng=${destination.lng}&mode=${encodeURIComponent(mode)}`;
                const response = await fetch(`${API_BASE}/directions/route?${query}`);
                const data = await response.json().catch(function () { return {}; });

                if (!response.ok) throw new Error(data.message || 'Directions are unavailable right now.');

                document.getElementById('routeDistance').textContent = formatDistance(data.distanceMeters);
                document.getElementById('routeDuration').textContent = formatDuration(data.durationSeconds);
                paintRouteChoice(data);
                routeStats.hidden = false;
                setStatus('');

                /* Drawing the route is a separate thing from knowing it. Leaflet
                   comes off a CDN, and when that failed the exception landed in
                   the catch below, which threw away a perfectly good distance and
                   time and put a raw "Cannot read properties of undefined" where
                   the visitor was reading. The numbers are what they came for; the
                   picture is the bonus. */
                try {
                    await drawRoute(data.geometry || []);
                } catch (mapError) {
                    console.error('Could not draw the route:', mapError);
                    setStatus('The map could not be drawn just now, but the route above is correct.');
                }
            } catch (error) {
                // No straight-line stand-in: an honest "unavailable" beats a number
                // the visitor would plan their day around.
                routeStats.hidden = true;
                setStatus(error.message || 'Directions are unavailable right now.', 'error');
            }
        }

        function useOrigin(point, label) {
            origin = point;
            originLabel.textContent = label;
            manualOrigin.hidden = true;
            if (originResults) originResults.hidden = true;
            refreshMapsLink();
            loadModes().then(requestRoute);
        }

        function askForManualOrigin(reason) {
            origin = null;
            originLabel.textContent = reason;
            manualOrigin.hidden = false;
            routeStats.hidden = true;
            setStatus('');
            loadModes();
        }

        function requestDeviceLocation() {
            originLabel.textContent = 'Asking for your location…';

            if (!navigator.geolocation || !window.isSecureContext) {
                askForManualOrigin("We couldn't access your current location on this device.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    useOrigin(
                        { lat: position.coords.latitude, lng: position.coords.longitude },
                        'From: Your current location'
                    );
                },
                function (error) {
                    const reason = error.code === error.PERMISSION_DENIED
                        ? "We couldn't access your current location because permission was declined."
                        : error.code === error.POSITION_UNAVAILABLE
                            ? "We couldn't determine where you are right now."
                            : "Getting your location took too long.";
                    askForManualOrigin(reason);
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
            );
        }

        // explicit: the visitor pressed Search or Enter. While they are still
        // typing, stay quiet until there is something to show — a status line
        // flickering on every keystroke is noise.
        async function searchOrigin(explicit) {
            const query = (originSearch.value || '').trim();
            if (query.length < 3) {
                if (explicit) setStatus('Type at least three characters to search.', 'error');
                return;
            }

            if (explicit) setStatus('Searching…');
            try {
                const response = await fetch(`${API_BASE}/directions/search?q=${encodeURIComponent(query)}`);
                const data = await response.json().catch(function () { return {}; });
                if (!response.ok) throw new Error(data.message || 'Address search is unavailable right now.');

                const list = Array.isArray(data.results) ? data.results : [];
                originResults.innerHTML = '';
                originResults.hidden = list.length === 0;

                list.forEach(function (place) {
                    // textContent, never innerHTML: these labels come from an
                    // outside geocoder and are not markup.
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.textContent = place.label;
                    option.className = 'w-full text-left text-xs px-3 py-2.5 rounded-lg text-on-surface hover:bg-outline-variant/30 transition-colors';
                    option.addEventListener('click', function () {
                        useOrigin({ lat: place.latitude, lng: place.longitude }, `From: ${place.label}`);
                    });
                    originResults.appendChild(option);
                });

                setStatus(list.length ? '' : 'No match found. Try a nearby landmark or town.');
            } catch (error) {
                setStatus(error.message, 'error');
            }
        }

        openButton.addEventListener('click', function () {
            const firstOpen = panel.hidden;
            panel.hidden = false;
            const row = document.querySelector('.sd-two');
            if (row) row.classList.add('is-routing');
            // Available the moment a valid destination is known, whether or not a
            // route could be calculated.
            refreshMapsLink();
            document.getElementById('directionsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Permission is requested when directions are asked for, never on load.
            if (firstOpen) requestDeviceLocation();
        });

        document.getElementById('originSearchBtn').addEventListener('click', function () { searchOrigin(true); });
        originSearch.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); searchOrigin(true); }
        });

        /* Suggestions as you type. Debounced and de-duplicated: every keystroke
           would otherwise be one geocoder call, and both this API and the
           service behind it are rate limited. The button stays for anyone who
           would rather ask explicitly. */
        let originSearchTimer = null;
        let lastOriginQuery = '';
        originSearch.addEventListener('input', function () {
            clearTimeout(originSearchTimer);
            const query = (originSearch.value || '').trim();
            if (query.length < 3) {
                if (originResults) originResults.hidden = true;
                lastOriginQuery = '';
                return;
            }
            originSearchTimer = setTimeout(function () {
                if (query === lastOriginQuery) return;
                lastOriginQuery = query;
                searchOrigin();
            }, 450);
        });
        document.getElementById('retryLocationBtn').addEventListener('click', requestDeviceLocation);

        const asideButton = document.getElementById('asideDirectionsBtn');
        if (asideButton) asideButton.addEventListener('click', function () { openButton.click(); });

        // Arriving from a marker's "Get directions" on the tourism map. The click
        // is replayed rather than the panel opened directly, so there is one path
        // into directions and location permission is still asked for by a
        // deliberate action the visitor took.
        if (new URLSearchParams(window.location.search).get('directions') === '1') {
            openButton.click();
        }
    }

    /* The same category colours the landing cards and the map markers use, so a
       place looks like itself wherever it appears. */
    // The categories live in tourism-map.js (window.ZTIMS_CATEGORIES).
    const CATS = () => window.ZTIMS_CATEGORIES;
    const isStayPlace = spot => CATS().isStay(spot);
    function heroBadge(spot) {
        if (isStayPlace(spot)) return { cls: 'cat-stay', icon: 'hotel' };
        const info = CATS().info(CATS().of(spot)[0]);
        return info ? { cls: 'cat-' + info.cat, icon: info.icon } : { cls: 'cat-attraction', icon: 'photo_camera' };
    }

    /* ---- the visitor's journey: where they are and what comes next ---- */

    // A place's heading category: "Places to stay" for one, else its main one;
    // and the filter Home opens for it.
    const categoryTitle = spot => isStayPlace(spot) ? 'Places to stay' : (CATS().label(CATS().of(spot)[0]) || 'Destinations');
    const categoryKey = spot => isStayPlace(spot) ? 'STAY' : (CATS().of(spot)[0] || '');
    // Its other categories, as small pills under the main badge.
    function moreBadges(spot) {
        const codes = CATS().of(spot).slice(isStayPlace(spot) ? 0 : 1);
        return codes.map(code => {
            const info = CATS().info(code);
            return `<span class="cat-badge cat-${info.cat} !bg-surface !text-[11px] !py-0.5"><span class="material-symbols-outlined !text-sm" aria-hidden="true">${info.icon}</span>${escapeHtml(info.label)}</span>`;
        }).join('');
    }

    // "1 Details  2 Payment  3 Confirmed", the current step marked.
    function journeySteps(labels, current) {
        return labels.map((label, i) => `
            <li class="journey-step${i === current ? ' is-current' : ''}${i < current ? ' is-done' : ''}"${i === current ? ' aria-current="step"' : ''}>
                <span class="journey-step__num">${i < current ? '✓' : i + 1}</span><span>${escapeHtml(label)}</span>
            </li>`).join('');
    }

    // What this destination lets a visitor do, and the buttons for it: under the
    // photo, and fixed to the bottom of a phone's screen.
    const actions = { rooms: false, directions: false, bookingUrl: '' };
    let currentIsStay = false;
    function startActions(spot) {
        currentIsStay = isStayPlace(spot);
        actions.directions = Boolean(spotPoint(spot));
        actions.bookingUrl = safeExternalUrl(spot.bookingUrl) || '';
        drawActions();
    }
    function actionButtons(compact) {
        const size = 'btn-pill' + (compact ? ' flex-1 min-w-0 !px-2 !text-xs' : '');
        const list = [];
        // On a computer, the user's UX Pilot design: Directions solid first, then
        // Book a room outlined beside it.
        if (!compact) {
            if (actions.directions) list.push(`<button type="button" data-act="directions" class="btn btn-primary min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">near_me</span>Directions</button>`);
            const second = actions.directions ? 'btn-secondary' : 'btn-primary';
            if (actions.rooms) list.push(`<button type="button" data-act="rooms" class="btn ${second} min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">bed</span>Book a room</button>`);
            if (actions.bookingUrl) list.push(`<a href="${escapeHtml(actions.bookingUrl)}" target="_blank" rel="noopener noreferrer" class="btn ${second} min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">open_in_new</span>${currentIsStay ? 'Book a room' : 'Book now'}</a>`);
            return list.join('');
        }
        if (actions.rooms) list.push(`<button type="button" data-act="rooms" class="btn btn-primary min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">bed</span>Book a room</button>`);
        if (actions.bookingUrl) list.push(`<a href="${escapeHtml(actions.bookingUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">open_in_new</span>${currentIsStay ? 'Book a room' : 'Book now'}</a>`);
        if (actions.directions) list.push(`<button type="button" data-act="directions" class="btn ${actions.rooms || actions.bookingUrl ? 'btn-highlight' : 'btn-primary'} min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">near_me</span>Directions</button>`);
        return list.join('');
    }
    function drawActions() {
        const bar = document.getElementById('actionBar');
        const phone = document.getElementById('mobileActions');
        const html = actionButtons(false);
        if (bar) { bar.innerHTML = html; bar.hidden = !html; }
        if (phone) {
            phone.innerHTML = actionButtons(true);
            phone.hidden = !html;
            content.classList.toggle('pb-20', Boolean(html));
        }
        honourArrival();
    }
    /* Arriving from a Home page card's action (#rooms) or from
       "What's next" (#directionsSection): go to that action once it exists. */
    const arrivalAct = { '#rooms': 'rooms', '#directionsSection': 'directions' }[window.location.hash] || '';
    let arrivalDone = false;
    // If the action never appears (bookings unavailable), the
    // section that says so is still the place to land.
    if (arrivalAct) setTimeout(() => {
        if (arrivalDone) return;
        arrivalDone = true;
        const id = { rooms: 'spotFacts', directions: 'directionsSection' }[arrivalAct];
        const el = document.getElementById(id);
        if (el && el.offsetHeight) goTo(id);
    }, 3000);
    function honourArrival() {
        if (arrivalDone || !arrivalAct || !actions[arrivalAct]) return;
        arrivalDone = true;
        setTimeout(() => {
            if (arrivalAct === 'rooms') openRooms();
            if (arrivalAct === 'directions') goTo('directionsSection');
        }, 150);
    }
    function goTo(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.addEventListener('click', event => {
        const button = event.target.closest('[data-act]');
        if (!button) return;
        const act = button.dataset.act;
        if (act === 'rooms') openRooms();
        if (act === 'directions') goTo('directionsSection');
    });

    // More places, so a visitor who has finished reading one keeps exploring:
    // the nearest first when both have a map pin, the same kind of place first
    // otherwise.
    function distanceKm(a, b) {
        const rad = d => d * Math.PI / 180;
        const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 6371 * 2 * Math.asin(Math.sqrt(h));
    }
    async function renderRelated(spot) {
        const box = document.getElementById('relatedPlaces');
        if (!box) return;
        let all = [];
        try {
            const response = await fetch(`${API_BASE}/spots`);
            if (response.ok) all = await response.json();
        } catch (error) { return; }
        const here = spotPoint(spot);
        const mine = CATS().of(spot);
        const others = (Array.isArray(all) ? all : []).filter(s => s._id !== spot._id).map(s => {
            const there = spotPoint(s);
            return { spot: s, km: here && there ? distanceKm(here, there) : null, same: CATS().of(s).some(code => mine.includes(code)) };
        });
        if (!others.length) return;
        others.sort((a, b) => (a.km !== null && b.km !== null) ? a.km - b.km
            : (a.same === b.same ? 0 : a.same ? -1 : 1));
        const nearby = here && others[0].km !== null;
        box.innerHTML = `
            <h2 id="relatedHeading" class="sd-h2">${nearby ? 'Nearby places to visit' : 'More places to explore'}</h2>
            <div class="sd-near">${others.slice(0, 3).map(({ spot: s, km }) => {
                const fee = Number(s.entranceFee) || 0;
                const price = isStayPlace(s) ? '' : (fee > 0 ? peso(fee) : 'Free entrance');
                const where = km !== null ? `${km < 1 ? 'Under 1' : km.toFixed(1)} km away` : (s.barangay || s.location || '');
                return `
                <article class="sd-near__card">
                    <div class="sd-near__photo">
                        <img src="${escapeHtml(s.imageUrl || 'https://placehold.co/600x400?text=Zamboanguita')}" alt="" loading="lazy" decoding="async"/>
                    </div>
                    <div class="sd-near__body">
                        <p class="sd-kicker">${escapeHtml(categoryTitle(s))}</p>
                        <h3 class="sd-near__title"><a href="spot.html?spotId=${encodeURIComponent(s._id)}" class="sd-near__link">${escapeHtml(s.title)}</a></h3>
                        <p class="sd-near__meta">${escapeHtml(openLine(s))}</p>
                        ${where ? `<p class="sd-near__meta">${escapeHtml(where)}</p>` : ''}
                        ${price ? `<p class="sd-near__price">${escapeHtml(price)}</p>` : ''}
                    </div>
                </article>`; }).join('')}
            </div>`;
        box.hidden = false;
    }

    // Pesos as visitors read them: ₱50, ₱1,250, ₱12.50.
    function peso(amount) {
        const n = Number(amount) || 0;
        return Number.isInteger(n) ? `₱${n.toLocaleString('en-PH')}` : `₱${n.toFixed(2)}`;
    }

    /* The facts a visitor needs before going, in one row of tiles: when it is
       open, what it costs to get in, any travel fee, and where it is. Only what applies to this place is shown. */
    function openParts(spot) {
        const rawDays = String(spot.workingDays || '').trim();
        const rawTime = String(spot.workingTime || '').trim();
        return {
            days: !rawDays || /^every ?day$/i.test(rawDays) ? 'Every day' : rawDays,
            time: !rawTime || /^all ?day$/i.test(rawTime) ? 'All day' : rawTime
        };
    }
    // "Open every day, 7:00 AM – 5:00 PM", for the nearby cards.
    function openLine(spot) {
        const { days, time } = openParts(spot);
        return `Open ${days === 'Every day' ? 'every day' : days}, ${time === 'All day' ? 'all day' : time}`;
    }
    function glanceFacts(spot) {
        const isStay = isStayPlace(spot);
        const { days, time } = openParts(spot);
        const fee = Number(spot.entranceFee) || 0;
        const travel = Number(spot.travelFee) || 0;
        const facts = [
            { icon: 'schedule', label: isStay ? 'Open' : 'Open', value: days, sub: time },
        ];
        if (!isStay) {
            facts.push({ key: 'entrance', icon: 'payments', label: 'Entrance', value: fee > 0 ? peso(fee) : 'Free', sub: 'Pay onsite' });
            if(spot.studentFee != null) facts.push({label:'Student fee',value:peso(spot.studentFee),sub:'Pay onsite'});
            if(spot.childFee != null) facts.push({label:'Child fee',value:peso(spot.childFee),sub:spot.childAgeMax ? `Up to age ${spot.childAgeMax} · Pay onsite` : 'Pay onsite'});
        }
        if (travel > 0) facts.push({ icon: 'directions_bus', label: 'Travel fee', value: peso(travel), sub: 'estimated' });
        facts.push({ icon: 'location_on', label: 'Barangay', value: spot.barangay || 'Zamboanguita', sub: 'Zamboanguita' });
        return `
            <ul id="spotFacts" class="sd-facts scroll-mt-24" aria-label="At a glance">
                ${facts.map(f => `
                    <li class="sd-fact"${f.key ? ` data-fact="${f.key}"` : ''}>
                        <span class="sd-fact__label">${escapeHtml(f.label)}</span>
                        <span class="sd-fact__value">${escapeHtml(f.value)}</span>
                        ${f.sub || f.key ? `<span class="sd-fact__sub spot-fact__sub"${f.sub ? '' : ' hidden'}>${escapeHtml(f.sub)}</span>` : ''}
                    </li>`).join('')}
            </ul>`;
    }

    /* One column, read top to bottom in the order a visitor asks: what is
       this place, what can I do here, the facts at a glance, about it, photos,
       booking, getting there, and what else is near. */
    function renderSpot(spot) {
        const photos = spotPhotos(spot);
        const contact = safeExternalUrl(spot.bookingUrl) ? '' : bookingPanel(spot);

        // The user's UX Pilot design (November 2026): a rounded photo, the title
        // with its actions beside it, tinted facts, About beside a Getting there
        // card, a photo grid and nearby cards. Styles: .sd-* in theme.css.
        const more = CATS().of(spot).slice(isStayPlace(spot) ? 0 : 1).map(code => CATS().label(code)).filter(Boolean);
        content.innerHTML = `
            <div class="sd-wrap sd-page">
                <figure class="sd-hero">
                    <img src="${escapeHtml(photos[0] || 'https://placehold.co/1600x900?text=Zamboanguita')}" alt="${escapeHtml(spot.title)}"/>
                    <button type="button" class="sv-heart sv-heart--hero" data-save-spot="${escapeHtml(spot._id)}" aria-pressed="false" aria-label="Save this place"><span class="material-symbols-outlined" aria-hidden="true">favorite</span></button>
                </figure>

                <div class="sd-titlebar">
                    <div class="min-w-0">
                        <p class="sd-kicker">${escapeHtml([categoryTitle(spot), ...more].join(' · '))}</p>
                        <h1 class="sd-title">${escapeHtml(spot.title)}</h1>
                        <p class="sd-place"><span class="material-symbols-outlined" aria-hidden="true">location_on</span>${escapeHtml(spot.barangay ? `${spot.barangay}, Zamboanguita` : (spot.location || 'Zamboanguita'))}</p>
                    </div>
                    <div id="actionBar" hidden class="sd-actions hidden lg:flex"></div>
                </div>

                <div id="spotNotices" class="empty:hidden"></div>

                ${glanceFacts(spot)}

                <div class="sd-two">
                    <section class="sd-about">
                        <h2 class="sd-h2">About</h2>
                        ${describe(spot.description)}
                    </section>
                    <aside class="sd-aside">
                        ${directionsSection(spot)}
                    </aside>
                </div>

                ${photoGallerySection(photos)}

                <div id="roomOffer" class="scroll-mt-24 empty:hidden"></div>
                ${safeExternalUrl(spot.bookingUrl) ? `
                <section id="stayLinkPanel" class="sd-panel">
                    <h2 class="sd-h2">${isStayPlace(spot) ? 'Book your stay' : 'Book your visit'}</h2>
                    ${bookingPanel(spot)}
                </section>` : contact ? `
                <section class="sd-panel">
                    <h2 class="sd-h2">Contact</h2>
                    ${contact}
                </section>` : ''}

                <section id="reviews" class="sd-panel scroll-mt-24" aria-labelledby="reviewsHeading"${isStayPlace(spot) ? '' : ' hidden'}></section>

                <section id="relatedPlaces" hidden aria-labelledby="relatedHeading"></section>
            </div>
        `;
    }


    // Photo viewer. Wired once per spot; the thumbnails live inside content that
    // renderSpot replaces, so the click handler sits on the grid itself.
    function wirePhotoLightbox(photos) {
        const grid = document.getElementById('spotGallery');
        if (!grid || photos.length === 0) return;

        const lightbox = document.getElementById('photoLightbox');
        const image = document.getElementById('lightboxImage');
        const counter = document.getElementById('lightboxCounter');
        let index = 0;

        function show(next) {
            index = (next + photos.length) % photos.length;   // wraps both ways
            image.src = photos[index];
            image.alt = `Photo ${index + 1} of ${photos.length}`;
            counter.textContent = `${index + 1} / ${photos.length}`;
        }

        function open(at) {
            show(at);
            lightbox.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function close() {
            lightbox.hidden = true;
            document.body.style.overflow = '';
            image.src = '';
        }

        grid.addEventListener('click', event => {
            const thumb = event.target.closest('[data-photo]');
            if (thumb) open(Number(thumb.dataset.photo));
        });

        document.getElementById('lightboxClose').addEventListener('click', close);
        document.getElementById('lightboxPrev').addEventListener('click', () => show(index - 1));
        document.getElementById('lightboxNext').addEventListener('click', () => show(index + 1));
        lightbox.addEventListener('click', event => { if (event.target === lightbox) close(); });

        document.addEventListener('keydown', event => {
            if (lightbox.hidden) return;
            if (event.key === 'Escape') close();
            if (event.key === 'ArrowLeft') show(index - 1);
            if (event.key === 'ArrowRight') show(index + 1);
        });
    }

    /* The Tourism Office's notices for this place (announcements.js): one
       short line each, linked to the notice on the Announcements page. */
    async function renderNotices(spotId) {
        const N = window.ZTIMS_NOTICES;
        const box = document.getElementById('spotNotices');
        if (!N || !box) return;
        try {
            const { items } = await N.get(API_BASE, `/announcements?spotId=${encodeURIComponent(spotId)}&limit=3`);
            box.innerHTML = items.map(n => `<p class="np-notice">${N.pill(n.category)}<b>Notice: ${N.esc(n.title)}</b>
                <span>${n.category === 'event' ? N.date(n.startsAt) + ', ' + N.when(n) : 'Until ' + N.date(n.endsAt)}</span>
                <a class="np-link" href="announcements.html#n-${encodeURIComponent(n._id)}">Read the notice</a></p>`).join('');
        } catch (error) { /* a missing notice line is no reason to fail the page */ }
    }

    /* Reviews (reviews.js): the average, the count, how many gave each number
       of stars, and the list, newest first. The form shows only to a signed-in
       visitor with a completed stay here — the server checks
       it again — and their own review can be edited or deleted. Hidden reviews
       never come back from the public list. Counts and ratings only. */
    const RV_MAX = 600;
    const starsText = n => '★'.repeat(n) + '☆'.repeat(5 - n);
    const rvDate = iso => new Date(iso).toLocaleDateString('en-PH', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Manila' });
    let rvState = { spotId: '', page: 1, pages: 1, mine: null, canReview: false, editing: false };

    function rvItem(r) {
        return `<li class="rv-item">
            <div class="rv-item__head">
                <span class="rv-avatar" aria-hidden="true">${escapeHtml((r.author || 'V')[0])}</span>
                <div class="min-w-0">
                    <p class="rv-item__who">${escapeHtml(r.author)}</p>
                    <p class="rv-item__meta"><span class="rv-stars" aria-label="${r.rating} out of 5">${starsText(r.rating)}</span> · ${escapeHtml(rvDate(r.createdAt))} · ${r.visit === 'stay' ? 'Stayed here' : 'Visited'}</p>
                </div>
            </div>
            ${r.body ? `<p class="rv-item__body">${escapeHtml(r.body)}</p>` : ''}
        </li>`;
    }

    function rvForm(review) {
        const rating = review ? review.rating : 0;
        return `<form id="rvForm" class="rv-form" novalidate>
            <fieldset class="rv-pick">
                <legend class="rv-label">Your rating</legend>
                <div class="rv-pick__stars">
                    ${[5, 4, 3, 2, 1].map(n => `<input type="radio" name="rvRating" id="rvStar${n}" value="${n}" ${n === rating ? 'checked' : ''}/>
                    <label for="rvStar${n}" title="${n} ${n === 1 ? 'star' : 'stars'}"><span class="sr-only">${n} ${n === 1 ? 'star' : 'stars'}</span><span aria-hidden="true">★</span></label>`).join('')}
                </div>
            </fieldset>
            <label class="rv-label" for="rvBody">Your review <span class="rv-optional">(optional)</span></label>
            <textarea id="rvBody" class="bk-field rv-body" rows="4" maxlength="${RV_MAX}">${escapeHtml(review ? review.body : '')}</textarea>
            <p class="rv-count"><span id="rvCount">${review ? review.body.length : 0}</span> / ${RV_MAX}</p>
            <p id="rvError" class="rv-error" role="alert" hidden></p>
            <div class="rv-form__actions">
                ${review ? '<button type="button" class="hm-btn hm-btn--ghost" data-rv="cancel">Cancel</button>' : ''}
                <button type="submit" class="hm-btn">${review ? 'Save changes' : 'Post review'}</button>
            </div>
        </form>`;
    }

    function rvMine() {
        const box = document.getElementById('rvMine');
        if (!box) return;
        const s = rvState;
        if (!visitorToken()) {
            box.innerHTML = `<a class="rv-signin" href="${escapeHtml(signInFor('reviews'))}"><span class="material-symbols-outlined" aria-hidden="true">rate_review</span>Sign in to write a review</a>`;
            return;
        }
        if (s.mine && !s.editing) {
            box.innerHTML = `<div class="rv-own">
                <p class="rv-label">Your review${s.mine.status === 'hidden' ? ' <span class="tone-pill tone-warning rounded-pill">Hidden by the Tourism Office</span>' : ''}</p>
                <p class="rv-stars rv-stars--lg" aria-label="${s.mine.rating} out of 5">${starsText(s.mine.rating)}</p>
                ${s.mine.body ? `<p class="rv-item__body">${escapeHtml(s.mine.body)}</p>` : ''}
                <div class="rv-form__actions">
                    <button type="button" class="hm-btn hm-btn--ghost" data-rv="edit"><span class="material-symbols-outlined" aria-hidden="true">edit</span>Edit</button>
                    <button type="button" class="hm-btn rv-delete" data-rv="delete"><span class="material-symbols-outlined" aria-hidden="true">delete</span>Delete</button>
                </div>
            </div>`;
            return;
        }
        if (s.mine && s.editing) { box.innerHTML = `<h3 class="rv-h3">Edit your review</h3>${rvForm(s.mine)}`; return; }
        box.innerHTML = s.canReview ? `<h3 class="rv-h3">Write a review</h3>${rvForm(null)}` : '';
    }

    // fresh: after the visitor's own change, past the browser's 30-second copy.
    async function renderReviews(spotId, append, fresh) {
        const section = document.getElementById('reviews');
        if (!section) return;
        rvState.spotId = spotId;
        let data;
        try {
            const response = await fetch(`${API_BASE}/spots/${encodeURIComponent(spotId)}/reviews?page=${rvState.page}`, fresh ? { cache: 'reload' } : {});
            if (!response.ok) throw new Error();
            data = await response.json();
        } catch (e) {
            if (!append) section.innerHTML = '<h2 id="reviewsHeading" class="sd-h2">Reviews</h2><p class="text-on-surface-variant">Reviews could not be loaded.</p>';
            return;
        }
        rvState.pages = data.pages;
        if (append) {
            document.getElementById('rvList').insertAdjacentHTML('beforeend', data.items.map(rvItem).join(''));
        } else {
            const most = Math.max(1, ...Object.values(data.byStars));
            section.innerHTML = `
                <h2 id="reviewsHeading" class="sd-h2">Reviews</h2>
                <div class="rv-top">
                    <div class="rv-summary">
                        ${data.count ? `<p class="rv-average">${data.average.toFixed(1)}</p>
                        <p class="rv-stars rv-stars--lg" aria-label="${data.average} out of 5">${starsText(Math.round(data.average))}</p>
                        <p class="rv-total">${data.count} ${data.count === 1 ? 'review' : 'reviews'}</p>
                        <ul class="rv-bars" aria-label="Reviews by stars">${[5, 4, 3, 2, 1].map(n => `
                            <li><span>${n} ★</span><span class="rv-bar"><span style="width:${(data.byStars[n] / most) * 100}%"></span></span><span>${data.byStars[n]}</span></li>`).join('')}
                        </ul>` : '<p class="rv-total">No reviews yet.</p>'}
                    </div>
                    <div id="rvMine" class="rv-mine empty:hidden"></div>
                </div>
                <ul id="rvList" class="rv-list">${data.items.map(rvItem).join('')}</ul>
                <div class="rv-more"><button type="button" id="rvMore" class="hm-btn hm-btn--ghost" hidden>Show more reviews</button></div>`;
            if (visitorToken()) {
                try {
                    const r = await fetch(`${API_BASE}/spots/${encodeURIComponent(spotId)}/reviews/mine`, { headers: visitorHeaders() });
                    if (r.ok) { const mine = await r.json(); rvState.mine = mine.review; rvState.canReview = mine.canReview; }
                } catch (e) { /* the list still shows */ }
            }
            rvMine();
        }
        document.getElementById('rvMore').hidden = rvState.page >= rvState.pages;
    }

    async function rvSave(form) {
        const picked = form.querySelector('input[name="rvRating"]:checked');
        const error = document.getElementById('rvError');
        error.hidden = true;
        if (!picked) { error.textContent = 'Choose a rating from 1 to 5 stars.'; error.hidden = false; return; }
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        const editing = Boolean(rvState.mine);
        try {
            const response = await fetch(editing ? `${API_BASE}/reviews/${encodeURIComponent(rvState.mine._id)}` : `${API_BASE}/spots/${encodeURIComponent(rvState.spotId)}/reviews`, {
                method: editing ? 'PUT' : 'POST', headers: visitorHeaders(),
                body: JSON.stringify({ rating: Number(picked.value), body: document.getElementById('rvBody').value })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) { error.textContent = data.message || 'Could not save your review.'; error.hidden = false; button.disabled = false; return; }
            showToast(data.message, 'success');
            rvState = Object.assign(rvState, { page: 1, mine: data.review, editing: false, canReview: false });
            renderReviews(rvState.spotId, false, true);
        } catch (e) {
            error.textContent = 'No connection. Check your signal and try again.'; error.hidden = false; button.disabled = false;
        }
    }

    async function rvDelete(button) {
        if (!button.dataset.armed) {
            button.dataset.armed = '1';
            button.lastChild.textContent = 'Press again to delete';
            return;
        }
        button.disabled = true;
        try {
            const response = await fetch(`${API_BASE}/reviews/${encodeURIComponent(rvState.mine._id)}`, { method: 'DELETE', headers: visitorHeaders() });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) { showToast(data.message || 'Could not delete it.', 'error'); button.disabled = false; return; }
            showToast(data.message, 'success');
            rvState = Object.assign(rvState, { page: 1, mine: null, editing: false });
            renderReviews(rvState.spotId, false, true);
        } catch (e) { showToast('No connection. Check your signal and try again.', 'error'); button.disabled = false; }
    }

    document.addEventListener('click', event => {
        const act = event.target.closest('[data-rv]');
        if (act) {
            const what = act.dataset.rv;
            if (what === 'edit') { rvState.editing = true; rvMine(); }
            if (what === 'cancel') { rvState.editing = false; rvMine(); }
            if (what === 'delete') rvDelete(act);
            return;
        }
        if (event.target.closest('#rvMore')) { rvState.page += 1; renderReviews(rvState.spotId, true); }
    });
    document.addEventListener('submit', event => {
        if (event.target.id === 'rvForm') { event.preventDefault(); rvSave(event.target); }
    });
    document.addEventListener('input', event => {
        if (event.target.id === 'rvBody') document.getElementById('rvCount').textContent = event.target.value.length;
        if (event.target.name === 'rvRating') document.getElementById('rvError').hidden = true;
    });

    async function loadSpot() {
        const spotId = new URLSearchParams(window.location.search).get('spotId');

        if (!spotId) {
            renderNotFound('No destination selected');
            return;
        }

        const doneLoading = showLoading(content, 'Loading destination...');

        try {
            const response = await fetch(`${API_BASE}/spots/${encodeURIComponent(spotId)}`);
            if (!response.ok) {
                doneLoading();
                renderNotFound('Destination not found');
                return;
            }

            const spot = await response.json();
            doneLoading();
            renderSpot(spot);
            document.title = `${spot.title} | Zamboanguita`;
            wirePhotoLightbox(spotPhotos(spot));
            wireDirections(spot);
            startActions(spot);
            renderRelated(spot);
            // The footer script may have run before this page was drawn.
            if (window.ztimsEmergency) window.ztimsEmergency.fill();
            renderRoomOffer(spot);
            renderNotices(spotId);
            if (window.ztimsSaved) window.ztimsSaved.refresh();
            (isStayPlace(spot) ? renderReviews(spotId) : Promise.resolve()).then(() => {
                // Back from signing in to review: open on the reviews.
                if (location.hash === '#reviews') document.getElementById('reviews').scrollIntoView();
            });
        } catch (error) {
            console.error('❌ Failed to load destination:', error);
            doneLoading();
            renderNotFound('Unable to load this destination');
        }
    }

    loadSpot();
</script>
</body>
</html>
