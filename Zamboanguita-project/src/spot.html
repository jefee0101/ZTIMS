<script>
/* ==========================================================
   THEME (dark / light)
   Every page used to do this its own way — three different class names, four
   different toggle functions, and the sign-in page following none of them, so
   choosing light on one page did nothing on the next. This is the single
   implementation: it stores one choice and applies every class convention the
   pages' stylesheets rely on, so all of them respond to it.

   window.toggleTheme()            flips and remembers the choice
   window.toggleDarkMode()         the same, under the name inline onclick uses
   window.applyTheme('dark'|'light')
   ========================================================== */
(function () {
    var STORAGE_KEY = 'theme';

    function apply(theme) {
        var dark = theme !== 'light';
        var root = document.documentElement;

        // Pages define their palette against one of these three, depending on
        // when they were written. Setting all of them keeps every page correct
        // without rewriting each stylesheet.
        root.classList.toggle('dark', dark);
        root.classList.toggle('light-mode', !dark);
        if (document.body) {
            document.body.classList.toggle('light-mode', !dark);
            document.body.classList.toggle('dark-mode', dark);
        }

        // A moon while dark, a sun while light — the same way round everywhere.
        var glyph = dark ? 'dark_mode' : 'light_mode';
        ['themeIcon', 'themeToggleIcon'].forEach(function (id) {
            var icon = document.getElementById(id);
            if (icon) icon.textContent = glyph;
        });

        var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        ['themeToggleBtn', 'themeToggleButton'].forEach(function (id) {
            var button = document.getElementById(id);
            if (button) { button.title = label; button.setAttribute('aria-label', label); }
        });
    }

    function current() {
        try { return localStorage.getItem(STORAGE_KEY) === 'light' ? 'light' : 'dark'; }
        catch (e) { return 'dark'; }   // private browsing
    }

    window.applyTheme = apply;

    window.toggleTheme = function () {
        var next = current() === 'light' ? 'dark' : 'light';
        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* private browsing */ }
        apply(next);
    };

    // Pages written earlier call this name from an inline onclick.
    window.toggleDarkMode = window.toggleTheme;

    apply(current());
    // The body classes cannot be set before the body exists, so they are applied
    // again once it does. The html class above already prevents the flash.
    document.addEventListener('DOMContentLoaded', function () { apply(current()); });
})();
</script>

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing in the corner and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: '#2E7D32' },
        error:   { icon: 'error',        accent: '#E53935' },
        info:    { icon: 'info',         accent: '#FFB300' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            'position:fixed', 'top:1rem', 'right:1rem', 'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'gap:.6rem',
            'width:min(24rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateX(1.5rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(1.5rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:.9rem',
            'border-left:4px solid ' + settings.accent,
            'background:rgba(10,25,47,.97)',
            'color:#F4F6F9',
            'box-shadow:0 12px 32px -12px rgba(0,0,0,.6)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn .22s cubic-bezier(.4,0,.2,1)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:#A9BCD0;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut .2s ease forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script type="module">
    const API_BASE = "https://ztims-api.onrender.com/api";
    const content = document.getElementById('spotContent');

    // The API sleeps on Render's free tier, so a cold start can take most of a
    // minute — after 5s the spinner says so rather than looking frozen.
    function showLoading(target, message) {
        target.innerHTML =
            '<div class="flex flex-col items-center justify-center gap-3 py-32 w-full text-center">' +
                '<div class="w-10 h-10 rounded-full border-4 border-current border-t-transparent animate-spin opacity-80"></div>' +
                '<p class="text-sm opacity-80">' + message + '</p>' +
                '<p data-slow class="text-xs opacity-60 hidden">Waking the server — this can take up to a minute.</p>' +
            '</div>';
        const timer = setTimeout(() => {
            const note = target.querySelector('[data-slow]');
            if (note) note.classList.remove('hidden');
        }, 5000);
        return () => clearTimeout(timer);
    }

    function formatPeso(amount) {
        const value = Number(amount) || 0;
        return `₱${value.toFixed(2)}`;
    }

    // Spot text comes from establishment managers and admins, so it is escaped before it
    // reaches innerHTML rather than trusted as markup.
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    // Only http(s) links are allowed through to an href, so a stored value like
    // "javascript:..." can never become a clickable link.
    function safeExternalUrl(value) {
        if (!value) return null;
        let candidate = String(value).trim();
        if (!candidate) return null;
        if (!/^https?:\/\//i.test(candidate)) candidate = 'https://' + candidate;
        try {
            const parsed = new URL(candidate);
            return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : null;
        } catch {
            return null;
        }
    }

    function starRow(rating) {
        const rounded = Math.round(Number(rating) || 0);
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            stars += `<span class="material-symbols-outlined !text-base ${i <= rounded ? 'text-surface-bright' : 'text-on-surface-variant/30'}" style="font-variation-settings:'FILL' ${i <= rounded ? 1 : 0};">star</span>`;
        }
        return stars;
    }

    function renderNotFound(message) {
        content.innerHTML = `
            <div class="flex flex-col items-center justify-center gap-4 py-32 px-8 text-center">
                <span class="material-symbols-outlined !text-6xl text-on-surface-variant/40">travel_explore</span>
                <h1 class="text-3xl font-display font-bold text-on-surface">${escapeHtml(message)}</h1>
                <p class="text-on-surface-variant max-w-md">The destination you're looking for may have been removed, or the link is incorrect.</p>
                <a href="../index.html" class="mt-2 bg-primary text-on-primary px-7 py-3.5 rounded-full font-display font-bold uppercase tracking-widest text-xs btn-primary-gradient">
                    Back to all spots
                </a>
            </div>
        `;
    }

    // The establishment's name, whichever spelling the account was saved under.
    function managerName(owner) {
        return owner?.establishmentName || owner?.resortName || '';
    }

    function bookingPanel(spot) {
        const url = safeExternalUrl(spot.bookingUrl);
        const owner = spot.ownerId && typeof spot.ownerId === 'object' ? spot.ownerId : null;

        if (url) {
            // The href is always the real destination so the link still works with
            // middle-click, "open in new tab", and with JavaScript disabled. The
            // click handler below is what gates it for signed-out visitors.
            return `
                <a id="bookNowBtn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
                   class="w-full bg-primary text-on-primary py-4 rounded-full font-display font-bold uppercase tracking-widest btn-primary-gradient shadow-lg shadow-primary/20 flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform">
                    <span class="material-symbols-outlined">open_in_new</span> Book Now
                </a>
                <p class="text-[11px] text-on-surface-variant text-center mt-3">
                    Booking is handled on ${escapeHtml(managerName(owner) || 'the establishment')}'s own website. This opens in a new tab.
                </p>
            `;
        }

        // No booking link on file — give the visitor a way to reach the resort
        // instead of a button that goes nowhere.
        const contactLines = [];
        if (managerName(owner)) contactLines.push(`<p class="text-sm text-on-surface font-bold">${escapeHtml(managerName(owner))}</p>`);
        // The person to ask for, when the office recorded one.
        if (owner?.managerName) {
            contactLines.push(`<p class="text-xs text-on-surface-variant">Managed by ${escapeHtml(owner.managerName)}</p>`);
        }
        if (owner?.phone) {
            contactLines.push(`<a href="tel:${escapeHtml(owner.phone)}" class="text-sm text-primary font-bold flex items-center justify-center gap-1.5 hover:underline">
                <span class="material-symbols-outlined !text-base">call</span>${escapeHtml(owner.phone)}
            </a>`);
        }
        // Only the public address ever reaches this page; the sign-in email stays private.
        if (owner?.contactEmail) {
            contactLines.push(`<a href="mailto:${escapeHtml(owner.contactEmail)}" class="text-sm text-primary font-bold flex items-center justify-center gap-1.5 hover:underline break-all">
                <span class="material-symbols-outlined !text-base">mail</span>${escapeHtml(owner.contactEmail)}
            </a>`);
        }

        return `
            <div class="w-full bg-surface-container-high border border-outline-variant/30 rounded-2xl py-5 px-4 text-center space-y-2">
                <span class="material-symbols-outlined !text-2xl text-on-surface-variant">info</span>
                <p class="text-sm text-on-surface-variant">Online booking isn't set up for this destination yet.</p>
                ${contactLines.length ? contactLines.join('') : '<p class="text-xs text-on-surface-variant">Contact the Zamboanguita tourism office for arrangements.</p>'}
            </div>
        `;
    }

    // The cover plus every gallery photo, in order, with duplicates and anything
    // that isn't an http(s) image link dropped. Older spots have only a cover.
    function spotPhotos(spot) {
        const candidates = [spot.imageUrl, ...(Array.isArray(spot.images) ? spot.images : [])];
        const seen = new Set();
        const photos = [];
        for (const candidate of candidates) {
            const url = safeExternalUrl(candidate);
            if (!url || seen.has(url)) continue;
            seen.add(url);
            photos.push(url);
        }
        return photos;
    }

    function photoGallerySection(photos) {
        if (photos.length < 2) return '';   // the cover is already the hero
        return `
            <div>
                <h2 class="text-2xl font-display font-bold text-on-surface mb-4">Photos <span class="text-on-surface-variant text-base font-normal">(${photos.length})</span></h2>
                <div id="spotGallery" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    ${photos.map((url, index) => `
                        <button type="button" data-photo="${index}"
                                class="group relative aspect-[4/3] rounded-xl overflow-hidden bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary">
                            <img src="${escapeHtml(url)}" loading="lazy" alt="Photo ${index + 1}"
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"/>
                            <span class="absolute inset-0 bg-black/0 group-hover:bg-black/25 transition-colors"></span>
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderSpot(spot) {
        const typeLabel = spot.type === 'accommodation' ? 'Accommodation' : 'Tourist Spot';
        const photos = spotPhotos(spot);

        content.innerHTML = `
            <section class="relative h-[45vh] min-h-[320px] w-full overflow-hidden">
                <img class="w-full h-full object-cover" src="${escapeHtml(photos[0] || 'https://placehold.co/1600x900?text=Zamboanguita')}" alt="${escapeHtml(spot.title)}"/>
                <div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"></div>
                <div class="absolute bottom-0 left-0 right-0 px-6 md:px-12 pb-8">
                    <span class="inline-block text-[10px] font-bold uppercase tracking-widest px-3 py-1.5 rounded-full bg-black/60 text-white backdrop-blur-sm mb-3">${escapeHtml(typeLabel)}</span>
                    <h1 class="text-4xl md:text-6xl font-display font-black tracking-tighter text-white mb-2">${escapeHtml(spot.title)}</h1>
                    <p class="text-white/80 flex items-center gap-1.5 text-sm">
                        <span class="material-symbols-outlined !text-lg">location_on</span>${escapeHtml(spot.location || '')}
                    </p>
                </div>
            </section>

            <div class="px-6 md:px-12 py-10 grid grid-cols-1 lg:grid-cols-3 gap-10 max-w-7xl mx-auto">
                <div class="lg:col-span-2 space-y-8">
                    <div>
                        <span class="text-primary text-xs font-bold uppercase tracking-widest block mb-2">${escapeHtml(spot.label || spot.category || '')}</span>
                        <h2 class="text-2xl font-display font-bold text-on-surface mb-3">About this destination</h2>
                        <p class="text-on-surface-variant leading-relaxed">${escapeHtml(spot.description)}</p>
                    </div>

                    ${photoGallerySection(photos)}

                    <div>
                        <h2 class="text-2xl font-display font-bold text-on-surface mb-4">Know before you go</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-surface border border-outline-variant/20 rounded-xl p-5">
                                <span class="material-symbols-outlined text-surface-bright !text-2xl mb-2">schedule</span>
                                <p class="text-xs uppercase tracking-widest text-on-surface-variant font-bold mb-1">Open</p>
                                <p class="text-on-surface font-bold">${escapeHtml(spot.workingDays || 'Everyday')}</p>
                                <p class="text-on-surface-variant text-sm">${escapeHtml(spot.workingTime || 'All Day')}</p>
                            </div>
                            <div class="bg-surface border border-outline-variant/20 rounded-xl p-5">
                                <span class="material-symbols-outlined text-surface-bright !text-2xl mb-2">category</span>
                                <p class="text-xs uppercase tracking-widest text-on-surface-variant font-bold mb-1">Category</p>
                                <p class="text-on-surface font-bold">${escapeHtml(spot.category || '—')}</p>
                            </div>
                        </div>
                    </div>

                    <div id="reviewsBlock">
                        <h2 class="text-2xl font-display font-bold text-on-surface mb-4">Visitor reviews</h2>
                        <div id="reviewsList"></div>
                    </div>
                </div>

                <aside class="lg:col-span-1">
                    <div class="bg-surface border border-outline-variant/30 rounded-2xl p-6 sticky top-24">
                        <h3 class="font-display font-bold text-lg text-surface-bright mb-4 flex items-center gap-2">
                            <span class="material-symbols-outlined !text-xl">payments</span> Estimated fees
                        </h3>
                        <div class="space-y-3 mb-6">
                            <div class="flex justify-between items-center border-b border-outline-variant/20 pb-2">
                                <span class="text-sm text-on-surface-variant flex items-center gap-2"><span class="material-symbols-outlined !text-lg">directions_bus</span>Travel</span>
                                <span class="font-bold text-sm text-primary">${formatPeso(spot.travelFee)}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-on-surface-variant flex items-center gap-2"><span class="material-symbols-outlined !text-lg">door_open</span>Entrance</span>
                                <span class="font-bold text-sm text-primary">${formatPeso(spot.entranceFee)}</span>
                            </div>
                        </div>
                        ${bookingPanel(spot)}
                    </div>
                </aside>
            </div>
        `;
    }

    function renderReviews(data) {
        const list = document.getElementById('reviewsList');
        if (!list) return;

        const reviews = Array.isArray(data.reviews) ? data.reviews : [];

        if (reviews.length === 0) {
            list.innerHTML = `<p class="text-on-surface-variant text-sm bg-surface border border-outline-variant/20 rounded-xl p-5">No reviews yet — be the first to share your experience.</p>`;
            return;
        }

        const heading = document.querySelector('#reviewsBlock h2');
        if (heading && data.averageRating) {
            heading.innerHTML = `Visitor reviews
                <span class="inline-flex items-center gap-1.5 ml-2 align-middle text-base font-body font-normal">
                    ${starRow(data.averageRating)}
                    <span class="text-on-surface-variant text-sm">${data.averageRating} · ${data.total} review${data.total === 1 ? '' : 's'}</span>
                </span>`;
        }

        list.innerHTML = reviews.map(review => `
            <div class="bg-surface border border-outline-variant/20 rounded-xl p-5 mb-3">
                <div class="flex items-center justify-between mb-2">
                    <p class="font-bold text-on-surface text-sm">${escapeHtml(review.guestName)}</p>
                    <div class="flex items-center">${starRow(review.rating)}</div>
                </div>
                <p class="text-on-surface-variant text-sm leading-relaxed">${escapeHtml(review.comment)}</p>
                <p class="text-[11px] text-on-surface-variant/70 mt-2">${new Date(review.createdAt || Date.now()).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>
            </div>
        `).join('');
    }

    /* ---------------- booking gate ---------------- */

    const bookingAuthModal = document.getElementById('bookingAuthModal');

    function closeBookingAuthModal() { bookingAuthModal.hidden = true; }

    document.getElementById('closeBookingAuthModal').addEventListener('click', closeBookingAuthModal);
    bookingAuthModal.addEventListener('click', event => {
        if (event.target === bookingAuthModal) closeBookingAuthModal();
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !bookingAuthModal.hidden) closeBookingAuthModal();
    });

    // Only a tourist account counts here. An officer or establishment manager signed into
    // their own portal is not a visitor booking a trip.
    function signedInTourist() {
        return Boolean(localStorage.getItem('authToken')) && localStorage.getItem('userRole') === 'user';
    }

    function wireBookingGate(spot, spotId) {
        const bookBtn = document.getElementById('bookNowBtn');
        if (!bookBtn) return;   // no booking link on this spot — nothing to gate

        bookBtn.addEventListener('click', event => {
            if (signedInTourist()) return;   // let the link through to the resort

            event.preventDefault();

            document.getElementById('bookingAuthSpotName').textContent = spot.title;

            // Carrying the spot id means both paths return here rather than dumping
            // them on a dashboard, so the booking they started is still in front of them.
            const returnTo = `?spotId=${encodeURIComponent(spotId)}`;
            document.getElementById('bookingAuthRegister').href = `user/user_create_account.html${returnTo}`;
            document.getElementById('bookingAuthLogin').href = `user/user_login.html${returnTo}`;

            bookingAuthModal.hidden = false;
        });
    }

    // Photo viewer. Wired once per spot; the thumbnails live inside content that
    // renderSpot replaces, so the click handler sits on the grid itself.
    function wirePhotoLightbox(photos) {
        const grid = document.getElementById('spotGallery');
        if (!grid || photos.length === 0) return;

        const lightbox = document.getElementById('photoLightbox');
        const image = document.getElementById('lightboxImage');
        const counter = document.getElementById('lightboxCounter');
        let index = 0;

        function show(next) {
            index = (next + photos.length) % photos.length;   // wraps both ways
            image.src = photos[index];
            image.alt = `Photo ${index + 1} of ${photos.length}`;
            counter.textContent = `${index + 1} / ${photos.length}`;
        }

        function open(at) {
            show(at);
            lightbox.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function close() {
            lightbox.hidden = true;
            document.body.style.overflow = '';
            image.src = '';
        }

        grid.addEventListener('click', event => {
            const thumb = event.target.closest('[data-photo]');
            if (thumb) open(Number(thumb.dataset.photo));
        });

        document.getElementById('lightboxClose').addEventListener('click', close);
        document.getElementById('lightboxPrev').addEventListener('click', () => show(index - 1));
        document.getElementById('lightboxNext').addEventListener('click', () => show(index + 1));
        lightbox.addEventListener('click', event => { if (event.target === lightbox) close(); });

        document.addEventListener('keydown', event => {
            if (lightbox.hidden) return;
            if (event.key === 'Escape') close();
            if (event.key === 'ArrowLeft') show(index - 1);
            if (event.key === 'ArrowRight') show(index + 1);
        });
    }

    async function loadSpot() {
        const spotId = new URLSearchParams(window.location.search).get('spotId');

        if (!spotId) {
            renderNotFound('No destination selected');
            return;
        }

        const doneLoading = showLoading(content, 'Loading destination...');

        try {
            const response = await fetch(`${API_BASE}/spots/${encodeURIComponent(spotId)}`);
            if (!response.ok) {
                doneLoading();
                renderNotFound('Destination not found');
                return;
            }

            const spot = await response.json();
            doneLoading();
            renderSpot(spot);
            document.title = `${spot.title} | Zamboanguita`;
            wireBookingGate(spot, spotId);
            wirePhotoLightbox(spotPhotos(spot));

            // Reviews load after the page is already readable, so a slow review
            // query never holds back the destination details themselves.
            try {
                const reviewsResponse = await fetch(`${API_BASE}/spots/${encodeURIComponent(spotId)}/reviews`);
                if (reviewsResponse.ok) renderReviews(await reviewsResponse.json());
                else renderReviews({ reviews: [] });
            } catch {
                renderReviews({ reviews: [] });
            }
        } catch (error) {
            console.error('❌ Failed to load destination:', error);
            doneLoading();
            renderNotFound('Unable to load this destination');
        }
    }

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    // Theme is the shared module's job, including the icon it shows.
    themeToggleBtn.addEventListener('click', toggleTheme);

    // Signed-in visitors shouldn't be told to sign in.
    if (localStorage.getItem('authToken')) {
        const authBtn = document.getElementById('navAuthBtn');
        authBtn.textContent = 'My Account';
        authBtn.href = '../index.html?view=settings';
    }

    loadSpot();
</script>
</body>
</html>
