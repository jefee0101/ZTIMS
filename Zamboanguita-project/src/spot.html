    <style>

        /* The hidden attribute only gets display:none from the browser default,
           which any Tailwind display class (.flex here) outranks. Without this,
           elements toggled via el.hidden stay on screen. */
        [hidden] { display: none !important; }
        /* The identity gradient. It was gold into orange, which on the sand
           ground was both unreadable and the loudest thing on the page — the
           one element most responsible for the site reading as an orange
           template. Ocean into teal carries the same emphasis and is legible
           in both themes. */
        .text-gradient {
            background: linear-gradient(to right, rgb(var(--ztims-primary)), rgb(var(--ztims-accent)));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Likewise: a primary button is ocean into coastal blue. Gold is for the
           occasional highlight, not for every call to action. */
        /* The page's older buttons, made flat like the rest of the site: a solid
           burnt-orange pill, words in sentence case, no glow. */
        .btn-primary-gradient {
            background: rgb(var(--ztims-primary)) !important;
            color: rgb(var(--ztims-on-primary)) !important;
            border-radius: 9999px !important;
            text-transform: none !important;

/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an establishment name — must

body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */

    body::-webkit-scrollbar,

        height: 0;
        display: none;
    }
}

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: 'rgb(var(--ztims-success))' },
        error:   { icon: 'error',        accent: 'rgb(var(--ztims-error))' },
        info:    { icon: 'info',         accent: 'rgb(var(--ztims-secondary))' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:0',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'color:rgb(var(--ztims-on-surface))',
            'border:1px solid var(--glass-hairline)',
            'border-left:4px solid ' + settings.accent,
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn var(--dur-moderate, 300ms) var(--ease-decelerate, ease-out)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:rgb(var(--ztims-on-surface-variant));font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut 200ms var(--ease-accelerate, ease-in) forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script type="module">
    const API_BASE = "/api";
    const content = document.getElementById('spotContent');

    // The API sleeps on Render's free tier, so a cold start can take most of a
    // minute — after 5s the spinner says so rather than looking frozen.
    function showLoading(target, message) {
        target.innerHTML =
            '<div class="flex flex-col items-center justify-center gap-3 py-32 w-full text-center">' +
                '<div class="w-10 h-10 rounded-full border-4 border-current border-t-transparent animate-spin opacity-80"></div>' +
                '<p class="text-sm opacity-80">' + message + '</p>' +
                '<p data-slow class="text-support opacity-60 hidden">Waking the server — this can take up to a minute.</p>' +
            '</div>';
        const timer = setTimeout(() => {
            const note = target.querySelector('[data-slow]');
            if (note) note.classList.remove('hidden');
        }, 5000);
        return () => clearTimeout(timer);
    }

    function formatPeso(amount) {
        const value = Number(amount) || 0;
        return `₱${value.toFixed(2)}`;
    }

    // Spot text comes from establishment managers and admins, so it is escaped before it
    // reaches innerHTML rather than trusted as markup.
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    // Only http(s) links are allowed through to an href, so a stored value like
    // "javascript:..." can never become a clickable link.
    function safeExternalUrl(value) {
        if (!value) return null;
        let candidate = String(value).trim();
        if (!candidate) return null;
        if (!/^https?:\/\//i.test(candidate)) candidate = 'https://' + candidate;
        try {
            const parsed = new URL(candidate);
            return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : null;
        } catch {
            return null;
        }
    }


    function renderNotFound(message) {
        content.innerHTML = `
            <div class="flex flex-col items-center justify-center gap-4 py-32 px-8 text-center">
                <span class="material-symbols-outlined !text-6xl text-on-surface-variant/40">travel_explore</span>

    }

    // The establishment's name, whichever spelling the account was saved under.
    function managerName(establishment) {
        return establishment?.establishmentName || establishment?.resortName || '';
    }

    function bookingPanel(spot) {
        const url = safeExternalUrl(spot.bookingUrl);
        const establishment = spot.managedBy && typeof spot.managedBy === 'object' ? spot.managedBy : null;

        if (url) {
            // The href is always the real destination so the link still works with
            // middle-click, "open in new tab", and with JavaScript disabled. The
            // click handler below is what gates it for signed-out visitors.
            return `
                <a id="bookNowBtn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
                   class="w-full bg-primary text-on-primary py-4 rounded-full font-display font-bold uppercase tracking-widest btn-primary-gradient shadow-lg shadow-primary/20 flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform">

        // No booking link on file. If the establishment left contact details, they
        // are worth showing; otherwise there is nothing useful to say here.
        const contactLines = [];
        if (managerName(establishment)) contactLines.push(`<p class="text-sm text-on-surface font-bold">${escapeHtml(managerName(establishment))}</p>`);
        // The person to ask for, when the office recorded one.

            </a>`);

        // Only the public address ever reaches this page; the sign-in email stays private.
        if (establishment?.contactEmail) {

        // Booking is opt-in, so no link is a deliberate choice rather than a gap.

        if (contactLines.length === 0) return '';

        return `
            <div class="w-full bg-surface-container-high border border-outline-variant/30 rounded-2xl py-5 px-4 text-center space-y-2">

    // The cover plus every gallery photo, in order, with duplicates and anything
    // that isn't an http(s) image link dropped. Older spots have only a cover.
    function spotPhotos(spot) {
        const candidates = [spot.imageUrl, ...(Array.isArray(spot.images) ? spot.images : [])];
        const seen = new Set();
        const photos = [];
        for (const candidate of candidates) {
            const url = safeExternalUrl(candidate);
            if (!url || seen.has(url)) continue;
            seen.add(url);
            photos.push(url);
        }
        return photos;
    }

    function photoGallerySection(photos) {
        if (photos.length < 2) return '';   // the cover is already the hero
        return `
            <div>
                <h2 class="text-2xl font-display font-bold text-on-surface mb-4">Photos <span class="text-on-surface-variant text-base font-normal">(${photos.length})</span></h2>
                <div id="spotGallery" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    ${photos.map((url, index) => `
                        <button type="button" data-photo="${index}"
                                class="group relative aspect-[4/3] rounded-xl overflow-hidden bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary">
                            <img src="${escapeHtml(url)}" loading="lazy" alt="Photo ${index + 1}"
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"/>
                            <span class="absolute inset-0 bg-black/0 group-hover:bg-black/25 transition-colors"></span>
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    /* ===== TRAVEL DIRECTIONS =============================================
       The destination comes from what the establishment or the Tourism Office
       recorded. The starting point comes from the visitor's own device, or from
       a place they type in. The route, the distance and the travel time are
       worked out per request by a routing service through the ZTIMS API.

       Nothing here is stored. The visitor's coordinates live in this page for as
       long as the tab is open and are sent to the API only to draw one route. No
       travel time is ever kept on a listing, because there is no single answer:
       it depends entirely on who is asking and from where. */


    // Google Maps takes over for turn-by-turn navigation — ZTIMS itself does not
    // provide that, it shows the route and hands the journey over.
    /* Google's directions URL takes driving, bicycling, walking or transit, and
       has no motorcycle among them — its two-wheeler mode exists in the app in
       some countries but cannot be asked for by link. So motorbike hands over as
       driving, which is the closest road route Google will draw. ZTIMS's own
       distance and time above it stay the motorbike ones; only the handover to
       another app loses the distinction. */
    const GOOGLE_TRAVEL_MODE = {
        car: 'driving', motorbike: 'driving', bicycle: 'bicycling', walking: 'walking'
    };

    // Leaflet and the marker styling come from the shared map module, so this
    // page and the tourism map cannot drift apart.
    const loadLeaflet = () => window.ZTIMS_MAP.loadLeaflet();

    // A point is only usable when both halves are present and in range. Anything
    // else means this listing simply has no location yet.
    function spotPoint(spot) {
        const lat = Number(spot.latitude);
        const lng = Number(spot.longitude);
        if (!isFinite(lat) || !isFinite(lng)) return null;
        if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
        if (lat === 0 && lng === 0) return null;
        return { lat: lat, lng: lng };
    }

    /**
     * A description written in paragraphs stays in paragraphs. Escaped text inside
     * a single <p> collapses every blank line, so a structured entry — what the
     * place is, what to expect, how to get there — arrived as one unbroken block.
     * This changes only how the existing description is displayed; nothing new is
     * stored.
     */
    function describe(text) {
        const paragraphs = String(text || '')
            .split(/\n\s*\n/)
            .map(function (part) { return part.trim(); })
            .filter(Boolean);

        if (paragraphs.length === 0) return '';

        return paragraphs.map(function (part) {
            // A single newline inside a paragraph is a line break, not a new one.
            return '<p class="text-on-surface-variant leading-relaxed mb-3 last:mb-0">' +
                escapeHtml(part).replace(/\n/g, '<br/>') + '</p>';
        }).join('');
    }

    function locationLine(spot) {
        return [spot.address, spot.barangay, spot.municipality, spot.province]
            .map(function (part) { return String(part || '').trim(); })
            .filter(Boolean)
            .join(', ');
    }

    function formatDistance(metres) {
        if (!isFinite(metres)) return '—';
        return metres < 1000 ? `${Math.round(metres)} m` : `${(metres / 1000).toFixed(1)} km`;
    }

    function formatDuration(seconds) {
        if (!isFinite(seconds)) return '—';
        const minutes = Math.max(1, Math.round(seconds / 60));
        if (minutes < 60) return `${minutes} min`;
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `${hours} hr ${rest} min` : `${hours} hr`;
    }

    function googleMapsLink(destination, origin, mode) {
        const travel = GOOGLE_TRAVEL_MODE[mode] || 'driving';
        const from = origin ? `&origin=${origin.lat},${origin.lng}` : '';
        return `https://www.google.com/maps/dir/?api=1${from}`
            + `&destination=${destination.lat},${destination.lng}&travelmode=${travel}`;
    }

    /* The mobile order is deliberate and matches the way the section is used:
       the button first, then why permission is being asked for, then the way of
       travelling, then the two numbers, then the map, then the handover. */
    function directionsSection(spot) {
        const destination = spotPoint(spot);
        const address = locationLine(spot) || spot.location || '';
        const addressLine = address
            ? `<p class="text-sm text-on-surface-variant flex items-start gap-2">
                   <span class="material-symbols-outlined !text-lg text-primary shrink-0">place</span>
                   <span>${escapeHtml(address)}</span>
               </p>`
            : '';

        if (!destination) {
            return `
                <section id="directionsSection" class="scroll-mt-24">
                    <h2 class="text-2xl font-display font-bold text-on-surface mb-4">Getting there</h2>
                    <div class="bg-surface border border-outline-variant/20 rounded-xl p-5 space-y-3">
                        ${addressLine}
                        <div data-emergency hidden class="tone-danger border border-error/25 rounded-xl p-4"></div>
                        <p class="text-sm text-on-surface-variant flex items-start gap-2">
                            <span class="material-symbols-outlined !text-lg text-on-surface-variant/60 shrink-0">wrong_location</span>
                            <span>Directions are currently unavailable because this location has not been configured.</span>
                        </p>
                    </div>
                </section>
            `;
        }

        return `
            <section id="directionsSection" class="scroll-mt-24">
                <h2 class="text-2xl font-display font-bold text-on-surface mb-4">Getting there</h2>
                <div class="bg-surface border border-outline-variant/20 rounded-xl p-5 space-y-4">
                    ${addressLine}

                    <!-- Emergency numbers (shared/site-footer.js): hidden until the office supplies them. -->
                    <div data-emergency hidden class="tone-danger border border-error/25 rounded-xl p-4"></div>


                    <button type="button" id="getDirectionsBtn"
                            class="w-full sm:w-auto bg-primary text-on-primary px-6 py-3.5 min-h-[44px] rounded-full font-display font-bold uppercase tracking-widest text-xs btn-primary-gradient flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform">
                        <span class="material-symbols-outlined !text-lg">near_me</span> Get directions
                    </button>

                    <div id="directionsPanel" hidden class="space-y-4">
                        <p class="text-support leading-relaxed">
                            ZTIMS would like to use your current location to calculate directions and estimated travel
                            time. It is used for this route only and is never saved.
                        </p>

                        <!-- Start and destination together, in that order, so the
                             route reads as a journey rather than a pair of numbers
                             with no ends on it. -->
                        <div class="space-y-2">
                            <p id="originLine" class="text-sm text-on-surface flex items-start gap-2">
                                <span class="material-symbols-outlined !text-lg text-secondary shrink-0">my_location</span>
                                <span><span class="text-label font-bold uppercase tracking-wider block">From</span>
                                      <span id="originLabel">Asking for your location…</span></span>
                            </p>
                            <p class="text-sm text-on-surface flex items-start gap-2">
                                <span class="material-symbols-outlined !text-lg text-primary shrink-0">place</span>
                                <span><span class="text-label font-bold uppercase tracking-wider block">To</span>
                                      <span id="destinationLabel">This destination</span></span>
                            </p>
                        </div>

                        <div id="manualOrigin" hidden class="space-y-2">
                            <label for="originSearch" class="block text-label font-bold uppercase tracking-wider">
                                Enter your starting location
                            </label>
                            <div class="flex gap-2">
                                <input id="originSearch" type="text" placeholder="Search starting location…"
                                       class="flex-1 bg-surface-container-high border border-outline-variant/40 rounded-xl p-3 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"/>
                                <button type="button" id="originSearchBtn"
                                        class="shrink-0 px-4 py-3 min-h-[44px] rounded-xl bg-surface-container-high border border-outline-variant/40 text-support font-bold text-on-surface hover:bg-outline-variant/40 transition-all">
                                    Search
                                </button>
                            </div>
                            <div id="originResults" hidden class="bg-surface-container-high border border-outline-variant/40 rounded-xl p-1 max-h-44 overflow-y-auto"></div>
                            <button type="button" id="retryLocationBtn"
                                    class="text-support text-primary font-bold hover:underline flex items-center gap-1">
                                <span class="material-symbols-outlined !text-base">my_location</span> Try my device location again
                            </button>
                        </div>

                        <div id="modeRow" hidden class="flex flex-wrap gap-2"></div>

                        <div id="routeStats" hidden class="space-y-3">
                            <!-- Which route these numbers belong to. The service
                                 is asked for alternatives and the quickest is the
                                 one shown, so this says so rather than leaving a
                                 distance and a time with no provenance. -->
                            <div id="routeChoice" hidden
                                 class="bg-surface-container-high border border-outline-variant/20 rounded-xl p-4">
                                <p class="text-label uppercase tracking-widest font-bold mb-1">Recommended route</p>
                                <p id="routeVia" class="text-base font-display font-bold text-on-surface">—</p>
                                <p id="routeWhy" class="text-support mt-0.5"></p>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-surface-container-high border border-outline-variant/20 rounded-xl p-4">
                                    <p class="text-label uppercase tracking-widest font-bold mb-1">Distance</p>
                                    <p id="routeDistance" class="text-xl font-display font-bold text-on-surface">—</p>
                                </div>
                                <div class="bg-surface-container-high border border-outline-variant/20 rounded-xl p-4">
                                    <p class="text-label uppercase tracking-widest font-bold mb-1">Estimated time</p>
                                    <p id="routeDuration" class="text-xl font-display font-bold text-on-surface">—</p>
                                </div>
                            </div>
                        </div>

                        <p id="directionsStatus" hidden class="text-support"></p>

                        <div id="directionsMap" hidden class="relative z-0 h-64 sm:h-80 w-full rounded-xl overflow-hidden border border-outline-variant/40 bg-surface-container-high"></div>


                        <a id="openInMapsBtn" href="#" target="_blank" rel="noopener noreferrer"
                           class="w-full bg-surface-container-high border border-outline-variant/40 text-on-surface px-6 py-3.5 min-h-[44px] rounded-full font-display font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2 hover:bg-outline-variant/30 transition-colors">
                            <span class="material-symbols-outlined !text-lg">open_in_new</span> Open in Maps
                        </a>
                        <p class="text-support text-center">
                            ZTIMS shows the route and the estimate. Turn-by-turn navigation continues in your maps app.
                        </p>
                    </div>
                </div>
            </section>
        `;
    }

    /* Why a date cannot be chosen here, or '' when it can. The server sends the
       open weekdays (null: every day) and the closed dates, and refuses the
       same days itself; this only saves a visitor a refused payment. */
    const WEEKDAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const WEEKDAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    function closedDayReason(dateKey, calendar) {
        if (!calendar || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return '';
        const day = new Date(dateKey + 'T00:00:00Z').getUTCDay();
        if (Array.isArray(calendar.openDays) && !calendar.openDays.includes(WEEKDAY_KEYS[day])) {
            return `Closed on ${WEEKDAY_NAMES[day]}s. Open: ${calendar.openDaysText}.`;
        }
        const closed = (calendar.closedDates || []).find(c => c.date === dateKey);
        if (closed) return `Closed on that date${closed.reason ? ` (${closed.reason})` : ''}. Please choose another day.`;
        return '';
    }

    /* The kinds of visitor a ticket here can count, with their price. Student
       and child only where the office has set a price for them. */
    function ticketKinds(offer) {
        const f = offer.fees || { regular: offer.unitFee, student: null, child: null };
        return [
            { key: 'regular', label: 'Regular', price: f.regular },
            { key: 'student', label: 'Student', price: f.student, note: 'Bring your school ID.' },
            { key: 'child', label: 'Child', price: f.child, note: f.childAgeMax ? `Up to ${f.childAgeMax} years old.` : '' }
        ].filter(k => k.price !== null && k.price !== undefined);
    }

    /* Entrance tickets, for attractions the Tourism Office runs and charges for.
       Bought online; the visitor shows the ticket code. */
    async function renderTicketOffer(spotId) {
        const slot = document.getElementById('ticketOffer');
        if (!slot) return;
        let offer = null;
        try {
            const response = await fetch(`${API_BASE}/tickets/offer/${encodeURIComponent(spotId)}`);
            if (response.ok) offer = await response.json();
        } catch (e) { /* no offer: the section simply does not appear */ }
        if (!offer || !offer.available) return;
        actions.tickets = true;
        drawActions();

        const today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
        const last = new Date(Date.now() + (8 + 24 * offer.daysAhead) * 3600 * 1000).toISOString().slice(0, 10);
        const kinds = ticketKinds(offer);
        const cheaper = kinds.slice(1).map(k => ({ student: 'students', child: 'children' })[k.key]).filter(Boolean);
        // No section on the page: "Buy tickets" opens this form in a window.
        // The Entrance tile under At a glance carries the
        // price and, where set, the student and child prices.
        const tileSub = document.querySelector('[data-fact="entrance"] .spot-fact__sub');
        if (tileSub && cheaper.length) tileSub.textContent = `per person · pay online or onsite · less for ${cheaper.join(', ').replace(/, ([^,]*)$/, ' and $1')}`;
        const modal = document.createElement('div');
        modal.id = 'ticketModal';
        modal.hidden = true;
        modal.className = 'fixed inset-0 z-[70] bg-black/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.setAttribute('aria-labelledby', 'ticketHeading');
        document.body.appendChild(modal);
        modal.innerHTML = `
            <div class="bg-surface border border-outline-variant/40 w-full max-w-lg p-6 sm:p-7 max-h-[95vh] overflow-y-auto relative">
                <button type="button" id="closeTicketModal" aria-label="Close"
                        class="absolute top-4 right-4 p-2 rounded-full hover:bg-surface-container-high text-on-surface-variant transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <h3 id="ticketHeading" class="text-xl font-display font-bold text-on-surface mb-1 pr-10">Buy entrance tickets</h3>
                <p class="text-on-surface"><b>${escapeHtml(peso(kinds[0].price))}</b> per person${cheaper.length
                    ? ` <span class="text-on-surface-variant">· less for ${escapeHtml(cheaper.join(', ').replace(/, ([^,]*)$/, ' and $1'))}</span>` : ''}</p>
                <p class="text-support mt-1">Pay online now, or pay onsite when you arrive.</p>
                <ol class="journey-steps mt-4" aria-label="Ticket steps">${journeySteps(['Date & visitors', 'Payment', 'Your ticket'], 0)}</ol>

                <form id="ticketForm" class="mt-5" novalidate>
                    <div class="bk-group">
                        <h3 class="bk-group-title"><span class="material-symbols-outlined" aria-hidden="true">event</span>Your visit</h3>
                        <div>
                            <label for="tkDate" class="bk-label">Date of visit</label>
                            <input id="tkDate" type="date" required min="${today}" max="${last}" value="${today}" class="bk-field sm:!w-64"/>
                        </div>
                        <fieldset>
                            <legend class="bk-label">Who is coming</legend>
                            <div class="bk-people">
                                ${kinds.map(k => `
                                <div class="bk-person">
                                    <span class="min-w-0">
                                        <span class="bk-person__name block">${escapeHtml(k.label)}</span>
                                        <span class="bk-person__price block">${escapeHtml(peso(k.price))} each${k.note ? ` · ${escapeHtml(k.note)}` : ''}</span>
                                    </span>
                                    <span class="qty" data-qty>
                                        <button type="button" data-step="-1" aria-label="${escapeHtml(k.label)}: one fewer">−</button>
                                        <input type="number" data-kind="${k.key}" min="0" max="${offer.maxPeople}" step="1" inputmode="numeric"
                                               value="${k.key === 'regular' ? 1 : 0}" aria-label="${escapeHtml(k.label)}: number of people"/>
                                        <button type="button" data-step="1" aria-label="${escapeHtml(k.label)}: one more">+</button>
                                    </span>
                                </div>`).join('')}
                            </div>
                        </fieldset>
                    </div>

                    <div class="bk-group">
                        <h3 class="bk-group-title"><span class="material-symbols-outlined" aria-hidden="true">person</span>Your details</h3>
                        <div class="bk-row bk-row--2">
                            <div>
                                <label for="tkName" class="bk-label">Full name</label>
                                <input id="tkName" type="text" required autocomplete="name" class="bk-field"/>
                            </div>
                            <div>
                                <label for="tkEmail" class="bk-label">Email</label>
                                <input id="tkEmail" type="email" required autocomplete="email" placeholder="you@example.com" class="bk-field"/>
                                <p class="bk-hint">For your ticket and receipt.</p>
                            </div>
                        </div>
                    </div>

                    <div class="bk-summary mt-5" aria-live="polite">
                        <div id="tkLines" class="space-y-1"></div>
                        <p class="bk-summary__total"><span>Total</span><span id="tkTotal"></span></p>
                    </div>
                    <p id="tkError" hidden class="mt-3 text-sm text-error bg-error/10 border border-error/20 px-4 py-3"></p>
                    <button type="submit" id="tkBuy"
                            class="mt-4 w-full bg-primary text-on-primary py-3.5 min-h-[48px] font-display font-bold btn-primary-gradient flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined !text-lg" aria-hidden="true">payments</span><span id="tkBuyLabel">Buy tickets</span>
                    </button>
                    <p class="text-support mt-3">
                        Your name and email are used only for these tickets. See the
                        <a href="privacy.html#collect" target="_blank" rel="noopener" class="underline font-bold">Privacy Notice</a>.
                    </p>
                </form>
            </div>`;
        wireQty(modal);
        const closeTickets = () => { modal.hidden = true; };
        document.getElementById('closeTicketModal').addEventListener('click', closeTickets);
        modal.addEventListener('click', event => { if (event.target === modal) closeTickets(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) closeTickets(); });

        const wanted = new URLSearchParams(window.location.search).get('ticketDate') || '';
        const dateInput = document.getElementById('tkDate');
        if (/^\d{4}-\d{2}-\d{2}$/.test(wanted) && wanted >= today && wanted <= last) {
            dateInput.value = wanted;
            modal.hidden = false;
        }

        const kindInputs = [...document.querySelectorAll('#ticketForm [data-kind]')];
        const counts = () => Object.fromEntries(kindInputs.map(i => [i.dataset.kind, Math.max(0, Math.floor(Number(i.value)) || 0)]));
        const total = document.getElementById('tkTotal');
        const error = document.getElementById('tkError');
        const buyButton = document.getElementById('tkBuy');
        const checkDate = () => {
            const reason = closedDayReason(dateInput.value, offer);
            error.textContent = reason;
            error.hidden = !reason;
            buyButton.disabled = Boolean(reason);
        };
        dateInput.addEventListener('change', checkDate);
        // Today may itself be a closed day: open on the first day that is not.
        if (closedDayReason(dateInput.value, offer) && !wanted) {
            for (let i = 1; i <= offer.daysAhead; i++) {
                const next = new Date(Date.now() + (8 + 24 * i) * 3600 * 1000).toISOString().slice(0, 10);
                if (!closedDayReason(next, offer)) { dateInput.value = next; break; }
            }
        }
        checkDate();
        const showTotal = () => {
            const c = counts();
            const sum = kinds.reduce((t, k) => t + (c[k.key] || 0) * k.price, 0);
            const people = kinds.reduce((t, k) => t + (c[k.key] || 0), 0);
            document.getElementById('tkLines').innerHTML = kinds.filter(k => c[k.key] > 0).map(k =>
                `<p class="bk-summary__line"><span>${c[k.key]} × ${escapeHtml(k.label)}</span><span>${escapeHtml(peso(c[k.key] * k.price))}</span></p>`).join('')
                || '<p class="bk-summary__line"><span>No one added yet</span><span></span></p>';
            total.textContent = peso(sum);
            const label = document.getElementById('tkBuyLabel');
            if (label) label.textContent = people > 0 ? `Buy ${people} ticket${people === 1 ? '' : 's'} · ${peso(sum)}` : 'Buy tickets';
        };
        kindInputs.forEach(i => i.addEventListener('input', showTotal));
        showTotal();

        document.getElementById('ticketForm').addEventListener('submit', async event => {
            event.preventDefault();
            error.hidden = true;
            const button = document.getElementById('tkBuy');
            const original = button.innerHTML;
            button.disabled = true;
            button.textContent = 'Opening the payment page\u2026';
            try {
                const response = await fetch(`${API_BASE}/tickets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        spotId,
                        visitDate: document.getElementById('tkDate').value,
                        counts: counts(),
                        fullName: document.getElementById('tkName').value.trim(),
                        email: document.getElementById('tkEmail').value.trim()
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.checkoutUrl) throw new Error(result.message || 'The tickets could not be bought just now.');
                window.location.assign(result.checkoutUrl);
            } catch (e) {
                error.textContent = e.message;
                error.hidden = false;
                button.disabled = false;
                button.innerHTML = original;
            }
        });
    }

    /* − / + steppers ([data-qty]): change the number between the input's own
       min and max, tell the page it changed, and grey out a button at the end
       of its range. */
    function wireQty(root) {
        root.querySelectorAll('[data-qty]').forEach(box => {
            const input = box.querySelector('input');
            const buttons = box.querySelectorAll('[data-step]');
            const bounds = () => [Number(input.min || 0), input.max === '' ? Infinity : Number(input.max)];
            const paint = () => {
                const [min, max] = bounds();
                const n = Number(input.value) || 0;
                buttons.forEach(b => { b.disabled = Number(b.dataset.step) < 0 ? n <= min : n >= max; });
            };
            buttons.forEach(b => b.addEventListener('click', () => {
                const [min, max] = bounds();
                const next = Math.min(max, Math.max(min, (Number(input.value) || 0) + Number(b.dataset.step)));
                input.value = String(next);
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
            }));
            input.addEventListener('input', paint);
            input.addEventListener('change', paint);
            paint();
        });
    }

    function wireDirections(spot) {
        const destination = spotPoint(spot);
        const openButton = document.getElementById('getDirectionsBtn');
        if (!destination || !openButton) return;

        const panel = document.getElementById('directionsPanel');
        const originLabel = document.getElementById('originLabel');
        const manualOrigin = document.getElementById('manualOrigin');
        const originSearch = document.getElementById('originSearch');
        const originResults = document.getElementById('originResults');
        const modeRow = document.getElementById('modeRow');
        const routeStats = document.getElementById('routeStats');
        const statusLine = document.getElementById('directionsStatus');

        const mapBox = document.getElementById('directionsMap');
        const openInMaps = document.getElementById('openInMapsBtn');

        // The destination in words, so the panel names both ends of the journey.
        // The listing's own address where it has one, its title otherwise.
        const destinationLabel = document.getElementById('destinationLabel');
        if (destinationLabel) {
            destinationLabel.textContent =
                String(spot.location || '').trim() || String(spot.title || '').trim() || 'This destination';
        }

        // Held in this page only, for as long as the tab is open.
        let origin = null;
        let mode = 'car';
        let modesLoaded = false;
        let map = null;
        let routeLine = null;
        let originMarker = null;

        function setStatus(message, tone) {
            statusLine.textContent = message || '';
            statusLine.hidden = !message;
            statusLine.style.color = tone === 'error' ? '#f87171' : '';
        }

        function refreshMapsLink() {
            openInMaps.href = googleMapsLink(destination, origin, mode);
        }

        async function ensureMap() {
            if (map) return map;
            await loadLeaflet();
            mapBox.hidden = false;

            map = window.L.map(mapBox, { scrollWheelZoom: false }).setView([destination.lat, destination.lng], 14);
            window.L.tileLayer(window.ZTIMS_MAP.OSM_TILES, {
                maxZoom: 19,
                attribution: window.ZTIMS_MAP.OSM_ATTRIBUTION
            }).addTo(map);
            // The same category marker the tourism map uses, so a place looks
            // the same wherever a visitor meets it.
            // Named on the map, not only in a popup — the same as the tourism map.
            window.ZTIMS_MAP.attachLabel(
                window.L.marker([destination.lat, destination.lng], { icon: window.ZTIMS_MAP.markerIcon(spot) })
                    .addTo(map)
                    .bindPopup(spot.title),
                spot
            );
            window.ZTIMS_MAP.watchLabelZoom(map, mapBox);

            // The same control the tourism map uses. On resize it re-frames
            // whatever is currently on screen: the route if one is drawn, the
            // destination on its own if not.
            window.ZTIMS_MAP.addExpandControl(map, mapBox, function () {
                if (routeLine) map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
                else map.setView([destination.lat, destination.lng], 14);
            });

            map.invalidateSize();
            return map;
        }

        async function drawRoute(geometry) {
            await ensureMap();

            if (routeLine) map.removeLayer(routeLine);
            if (originMarker) map.removeLayer(originMarker);

            originMarker = window.L.marker([origin.lat, origin.lng], { icon: window.ZTIMS_MAP.originIcon() })
                .addTo(map)
                .bindPopup('You are here');

            routeLine = window.L.polyline(geometry, { color: '#7A2E00', weight: 5, opacity: 0.9 }).addTo(map);
            map.invalidateSize();
            map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
        }

        async function loadModes() {
            if (modesLoaded) return;
            try {
                const response = await fetch(`${API_BASE}/directions/capabilities`);
                const data = await response.json();
                const modes = Array.isArray(data.modes) ? data.modes : [];
                if (!modes.length) return;

                // Only what the configured routing service can genuinely calculate
                // is offered — never a mode whose time would have to be invented.
                mode = modes.some(function (one) { return one.id === 'car'; }) ? 'car' : modes[0].id;
                modeRow.innerHTML = '';
                modes.forEach(function (option) {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.dataset.mode = option.id;
                    chip.textContent = option.label;
                    chip.className = 'px-4 py-2.5 min-h-[44px] rounded-full text-xs font-bold border transition-colors';
                    chip.addEventListener('click', function () {
                        if (mode === option.id) return;
                        mode = option.id;
                        paintModes();
                        refreshMapsLink();
                        requestRoute();
                    });
                    modeRow.appendChild(chip);
                });
                modeRow.hidden = false;
                paintModes();
                modesLoaded = true;
            } catch (error) {
                /* The route request below reports the real problem honestly. */
            }
        }

        function paintModes() {
            [...modeRow.querySelectorAll('button')].forEach(function (chip) {
                const active = chip.dataset.mode === mode;
                chip.className = 'px-4 py-2.5 min-h-[44px] rounded-full text-xs font-bold border transition-colors '
                    + (active
                        ? 'bg-primary text-on-primary border-primary'
                        : 'bg-surface-container-high text-on-surface-variant border-outline-variant/40 hover:bg-outline-variant/30');
            });
        }

        /* Says which of the routes the service offered is the one being shown, and
           why it won. Everything here comes from the routing provider's own reply:
           the road name it reports the route mostly follows, how many routes it
           returned, and the gap between the quickest and the slowest by its own
           estimate. Where it offers no names, the panel says how the choice was
           made and nothing more — an invented description would be worse than
           none. */
        function paintRouteChoice(data) {
            const box = document.getElementById('routeChoice');
            const via = document.getElementById('routeVia');
            const why = document.getElementById('routeWhy');
            const compared = Number(data.routesCompared) || 1;
            const saved = Number(data.secondsSavedOverSlowest) || 0;

            if (!data.via && compared < 2) {
                // One unnamed route: there is nothing to say that the distance and
                // time below do not already say.
                box.hidden = true;
                return;
            }

            via.textContent = data.via ? ('via ' + data.via) : 'Quickest available route';
            why.textContent = compared < 2
                ? 'The only route available for this way of travelling.'
                : saved > 60
                    ? `Quickest of ${compared} routes — about ${formatDuration(saved)} faster than the slowest.`
                    : `Quickest of ${compared} routes, which are all close in time.`;
            box.hidden = false;
        }

        async function requestRoute() {
            if (!origin) return;

            routeStats.hidden = true;
            setStatus('Calculating the route…');

            try {
                const query = `fromLat=${origin.lat}&fromLng=${origin.lng}`
                    + `&toLat=${destination.lat}&toLng=${destination.lng}&mode=${encodeURIComponent(mode)}`;
                const response = await fetch(`${API_BASE}/directions/route?${query}`);
                const data = await response.json().catch(function () { return {}; });

                if (!response.ok) throw new Error(data.message || 'Directions are unavailable right now.');

                document.getElementById('routeDistance').textContent = formatDistance(data.distanceMeters);
                document.getElementById('routeDuration').textContent = formatDuration(data.durationSeconds);
                paintRouteChoice(data);
                routeStats.hidden = false;
                setStatus('');

                /* Drawing the route is a separate thing from knowing it. Leaflet
                   comes off a CDN, and when that failed the exception landed in
                   the catch below, which threw away a perfectly good distance and
                   time and put a raw "Cannot read properties of undefined" where
                   the visitor was reading. The numbers are what they came for; the
                   picture is the bonus. */
                try {
                    await drawRoute(data.geometry || []);
                } catch (mapError) {
                    console.error('Could not draw the route:', mapError);
                    setStatus('The map could not be drawn just now, but the route above is correct.');
                }
            } catch (error) {
                // No straight-line stand-in: an honest "unavailable" beats a number
                // the visitor would plan their day around.
                routeStats.hidden = true;
                setStatus(error.message || 'Directions are unavailable right now.', 'error');
            }
        }

        function useOrigin(point, label) {
            origin = point;
            originLabel.textContent = label;
            manualOrigin.hidden = true;
            if (originResults) originResults.hidden = true;
            refreshMapsLink();
            loadModes().then(requestRoute);
        }

        function askForManualOrigin(reason) {
            origin = null;
            originLabel.textContent = reason;
            manualOrigin.hidden = false;
            routeStats.hidden = true;
            setStatus('');
            loadModes();
        }

        function requestDeviceLocation() {
            originLabel.textContent = 'Asking for your location…';

            if (!navigator.geolocation || !window.isSecureContext) {
                askForManualOrigin("We couldn't access your current location on this device.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    useOrigin(
                        { lat: position.coords.latitude, lng: position.coords.longitude },
                        'From: Your current location'
                    );
                },
                function (error) {
                    const reason = error.code === error.PERMISSION_DENIED
                        ? "We couldn't access your current location because permission was declined."
                        : error.code === error.POSITION_UNAVAILABLE
                            ? "We couldn't determine where you are right now."
                            : "Getting your location took too long.";
                    askForManualOrigin(reason);
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
            );
        }

        // explicit: the visitor pressed Search or Enter. While they are still
        // typing, stay quiet until there is something to show — a status line
        // flickering on every keystroke is noise.
        async function searchOrigin(explicit) {
            const query = (originSearch.value || '').trim();
            if (query.length < 3) {
                if (explicit) setStatus('Type at least three characters to search.', 'error');
                return;
            }

            if (explicit) setStatus('Searching…');
            try {
                const response = await fetch(`${API_BASE}/directions/search?q=${encodeURIComponent(query)}`);
                const data = await response.json().catch(function () { return {}; });
                if (!response.ok) throw new Error(data.message || 'Address search is unavailable right now.');

                const list = Array.isArray(data.results) ? data.results : [];
                originResults.innerHTML = '';
                originResults.hidden = list.length === 0;

                list.forEach(function (place) {
                    // textContent, never innerHTML: these labels come from an
                    // outside geocoder and are not markup.
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.textContent = place.label;
                    option.className = 'w-full text-left text-xs px-3 py-2.5 rounded-lg text-on-surface hover:bg-outline-variant/30 transition-colors';
                    option.addEventListener('click', function () {
                        useOrigin({ lat: place.latitude, lng: place.longitude }, `From: ${place.label}`);
                    });
                    originResults.appendChild(option);
                });

                setStatus(list.length ? '' : 'No match found. Try a nearby landmark or town.');
            } catch (error) {
                setStatus(error.message, 'error');
            }
        }

        openButton.addEventListener('click', function () {
            const firstOpen = panel.hidden;
            panel.hidden = false;
            // Available the moment a valid destination is known, whether or not a
            // route could be calculated.
            refreshMapsLink();
            document.getElementById('directionsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Permission is requested when directions are asked for, never on load.
            if (firstOpen) requestDeviceLocation();
        });

        document.getElementById('originSearchBtn').addEventListener('click', function () { searchOrigin(true); });
        originSearch.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); searchOrigin(true); }
        });

        /* Suggestions as you type. Debounced and de-duplicated: every keystroke
           would otherwise be one geocoder call, and both this API and the
           service behind it are rate limited. The button stays for anyone who
           would rather ask explicitly. */
        let originSearchTimer = null;
        let lastOriginQuery = '';
        originSearch.addEventListener('input', function () {
            clearTimeout(originSearchTimer);
            const query = (originSearch.value || '').trim();
            if (query.length < 3) {
                if (originResults) originResults.hidden = true;
                lastOriginQuery = '';
                return;
            }
            originSearchTimer = setTimeout(function () {
                if (query === lastOriginQuery) return;
                lastOriginQuery = query;
                searchOrigin();
            }, 450);
        });
        document.getElementById('retryLocationBtn').addEventListener('click', requestDeviceLocation);

        const asideButton = document.getElementById('asideDirectionsBtn');
        if (asideButton) asideButton.addEventListener('click', function () { openButton.click(); });

        // Arriving from a marker's "Get directions" on the tourism map. The click
        // is replayed rather than the panel opened directly, so there is one path
        // into directions and location permission is still asked for by a
        // deliberate action the visitor took.
        if (new URLSearchParams(window.location.search).get('directions') === '1') {
            openButton.click();
        }
    }

    /* The same category colours the landing cards and the map markers use, so a
       place looks like itself wherever it appears. */
    // The categories live in tourism-map.js (window.ZTIMS_CATEGORIES).
    const CATS = () => window.ZTIMS_CATEGORIES;
    const isStayPlace = spot => CATS().isStay(spot);
    function heroBadge(spot) {
        if (isStayPlace(spot)) return { cls: 'cat-stay', icon: 'hotel' };
        const info = CATS().info(CATS().of(spot)[0]);
        return info ? { cls: 'cat-' + info.cat, icon: info.icon } : { cls: 'cat-attraction', icon: 'photo_camera' };
    }

    /* ---- the visitor's journey: where they are and what comes next ---- */

    // A place's heading category: "Places to stay" for one, else its main one;
    // and the filter Home opens for it.
    const categoryTitle = spot => isStayPlace(spot) ? 'Places to stay' : (CATS().label(CATS().of(spot)[0]) || 'Destinations');
    const categoryKey = spot => isStayPlace(spot) ? 'STAY' : (CATS().of(spot)[0] || '');
    // Its other categories, as small pills under the main badge.
    function moreBadges(spot) {
        const codes = CATS().of(spot).slice(isStayPlace(spot) ? 0 : 1);
        return codes.map(code => {
            const info = CATS().info(code);
            return `<span class="cat-badge cat-${info.cat} !bg-surface !text-[11px] !py-0.5"><span class="material-symbols-outlined !text-sm" aria-hidden="true">${info.icon}</span>${escapeHtml(info.label)}</span>`;
        }).join('');
    }

    // "1 Details  2 Payment  3 Confirmed", the current step marked.
    function journeySteps(labels, current) {
        return labels.map((label, i) => `
            <li class="journey-step${i === current ? ' is-current' : ''}${i < current ? ' is-done' : ''}"${i === current ? ' aria-current="step"' : ''}>
                <span class="journey-step__num">${i < current ? '✓' : i + 1}</span><span>${escapeHtml(label)}</span>
            </li>`).join('');
    }

    // What this destination lets a visitor do, and the buttons for it: under the
    // photo, and fixed to the bottom of a phone's screen.
    const actions = { tickets: false, directions: false, bookingUrl: '' };
    let currentIsStay = false;
    function startActions(spot) {
        currentIsStay = isStayPlace(spot);
        actions.directions = Boolean(spotPoint(spot));
        actions.bookingUrl = safeExternalUrl(spot.bookingUrl) || '';
        drawActions();
    }
    function actionButtons(compact) {
        const size = 'btn-pill' + (compact ? ' flex-1 min-w-0 !px-2 !text-xs' : '');
        const list = [];
        if (actions.tickets) list.push(`<button type="button" data-act="tickets" class="btn btn-primary min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">confirmation_number</span>Buy tickets</button>`);
        if (actions.bookingUrl) list.push(`<a href="${escapeHtml(actions.bookingUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">open_in_new</span>${currentIsStay ? 'Book a room' : 'Book now'}</a>`);
        if (actions.directions) list.push(`<button type="button" data-act="directions" class="btn ${actions.tickets || actions.bookingUrl ? 'btn-highlight' : 'btn-primary'} min-h-[44px] ${size}"><span class="material-symbols-outlined !text-base">near_me</span>Directions</button>`);
        return list.join('');
    }
    function drawActions() {
        const bar = document.getElementById('actionBar');
        const phone = document.getElementById('mobileActions');
        const html = actionButtons(false);
        if (bar) { bar.innerHTML = html; bar.hidden = !html; }
        if (phone) {
            phone.innerHTML = actionButtons(true);
            phone.hidden = !html;
            content.classList.toggle('pb-20', Boolean(html));
        }
        honourArrival();
    }
    /* Arriving from a Home page card's action (#tickets) or from
       "What's next" (#directionsSection): go to that action once it exists. */
    const arrivalAct = { '#tickets': 'tickets', '#directionsSection': 'directions' }[window.location.hash] || '';
    let arrivalDone = false;
    // If the action never appears (tickets off), the
    // section that says so is still the place to land.
    if (arrivalAct) setTimeout(() => {
        if (arrivalDone) return;
        arrivalDone = true;
        const id = { tickets: 'spotFacts', directions: 'directionsSection' }[arrivalAct];
        const el = document.getElementById(id);
        if (el && el.offsetHeight) goTo(id);
    }, 3000);
    function honourArrival() {
        if (arrivalDone || !arrivalAct || !actions[arrivalAct]) return;
        arrivalDone = true;
        setTimeout(() => {
            if (arrivalAct === 'tickets') openTickets();
            if (arrivalAct === 'directions') goTo('directionsSection');
        }, 150);
    }
    function openTickets() {
        const modal = document.getElementById('ticketModal');
        if (modal) modal.hidden = false;
    }
    function goTo(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.addEventListener('click', event => {
        const button = event.target.closest('[data-act]');
        if (!button) return;
        const act = button.dataset.act;
        if (act === 'tickets') openTickets();
        if (act === 'directions') goTo('directionsSection');
    });

    // More places, so a visitor who has finished reading one keeps exploring:
    // the nearest first when both have a map pin, the same kind of place first
    // otherwise.
    function distanceKm(a, b) {
        const rad = d => d * Math.PI / 180;
        const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 6371 * 2 * Math.asin(Math.sqrt(h));
    }
    async function renderRelated(spot) {
        const box = document.getElementById('relatedPlaces');
        if (!box) return;
        let all = [];
        try {
            const response = await fetch(`${API_BASE}/spots`);
            if (response.ok) all = await response.json();
        } catch (error) { return; }
        const here = spotPoint(spot);
        const mine = CATS().of(spot);
        const others = (Array.isArray(all) ? all : []).filter(s => s._id !== spot._id).map(s => {
            const there = spotPoint(s);
            return { spot: s, km: here && there ? distanceKm(here, there) : null, same: CATS().of(s).some(code => mine.includes(code)) };
        });
        if (!others.length) return;
        others.sort((a, b) => (a.km !== null && b.km !== null) ? a.km - b.km
            : (a.same === b.same ? 0 : a.same ? -1 : 1));
        const nearby = here && others[0].km !== null;
        box.innerHTML = `
            <h2 id="relatedHeading" class="spot-h2">${nearby ? 'Nearby places to visit' : 'More places to explore'}</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">${others.slice(0, 3).map(({ spot: s, km }) => {
                const b = heroBadge(s);
                return `
                <article class="ztims-card home-card group">
                    <div class="home-card__photo">
                        <img src="${escapeHtml(s.imageUrl || 'https://placehold.co/600x400?text=Zamboanguita')}" alt="" loading="lazy" decoding="async"/>
                    </div>
                    <div class="home-card__body">
                        <span class="cat-badge ${b.cls} self-start !text-[10px] !py-0.5">${escapeHtml(categoryTitle(s))}</span>
                        <h3 class="home-card__title"><a href="spot.html?spotId=${encodeURIComponent(s._id)}" class="home-card__link">${escapeHtml(s.title)}</a></h3>
                        <p class="home-card__meta"><span class="material-symbols-outlined" aria-hidden="true">${km !== null ? 'near_me' : 'location_on'}</span>${km !== null ? `${km < 1 ? 'Under 1' : km.toFixed(1)} km away` : escapeHtml(s.barangay || s.location || '')}</p>
                    </div>
                </article>`; }).join('')}
            </div>`;
        box.hidden = false;
    }

    // Pesos as visitors read them: ₱50, ₱1,250, ₱12.50.
    function peso(amount) {
        const n = Number(amount) || 0;
        return Number.isInteger(n) ? `₱${n.toLocaleString('en-PH')}` : `₱${n.toFixed(2)}`;
    }

    /* The facts a visitor needs before going, in one row of tiles: when it is
       open, what it costs to get in, any travel fee, and where it is. Only what applies to this place is shown. */
    function glanceFacts(spot) {
        const isStay = isStayPlace(spot);
        const rawDays = String(spot.workingDays || '').trim();
        const rawTime = String(spot.workingTime || '').trim();
        const days = !rawDays || /^every ?day$/i.test(rawDays) ? 'Every day' : rawDays;
        const time = !rawTime || /^all ?day$/i.test(rawTime) ? 'All day' : rawTime;
        const fee = Number(spot.entranceFee) || 0;
        const travel = Number(spot.travelFee) || 0;
        const facts = [
            { icon: 'schedule', label: isStay ? 'Open' : 'Open', value: days, sub: time },
        ];
        if (!isStay) facts.push({ key: 'entrance', icon: 'confirmation_number', label: 'Entrance', value: fee > 0 ? peso(fee) : 'Free', sub: fee > 0 ? 'per person · pay online or onsite' : '' });
        if (travel > 0) facts.push({ icon: 'directions_bus', label: 'Travel fee', value: peso(travel), sub: 'estimated' });
        facts.push({ icon: 'location_on', label: 'Barangay', value: spot.barangay || 'Zamboanguita', sub: 'Zamboanguita' });
        return `
            <ul id="spotFacts" class="spot-facts scroll-mt-24" aria-label="At a glance">
                ${facts.map(f => `
                    <li class="spot-fact"${f.key ? ` data-fact="${f.key}"` : ''}>
                        <span class="material-symbols-outlined spot-fact__icon" aria-hidden="true">${f.icon}</span>
                        <span class="spot-fact__label">${escapeHtml(f.label)}</span>
                        <span class="spot-fact__value">${escapeHtml(f.value)}</span>
                        ${f.sub || f.key ? `<span class="spot-fact__sub"${f.sub ? '' : ' hidden'}>${escapeHtml(f.sub)}</span>` : ''}
                    </li>`).join('')}
            </ul>`;
    }

    /* One column, read top to bottom in the order a visitor asks: what is
       this place, what can I do here, the facts at a glance, about it, photos,
       booking, getting there, and what else is near. */
    function renderSpot(spot) {
        const photos = spotPhotos(spot);
        const badge = heroBadge(spot);
        const contact = safeExternalUrl(spot.bookingUrl) ? '' : bookingPanel(spot);

        content.innerHTML = `
            <section class="spot-hero relative w-full overflow-hidden">
                <img class="w-full h-full object-cover" src="${escapeHtml(photos[0] || 'https://placehold.co/1600x900?text=Zamboanguita')}" alt="${escapeHtml(spot.title)}"/>
                <!-- A dark scrim under the words, the same in both themes, kept
                     to the lower part so the picture still reads. -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/25 to-transparent"></div>
                <div class="absolute bottom-0 left-0 right-0">
                    <div class="spot-wrap pb-6 sm:pb-8">
                        <span class="cat-badge ${badge.cls} !bg-surface mb-3"><span class="material-symbols-outlined !text-sm" aria-hidden="true">${badge.icon}</span>${escapeHtml(categoryTitle(spot))}</span>
                        ${moreBadges(spot) ? `<span class="flex flex-wrap gap-1.5 mb-3 -mt-1">${moreBadges(spot)}</span>` : ''}
                        <h1 class="text-[1.9rem] sm:text-4xl md:text-5xl font-display font-black tracking-tight text-white mb-2 break-words">${escapeHtml(spot.title)}</h1>
                        <p class="text-white/90 flex items-center gap-1.5 text-sm">
                            <span class="material-symbols-outlined !text-lg" aria-hidden="true">location_on</span>${escapeHtml(spot.barangay ? `${spot.barangay}, Zamboanguita` : (spot.location || 'Zamboanguita'))}
                        </p>
                    </div>
                </div>
            </section>

            <div class="spot-wrap pt-4 pb-12 space-y-8 sm:space-y-10">
                <div class="space-y-4">
                    <nav aria-label="Breadcrumb" class="text-support flex flex-wrap items-center gap-1.5">
                        <a href="../index.html#browse" class="font-bold hover:text-primary hover:underline">Destinations</a>
                        <span aria-hidden="true">›</span>
                        <a href="../index.html?category=${encodeURIComponent(categoryKey(spot))}#browse" class="font-bold hover:text-primary hover:underline">${escapeHtml(categoryTitle(spot))}</a>
                        <span aria-hidden="true">›</span>
                        <span aria-current="page" class="text-on-surface">${escapeHtml(spot.title)}</span>
                    </nav>
                    <div id="actionBar" hidden class="hidden lg:flex flex-wrap gap-2"></div>
                </div>

                ${glanceFacts(spot)}

                <section>
                    <h2 class="spot-h2">About</h2>
                    ${describe(spot.description)}
                </section>

                ${photoGallerySection(photos)}

                <div id="ticketOffer" class="scroll-mt-24 empty:hidden"></div>
                ${safeExternalUrl(spot.bookingUrl) ? `
                <section class="spot-panel">
                    <h2 class="spot-h2">${isStayPlace(spot) ? 'Book your stay' : 'Book your visit'}</h2>
                    ${bookingPanel(spot)}
                </section>` : contact ? `
                <section class="spot-panel">
                    <h2 class="spot-h2">Contact</h2>
                    ${contact}
                </section>` : ''}

                ${directionsSection(spot)}

                <section id="relatedPlaces" hidden aria-labelledby="relatedHeading"></section>
            </div>
        `;
    }


    // Photo viewer. Wired once per spot; the thumbnails live inside content that
    // renderSpot replaces, so the click handler sits on the grid itself.
    function wirePhotoLightbox(photos) {
        const grid = document.getElementById('spotGallery');
        if (!grid || photos.length === 0) return;

        const lightbox = document.getElementById('photoLightbox');
        const image = document.getElementById('lightboxImage');
        const counter = document.getElementById('lightboxCounter');
        let index = 0;

        function show(next) {
            index = (next + photos.length) % photos.length;   // wraps both ways
            image.src = photos[index];
            image.alt = `Photo ${index + 1} of ${photos.length}`;
            counter.textContent = `${index + 1} / ${photos.length}`;
        }

        function open(at) {
            show(at);
            lightbox.hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function close() {
            lightbox.hidden = true;
            document.body.style.overflow = '';
            image.src = '';
        }

        grid.addEventListener('click', event => {
            const thumb = event.target.closest('[data-photo]');
            if (thumb) open(Number(thumb.dataset.photo));
        });

        document.getElementById('lightboxClose').addEventListener('click', close);
        document.getElementById('lightboxPrev').addEventListener('click', () => show(index - 1));
        document.getElementById('lightboxNext').addEventListener('click', () => show(index + 1));
        lightbox.addEventListener('click', event => { if (event.target === lightbox) close(); });

        document.addEventListener('keydown', event => {
            if (lightbox.hidden) return;
            if (event.key === 'Escape') close();
            if (event.key === 'ArrowLeft') show(index - 1);
            if (event.key === 'ArrowRight') show(index + 1);
        });
    }

    async function loadSpot() {
        const spotId = new URLSearchParams(window.location.search).get('spotId');

        if (!spotId) {
            renderNotFound('No destination selected');
            return;
        }

        const doneLoading = showLoading(content, 'Loading destination...');

        try {
            const response = await fetch(`${API_BASE}/spots/${encodeURIComponent(spotId)}`);
            if (!response.ok) {
                doneLoading();
                renderNotFound('Destination not found');
                return;
            }

            const spot = await response.json();
            doneLoading();
            renderSpot(spot);
            document.title = `${spot.title} | Zamboanguita`;
            wirePhotoLightbox(spotPhotos(spot));
            wireDirections(spot);
            startActions(spot);
            renderRelated(spot);
            // The footer script may have run before this page was drawn.
            if (window.ztimsEmergency) window.ztimsEmergency.fill();
            renderTicketOffer(spotId);
        } catch (error) {
            console.error('❌ Failed to load destination:', error);
            doneLoading();
            renderNotFound('Unable to load this destination');
        }
    }

    loadSpot();
</script>
