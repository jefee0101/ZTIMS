    <style>
        /* Both themes are defined as tokens so every component follows automatically,
           rather than each one carrying its own light-mode override. */
        :root {
            --bg: rgb(var(--ztims-background));
            --surface: rgb(var(--ztims-surface));
            --surface-low: rgb(var(--ztims-surface-low));
            --surface-high: rgb(var(--ztims-surface-high));
            --on-surface: rgb(var(--ztims-on-surface));
            --on-surface-variant: rgb(var(--ztims-on-surface-variant));
            --outline: rgb(var(--ztims-outline));
        }
        html.dark {
            --bg: rgb(var(--ztims-background));
            --surface: rgb(var(--ztims-surface));
            --surface-low: rgb(var(--ztims-surface-low));
            --surface-high: rgb(var(--ztims-surface-high));
            --on-surface: rgb(var(--ztims-on-surface));
            --on-surface-variant: rgb(var(--ztims-on-surface-variant));
            --outline: rgb(var(--ztims-outline));
        }

        body { background: var(--bg); color: var(--on-surface); }

        /* The hidden attribute only gets display:none from the browser default,
           which any Tailwind display class (.flex here) outranks. Without this,
           elements toggled via el.hidden stay on screen. */
        [hidden] { display: none !important; }

        /* The identity gradient. It was gold into orange, which on the sand
           ground was both unreadable and the loudest thing on the page — the
           one element most responsible for the site reading as an orange
           template. Ocean into teal carries the same emphasis and is legible
           in both themes. */
        .text-gradient {
            background: linear-gradient(to right, rgb(var(--ztims-primary)), rgb(var(--ztims-accent)));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Likewise: a primary button is ocean into coastal blue. Gold is for the
           occasional highlight, not for every call to action. */
        .btn-primary-gradient { background: linear-gradient(135deg, rgb(var(--ztims-primary)) 0%, rgb(var(--ztims-secondary)) 100%); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* A white tint reads as "selected" on a dark ground and as nothing at all on
           sand. The identity's teal, held back to a wash, works on both. */
        .nav-item.active {
            color: rgb(var(--ztims-on-surface));
            background: rgb(var(--ztims-accent) / .12);
            box-shadow: inset 0 0 0 1px rgb(var(--ztims-accent) / .30);
        }
        .star-input { cursor: pointer; transition: transform var(--dur-instant) var(--ease-spring); }
        .star-input.filled { font-variation-settings: 'FILL' 1; }

        /* .rise, its easing and the reduced-motion rule all live in
           src/shared/motion.css now, so every page animates the same way and
           there is one place that turns motion off. */
    
/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an establishment name — must
   wrap rather than push the layout sideways. */
img, svg, video, canvas { max-width: 100%; height: auto; }
body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {              /* Chrome, Safari */
        width: 0;
        height: 0;
        display: none;
    }
}

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: 'rgb(var(--ztims-success))' },
        error:   { icon: 'error',        accent: 'rgb(var(--ztims-error))' },
        info:    { icon: 'info',         accent: 'rgb(var(--ztims-secondary))' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:0',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'color:rgb(var(--ztims-on-surface))',
            'border:1px solid var(--glass-hairline)',
            'border-left:4px solid ' + settings.accent,
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn var(--dur-moderate, 300ms) var(--ease-decelerate, ease-out)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:rgb(var(--ztims-on-surface-variant));font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut 200ms var(--ease-accelerate, ease-in) forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script>
/* Where the payment service sends a visitor back. The page never decides that
   a payment happened: it asks ZTIMS, which asks the payment service itself. */
(function () {
    const API_BASE = "/api";
    const box = document.getElementById('payState');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('c') || '';
    const cancelled = params.get('cancelled') === '1';
    let tries = 0;

    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const peso = n => '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const METHOD = { gcash: 'GCash', maya: 'Maya', card: 'Card', grabpay: 'GrabPay', shopeepay: 'ShopeePay', qrph: 'QR Ph', bank: 'Online banking' };
    function niceDate(value) {
        const [y, m, d] = String(value || '').slice(0, 10).split('-').map(Number);
        if (!y) return esc(value);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-PH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }
    const row = (label, value) => `
        <div class="flex justify-between gap-4 py-2 border-b border-outline-variant/20 text-sm">
            <span class="text-on-surface-variant">${label}</span><span class="font-bold text-on-surface text-right">${value}</span>
        </div>`;

    function show(html) { box.innerHTML = html; }

    function heading(icon, tone, title, sub) {
        return `
            <div class="flex items-start gap-3">
                <span class="icon-chip ${tone}"><span class="material-symbols-outlined">${icon}</span></span>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-display font-extrabold tracking-tight text-on-surface">${title}</h1>
                    ${sub ? `<p class="text-on-surface-variant text-sm mt-1">${sub}</p>` : ''}
                </div>
            </div>`;
    }

    function paidLine(c) {
        return row('Paid', `${peso(c.amount)} · ${esc(METHOD[c.method] || c.method || 'online')} · test mode`);
    }

    function render(c) {
        if (c.status === 'paid' && c.kind === 'guide_booking' && c.booking) {
            const b = c.booking;
            show(heading('task_alt', 'tone-success', 'Payment received',
                    `Booking <b class="font-mono">${esc(b.reference)}</b> is confirmed.`) + `
                <div>
                    ${row('Destination', esc(b.spot))}
                    ${row('Date', `${niceDate(b.preferredDate)} · ${esc(b.preferredTime)}`)}
                    ${row('Visitors', esc(b.visitors))}
                    ${paidLine(c)}
                </div>
                <p class="text-sm text-on-surface-variant">
                    The Municipal Tourism Office will assign your guide. Keep your reference,
                    <b class="font-mono">${esc(b.reference)}</b>: it is how the office finds your booking.
                </p>`);
            return;
        }
        if (c.status === 'paid' && c.kind === 'ticket' && c.ticket && c.ticket.code) {
            const t = c.ticket;
            show(heading('confirmation_number', 'tone-success', 'Your entrance ticket',
                    'Show this at the entrance. Take a screenshot so you have it even without signal.') + `
                <div class="ztims-card p-5 sm:p-6 flex flex-col items-center gap-3 text-center">
                    <p class="text-label font-bold uppercase tracking-widest text-on-surface-variant">${esc(t.spot)}</p>
                    <p class="text-lg font-bold text-on-surface">${niceDate(t.visitDate)}</p>
                    <div class="bg-white p-3 w-52 h-52 [&>svg]:w-full [&>svg]:h-full" role="img" aria-label="QR code for ticket ${esc(t.code)}">${t.qr}</div>
                    <p class="font-mono text-2xl font-black tracking-widest text-on-surface select-all">${esc(t.code)}</p>
                    <p class="text-on-surface">${esc(t.people)} ${Number(t.people) === 1 ? 'person' : 'people'} · ${esc(t.name)}</p>
                    ${t.status === 'used' ? '<p class="tone-info tone-pill text-xs font-bold px-2 py-1">Already used at the gate</p>' : ''}
                </div>
                <div>${paidLine(c)}</div>
                <p class="text-support">Valid on this date only. If the office has to close the attraction, your payment is refunded.</p>`);
            return;
        }
        if (c.status === 'duplicate') {
            show(heading('info', 'tone-warning', 'Payment received twice',
                'This payment arrived after the booking or ticket was already paid or cancelled. The Municipal Tourism Office will refund it.'));
            return;
        }
        if (c.status === 'expired') {
            show(heading('schedule', 'tone-neutral', 'This payment link has expired',
                'Nothing was charged. You can start again from the destination’s page, or pay at the Municipal Tourism Office.'));
            return;
        }
        // Still pending.
        if (cancelled) {
            const ref = c.booking ? `Your booking <b class="font-mono">${esc(c.booking.reference)}</b> is still saved.` : 'Your tickets were not bought.';
            show(heading('undo', 'tone-neutral', 'Payment cancelled', `Nothing was charged. ${ref}`) + `
                <div class="flex flex-wrap gap-2">
                    ${c.payUrl ? `<a href="${esc(c.payUrl)}" class="btn btn-primary min-h-[44px]">Try paying again</a>` : ''}
                    <a href="../index.html" class="btn btn-ghost min-h-[44px]">Back to destinations</a>
                </div>
                ${c.booking ? '<p class="text-support">You can also pay at the Municipal Tourism Office.</p>' : ''}`);
            return;
        }
        if (tries < 20) {
            tries += 1;
            setTimeout(load, 2000);
            return;
        }
        show(heading('hourglass_top', 'tone-warning', 'Still waiting for the payment service',
            'You can close this page. When the payment arrives, ZTIMS confirms it by itself.') +
            (c.booking ? `<p class="text-sm">Your reference: <b class="font-mono">${esc(c.booking.reference)}</b></p>` : ''));
    }

    async function load() {
        if (!/^[0-9a-f]{24}$/.test(id)) {
            show(heading('error', 'tone-danger', 'Payment not found', 'This link is incomplete. Open the payment again from the destination’s page.'));
            return;
        }
        try {
            const response = await fetch(`${API_BASE}/payments/checkout/${id}`);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || 'This payment could not be found.');
            render(data.checkout);
        } catch (error) {
            show(heading('error', 'tone-danger', 'Payment not found', esc(error.message)));
        }
    }

    load();
})();
</script>
</body>
</html>
