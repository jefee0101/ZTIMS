<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <script src="../shared/theme.js"></script>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Set your password | Zamboanguita Tourism</title>
  <meta name="referrer" content="no-referrer"/>
    <link rel="icon" href="../../favicon.ico" sizes="32x32"/>
    <link rel="icon" type="image/png" href="../../favicon-192.png" sizes="192x192"/>
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>


  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          // Sharp edges: every rounded-* utility draws a square corner.
          borderRadius: { none: "0", sm: "0", DEFAULT: "0", md: "0", lg: "0", xl: "0", "2xl": "0", "3xl": "0", full: "0" },
          transitionTimingFunction: { DEFAULT: 'cubic-bezier(.2, 0, 0, 1)', standard: 'cubic-bezier(.2, 0, 0, 1)', decelerate: 'cubic-bezier(.05, .7, .1, 1)', accelerate: 'cubic-bezier(.3, 0, .8, .15)', spring: 'cubic-bezier(.34, 1.56, .64, 1)' },
          transitionDuration: { DEFAULT: '220ms' },
          colors: {
              "primary": "rgb(var(--ztims-primary) / <alpha-value>)",
              "primaryHover": "rgb(var(--ztims-primary-dim) / <alpha-value>)",
              "accent": "rgb(var(--ztims-accent) / <alpha-value>)",
              "background": "rgb(var(--ztims-background) / <alpha-value>)",
              "surface": "rgb(var(--ztims-surface) / <alpha-value>)",
              "surface-high": "rgb(var(--ztims-surface-high) / <alpha-value>)",
              "on-surface": "rgb(var(--ztims-on-surface) / <alpha-value>)",
              "on-surface-variant": "rgb(var(--ztims-on-surface-variant) / <alpha-value>)",
              "outline": "rgb(var(--ztims-outline) / <alpha-value>)",
              "gold": "rgb(var(--ztims-gold) / <alpha-value>)",
              "orange": "rgb(var(--ztims-orange) / <alpha-value>)",
              "success": "rgb(var(--ztims-success) / <alpha-value>)"
          },
          fontFamily: {
            headline: ["Poppins", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>

  <style>
    :root {
        --bg: rgb(var(--ztims-background)); --surface: rgb(var(--ztims-surface)); --surface-high: rgb(var(--ztims-surface-high));
        --on-surface: rgb(var(--ztims-on-surface)); --on-surface-variant: rgb(var(--ztims-on-surface-variant)); --outline: rgb(var(--ztims-outline));
    }
    html.dark {
        --bg: rgb(var(--ztims-background)); --surface: rgb(var(--ztims-surface)); --surface-high: rgb(var(--ztims-surface-high));
        --on-surface: rgb(var(--ztims-on-surface)); --on-surface-variant: rgb(var(--ztims-on-surface-variant)); --outline: rgb(var(--ztims-outline));
    }
    body { background: var(--bg); color: var(--on-surface); font-family: 'Plus Jakarta Sans', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    [hidden] { display: none !important; }
  
/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an enterprise name — must
   wrap rather than push the layout sideways. */
img, svg, video, canvas { max-width: 100%; height: auto; }
body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {              /* Chrome, Safari */
        width: 0;
        height: 0;
        display: none;
    }
}
</style>
    <!-- Zamboanguita Coastal Tourism palette. Linked after the page's own
         styles so the tokens win over anything left hardcoded. -->
    <link rel="stylesheet" href="../shared/theme.css"/>
    <!-- Motion tokens, page transitions, and the one reduced-motion block. -->
    <link rel="stylesheet" href="../shared/motion.css"/>
</head>
<body class="min-h-screen">
<!-- A staff invitation (staff-invitations.js): the person chooses their own
     password through the single-use link the Tourism Office sent. Laid out like
     Staff sign in (.ss-* in theme.css). -->
<div class="ss-split">
<aside class="ss-photo" aria-hidden="true">
  <img src="https://res.cloudinary.com/xeo3pvpw/video/upload/so_0,q_auto,w_1200,c_limit/v1793436461/zambo-10_31_2026_4_46_PM.jpg" alt="" loading="eager" decoding="async"/>
  <div class="ss-photo__words">
    <p class="ss-photo__kicker">Zamboanguita, Negros Oriental</p>
    <p class="ss-photo__title">Zamboanguita Tourism staff portal.</p>
  </div>
</aside>
<div class="ss-side">
  <div class="ss-top">
    <a href="../../index.html" class="ss-back">
      <span class="material-symbols-outlined !text-base" aria-hidden="true">arrow_back</span>Back to the site
    </a>
    <button id="themeToggleBtn" type="button" title="Toggle theme" aria-label="Toggle theme" class="ss-theme">
      <span id="themeToggleIcon" class="material-symbols-outlined">dark_mode</span>
    </button>
  </div>
<main class="page-enter ss-main">
  <div class="ss-card">
    <div class="ss-head">
      <h1 class="ss-title">Set your password</h1>
      <p id="inviteFor" class="ss-lede" hidden></p>
    </div>
    <p id="inviteLoading" class="text-sm">Checking your invitation…</p>
    <form id="acceptForm" class="space-y-5" novalidate hidden>
      <input id="inviteEmail" type="email" autocomplete="username" hidden readonly/>
      <div>
        <label for="password" class="bk-label">New password</label>
        <div class="relative">
          <input id="password" type="password" required minlength="10" maxlength="72" autocomplete="new-password" placeholder="At least 10 characters" class="bk-field ss-field !pr-12"/>
        </div>
      </div>
      <div>
        <label for="passwordAgain" class="bk-label">Repeat the new password</label>
        <div class="relative">
          <input id="passwordAgain" type="password" required minlength="10" maxlength="72" autocomplete="new-password" class="bk-field ss-field !pr-12"/>
        </div>
      </div>
      <button type="submit" id="acceptBtn" class="btn btn-pill btn-primary ss-submit w-full min-h-[48px]">Set password</button>
    </form>
    <p id="formMessage" role="alert" class="text-sm px-4 py-3" hidden></p>
    <p id="signInLink" class="ss-note" hidden><a href="../staff_login.html" class="ss-link">Go to Staff sign in</a></p>
  </div>
</main>
</div>
</div>
<script>
(function () {
    const API_BASE = '/api';
    // The token is read once and taken out of the address, so it is not left
    // in the history or passed on.
    const token = new URLSearchParams(location.search).get('token') || '';
    if (location.search) history.replaceState(null, '', location.pathname);
    const $ = id => document.getElementById(id);
    const INVALID = 'This invitation link is no longer valid. Ask the Tourism Office for a new one.';

    function say(text, tone) {
        const box = $('formMessage');
        box.textContent = text;
        box.className = `text-sm px-4 py-3 tone-${tone}`;
        box.hidden = !text;
    }
    function dead(message) {
        $('inviteLoading').hidden = true;
        $('acceptForm').hidden = true;
        say(message || INVALID, 'danger');
        $('signInLink').hidden = false;
    }
    async function post(path, body) {
        const res = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok && data.success !== false, data };
    }

    (async () => {
        if (!token) return dead();
        try {
            const { ok, data } = await post('/invitations/check', { token });
            if (!ok) return dead(data.code === 'INVALID_INVITATION' ? INVALID : data.message);
            $('inviteLoading').hidden = true;
            $('inviteFor').textContent = `${data.account} account for ${data.email}`;
            $('inviteFor').hidden = false;
            $('inviteEmail').value = data.email;
            $('acceptForm').hidden = false;
            $('password').focus();
        } catch { dead('Could not reach ZTIMS. Check your connection and open the link again.'); }
    })();

    $('acceptForm').addEventListener('submit', async event => {
        event.preventDefault();
        const password = $('password').value;
        if (password.length < 10) return say('Your password must be at least 10 characters.', 'danger');
        if (password !== $('passwordAgain').value) return say('The two passwords do not match.', 'danger');
        const button = $('acceptBtn');
        button.disabled = true; button.textContent = 'Saving…';
        try {
            const { ok, data } = await post('/invitations/accept', { token, password });
            if (ok) {
                $('acceptForm').hidden = true;
                say(data.message || 'Your password is set. Sign in with it now.', 'success');
                $('signInLink').hidden = false;
                setTimeout(() => location.assign('../staff_login.html'), 2500);
                return;
            }
            if (data.code === 'INVALID_INVITATION') return dead(INVALID);
            say(data.message || 'Your password was not saved. Try again.', 'danger');
        } catch {
            say('Could not reach ZTIMS. Your password was not saved. Try again.', 'danger');
        } finally {
            button.disabled = false; button.textContent = 'Set password';
        }
    });
})();
</script>
<script type="module" src="../shared/password-eye.js"></script>
</body>
</html>
