    <style>

    
/* ==========================================================
   COLLAPSIBLE SIDEBAR — identical on every portal page, and the
   collapsed choice is shared, so it survives navigating between them.
   The header and main are sized against the sidebar's 16rem, so all
   three shift together or the layout tears. !important because the
   Tailwind CDN injects its own sm: rules after this block.
   ========================================================== */
[hidden] { display: none !important; }

@media (min-width: 640px) {
    /* Labels collapse by width + opacity rather than display:none, because display
       cannot be animated — it would snap the text away before the rail finishes
       sliding. Everything animates on the same curve and duration so the rail, the
       header, the content and the labels move as one piece. */
    aside, header, main {
        transition: width var(--dur-moderate) var(--ease-standard), padding var(--dur-moderate) var(--ease-standard), margin-left var(--dur-moderate) var(--ease-standard) !important;
    }
    aside .sidebar-label,
    aside .sidebar-brand-full {
        opacity: 1; max-width: 13rem; white-space: nowrap; overflow: hidden;
        transition: opacity var(--dur-fast) var(--ease-standard) 60ms, max-width var(--dur-moderate) var(--ease-standard) !important;
    }
    aside a, aside button:not(#sidebarToggleBtn) {
        transition: gap var(--dur-moderate) var(--ease-standard), padding var(--dur-moderate) var(--ease-standard), color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard) !important;
    }
    body.sidebar-collapsed aside { width: 5rem !important; padding-left: .75rem !important; padding-right: .75rem !important; }
    body.sidebar-collapsed header { width: calc(100% - 5rem) !important; }
    body.sidebar-collapsed main { width: calc(100% - 5rem) !important; margin-left: 5rem !important; }
    body.sidebar-collapsed aside .sidebar-label,
    body.sidebar-collapsed aside .sidebar-brand-full { opacity: 0 !important; max-width: 0 !important; transition-delay: 0s !important; }
    body.sidebar-collapsed .sidebar-brand-short { display: block !important; animation: railBrandIn .3s ease both; }
    body.sidebar-collapsed aside a,
    body.sidebar-collapsed aside button:not(#sidebarToggleBtn) {
        justify-content: center !important;
        gap: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }
}
.sidebar-brand-short { display: none; }

/* ==========================================================
   MOBILE NAVIGATION (below 640px)
   The rail is fixed and 16rem wide at every size, so on a phone it simply sat
   on top of the page: the content began underneath it and could not be read.
   Below 640px it becomes a drawer that slides in from the left, opened by the
   button in the header and closed by the scrim, the Escape key, or choosing a
   destination. The collapse rules above are desktop-only, so the two never meet.
   ========================================================== */
@media (max-width: 639px) {
    aside {
        width: 17rem !important;
        max-width: 86vw !important;
        transform: translateX(-100%);
        transition: transform var(--dur-moderate) var(--ease-decelerate) !important;
    }
    body.nav-open aside {
        transform: none;
        box-shadow: var(--ztims-shadow-overlay);
    }
    header, main {
        width: 100% !important;
        margin-left: 0 !important;
    }
    #navScrim {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: rgb(var(--ztims-background) / .6);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-moderate) var(--ease-standard);
    }
    body.nav-open #navScrim { opacity: 1; pointer-events: auto; }
    body.nav-open { overflow: hidden; }
}
@media (min-width: 640px) {
    #navScrim, #navOpenBtn { display: none !important; }
}

@keyframes railBrandIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an establishment name — must
   wrap rather than push the layout sideways. */
img, svg, video, canvas { max-width: 100%; height: auto; }
body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {              /* Chrome, Safari */
        width: 0;
        height: 0;
        display: none;
    }
}

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: 'rgb(var(--ztims-success))' },
        error:   { icon: 'error',        accent: 'rgb(var(--ztims-error))' },
        info:    { icon: 'info',         accent: 'rgb(var(--ztims-secondary))' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:0',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'color:rgb(var(--ztims-on-surface))',
            'border:1px solid var(--glass-hairline)',
            'border-left:4px solid ' + settings.accent,
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn var(--dur-moderate, 300ms) var(--ease-decelerate, ease-out)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:rgb(var(--ztims-on-surface-variant));font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut 200ms var(--ease-accelerate, ease-in) forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script>
/* ==========================================================
   ACCOUNT AVATAR + MENU (upper right)
   One button showing who is signed in, and a small menu under it. Built in
   JavaScript rather than markup so every page mounts the same thing with its
   own links, the way the toast module is shared.

   mountAccountMenu({ container, name, email, imageUrl, items, signedOutLabel,
                      signedOutHref })
     name / email : shown in the menu's header; the initial becomes the avatar
     imageUrl     : optional photo (Google accounts have one)
     items        : [{ label, icon, href }] or [{ label, icon, onSelect }]
     signedOut*   : when name and email are both empty, the avatar is replaced
                    by this link, so a guest gets a way in rather than a
                    meaningless blank circle
   ========================================================== */
(function () {
    function initialFrom(name, email) {
        var source = (name || email || '').trim();
        return source ? source.charAt(0).toUpperCase() : '?';
    }

    window.mountAccountMenu = function (options) {
        var container = options.container;
        if (!container) return;
        container.innerHTML = '';

        var signedIn = Boolean((options.name || '').trim() || (options.email || '').trim());

        if (!signedIn) {
            var signIn = document.createElement('a');
            signIn.href = options.signedOutHref || '#';
            signIn.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-full border border-current/30 text-sm font-bold hover:opacity-80 transition-opacity';
            signIn.innerHTML = '<span class="material-symbols-outlined !text-lg">account_circle</span>' +
                               '<span>' + (options.signedOutLabel || 'Sign in') + '</span>';
            container.appendChild(signIn);
            return;
        }

        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative';

        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-haspopup', 'menu');
        button.setAttribute('aria-expanded', 'false');
        button.title = options.name || options.email || 'Account';
        button.style.cssText = [
            'display:flex', 'align-items:center', 'justify-content:center',
            'width:2.5rem', 'height:2.5rem', 'border-radius:0',
            'border:2px solid rgb(var(--ztims-secondary) / .55)', 'background:rgb(var(--ztims-surface-variant))',
            'color:rgb(var(--ztims-accent))',
            'font-weight:800', 'font-size:.95rem', 'cursor:pointer', 'overflow:hidden',
            'transition:transform var(--dur-fast) var(--ease-standard)'
        ].join(';');

        if (options.imageUrl) {
            var photo = document.createElement('img');
            photo.src = options.imageUrl;
            photo.alt = '';
            photo.style.cssText = 'width:100%;height:100%;object-fit:cover';
            // A broken photo link would otherwise leave an empty circle.
            photo.addEventListener('error', function () {
                photo.remove();
                button.textContent = initialFrom(options.name, options.email);
            });
            button.appendChild(photo);
        } else {
            button.textContent = initialFrom(options.name, options.email);
        }
        button.addEventListener('mouseenter', function () { button.style.transform = 'scale(1.06)'; });
        button.addEventListener('mouseleave', function () { button.style.transform = 'none'; });

        var menu = document.createElement('div');
        menu.setAttribute('role', 'menu');
        menu.hidden = true;
        menu.style.cssText = [
            'position:absolute', 'top:calc(100% + .6rem)', 'right:0', 'z-index:1500',
            'min-width:15rem', 'padding:.4rem',
            'border-radius:var(--radius-lg, 1rem)',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'border:1px solid var(--glass-hairline)',
            'color:rgb(var(--ztims-on-surface))',
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'transform-origin:top right',
            'animation:ztimsMenuIn var(--dur-base, 220ms) var(--ease-decelerate, ease-out)',
            'font-size:.85rem'
        ].join(';');

        var header = document.createElement('div');
        header.style.cssText = 'padding:.65rem .75rem;border-bottom:1px solid rgb(var(--ztims-outline));margin-bottom:.3rem';
        var nameLine = document.createElement('div');
        nameLine.textContent = options.name || options.email;
        nameLine.style.cssText = 'font-weight:800;word-break:break-word';
        header.appendChild(nameLine);
        if (options.email && options.name) {
            var emailLine = document.createElement('div');
            emailLine.textContent = options.email;
            emailLine.style.cssText = 'font-size:.75rem;color:rgb(var(--ztims-on-surface-variant));word-break:break-all;margin-top:.1rem';
            header.appendChild(emailLine);
        }
        menu.appendChild(header);

        function close() {
            menu.hidden = true;
            button.setAttribute('aria-expanded', 'false');
        }

        (options.items || []).forEach(function (item) {
            var entry = document.createElement(item.href ? 'a' : 'button');
            entry.setAttribute('role', 'menuitem');
            if (item.href) entry.href = item.href; else entry.type = 'button';
            entry.style.cssText = [
                'display:flex', 'align-items:center', 'gap:.6rem', 'width:100%',
                'padding:.6rem .75rem', 'border:0', 'border-radius:0',
                'background:none', 'color:' + (item.danger ? 'rgb(var(--ztims-error))' : 'inherit'),
                'font:inherit', 'text-align:left', 'text-decoration:none', 'cursor:pointer'
            ].join(';');
            entry.innerHTML = '<span class="material-symbols-outlined !text-lg">' + (item.icon || 'chevron_right') + '</span>';
            var label = document.createElement('span');
            label.textContent = item.label;   // text, never markup
            entry.appendChild(label);

            entry.addEventListener('mouseenter', function () { entry.style.background = 'rgb(var(--ztims-on-surface) / .06)'; });
            entry.addEventListener('mouseleave', function () { entry.style.background = 'none'; });
            entry.addEventListener('click', function () {
                close();
                if (item.onSelect) item.onSelect();
            });
            menu.appendChild(entry);
        });

        button.addEventListener('click', function (event) {
            event.stopPropagation();
            var opening = menu.hidden;
            menu.hidden = !opening;
            button.setAttribute('aria-expanded', String(opening));
        });
        document.addEventListener('click', function (event) {
            if (!menu.hidden && !wrap.contains(event.target)) close();
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') close();
        });

        wrap.appendChild(button);
        wrap.appendChild(menu);
        container.appendChild(wrap);
    };
})();
</script>

                <label class="block"><span class="field-label">Month</span><select id="rgPeriod" class="field w-56"></select></label>
                <button id="rgAdd" type="button" class="btn btn-primary min-h-[44px] ml-auto" disabled>
                    <span class="material-symbols-outlined !text-base" aria-hidden="true">add</span><span id="rgAddLabel">Add a stay</span>
                </button>
            </div>

            <div id="rgTiles" class="stat-tiles"></div>
            <p id="rgByCountry" class="text-support"></p>

            <section class="glass-panel" aria-labelledby="rgListTitle">
                <h2 id="rgListTitle" class="px-5 pt-4 pb-3 text-lg font-extrabold text-on-surface border-b border-outline-variant/30">Stays</h2>
                <div id="rgList" class="ztims-stagger divide-y divide-outline-variant/20"></div>
            </section>

            <p class="flex flex-wrap items-center gap-3">
                <a id="rgReportLink" href="resort_statistics.html" class="btn btn-secondary min-h-[44px]">
                    <span class="material-symbols-outlined !text-base" aria-hidden="true">bar_chart</span>Open the monthly report</a>
            </p>
        </div>
    </main>

    <!-- Add or change one stay (a place to stay) or one group (an attraction). -->
    <div id="entryModal" hidden class="fixed inset-0 ztims-scrim flex items-center justify-center z-[200] p-3 sm:p-4">
        <form id="entryForm" class="ztims-modal w-full max-w-2xl p-5 sm:p-7 space-y-5 overflow-y-auto" novalidate>
            <div class="flex justify-between items-start gap-4">
                <h2 id="entryTitle" class="text-2xl font-black tracking-tight font-headline">Add a stay</h2>
                <button type="button" data-close aria-label="Close" class="text-on-surface-variant hover:text-on-surface flex"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="block"><span id="entryDateLabel" class="block text-sm font-semibold text-on-surface mb-1.5">Check-in date</span>
                    <input id="entryDate" type="date" required class="field min-h-[44px]"/></label>
                <div data-stay>
                    <span class="block text-sm font-semibold text-on-surface mb-1.5">Nights</span>
                    <div class="qty" data-qty="entryNights"><button type="button" data-step="-1" aria-label="One night less">−</button><input id="entryNights" type="number" min="1" max="365" value="1" aria-label="Nights"/><button type="button" data-step="1" aria-label="One night more">+</button></div>
                </div>
                <div data-stay>
                    <span class="block text-sm font-semibold text-on-surface mb-1.5">Rooms</span>
                    <div class="qty" data-qty="entryRooms"><button type="button" data-step="-1" aria-label="One room less">−</button><input id="entryRooms" type="number" min="1" max="1000" value="1" aria-label="Rooms"/><button type="button" data-step="1" aria-label="One room more">+</button></div>
                </div>
            </div>
            <div>
                <div class="rg-guest-head"><span class="text-sm font-semibold text-on-surface">Guests</span><span>Male</span><span>Female</span><span></span></div>
                <div id="entryGuests" class="space-y-2"></div>
                <button type="button" id="entryAddCountry" class="btn btn-secondary btn-sm min-h-[40px] mt-3">
                    <span class="material-symbols-outlined !text-base" aria-hidden="true">add</span>Add a country</button>
                <p id="entryTotal" class="text-sm font-semibold text-on-surface mt-3"></p>
            </div>
            <p id="entryError" hidden class="text-sm text-error bg-error/10 border border-error/20 px-4 py-3"></p>
            <div class="flex justify-end gap-3 pt-1">
                <button type="button" data-close class="btn btn-cancel min-h-[44px]">Cancel</button>
                <button type="submit" id="entrySave" class="btn btn-primary min-h-[44px]">Save stay</button>
            </div>
        </form>
    </div>

    <script type="module" src="../shared/stat-form.js"></script>
    <script>
        const API_BASE = "/api";

        function authHeaders(extra) {
            return Object.assign({ 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` }, extra || {});
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
            ));
        }

        // Shared with the sidebar's Log Out, so both doors behave identically.
        function signOutStaff() {
            try {
                window.ztimsTheme.clearStorage();
                sessionStorage.clear();
            } catch (e) { /* private browsing */ }
            if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
            setTimeout(function () { window.location.replace('../../index.html'); }, 600);
        }

        function mountPortalAccountMenu() {
            mountAccountMenu({
                container: document.getElementById('accountMenuSlot'),
                name: localStorage.getItem('establishmentName') || localStorage.getItem('resortName') || 'My establishment',
                email: localStorage.getItem('userEmail') || '',
                items: [
                    { label: 'Account', icon: 'manage_accounts', href: 'resort_settings.html' },
                    { label: 'Sign out', icon: 'logout', danger: true, onSelect: signOutStaff }
                ]
            });
        }

        function guardEstablishmentManagerSession() {
            const role = localStorage.getItem('userRole');
            if (!['establishment_manager', 'resort_owner'].includes(role) || !localStorage.getItem('authToken')) {
                window.location.href = '../staff_login.html';
                return false;
            }
            return true;
        }

        function handleExpiredSession() {
            showToast('Your sign-in has expired. Please sign in again.', 'error');
            ['authToken', 'userRole', 'userEmail', 'userId'].forEach(k => localStorage.removeItem(k));
            setTimeout(() => window.location.replace('../staff_login.html'), 900);
        }

        let myPlaces = [], residenceList = [], current = null, editing = null;
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const fmt = n => (Number(n) || 0).toLocaleString('en-US');
        const place = () => myPlaces.find(p => p._id === document.getElementById('rgPlace').value);
        const isStay = () => (place() || {}).kind === 'accommodation';
        const period = () => document.getElementById('rgPeriod').value.split('-').map(Number);
        const nameOf = code => (residenceList.find(r => r.code === code) || {}).name || code;
        const manilaToday = () => new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
        const shortDay = iso => { const [y, m, d] = iso.split('-').map(Number); return { d, mon: MONTHS[m - 1].slice(0, 3), y }; };

        async function api(path, method = 'GET', body) {
            const res = await fetch(`${API_BASE}/statistics${path}`, {
                method, headers: authHeaders(body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined
            });
            if (res.status === 401) { handleExpiredSession(); throw new Error('Signed out'); }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'That did not work. Try again.');
            return data;
        }

        function guestsLine(guests) {
            return guests.map(g => {
                const parts = [g.male ? `${g.male} male` : '', g.female ? `${g.female} female` : ''].filter(Boolean).join(', ');
                return `<span class="rg-guest">${window.ZTIMS_STATS.flag(g.code)}${escapeHtml(nameOf(g.code))} · ${parts}</span>`;
            }).join('');
        }

        async function load() {
            const p = place();
            if (!p) return;
            const [year, month] = period();
            const stay = isStay();
            document.getElementById('rgAddLabel').textContent = stay ? 'Add a stay' : 'Add a group';
            document.getElementById('rgListTitle').textContent = `${stay ? 'Stays' : 'Groups'} in ${MONTHS[month - 1]} ${year}`;
            document.getElementById('rgReportLink').href = `resort_statistics.html?month=${year}-${month}`;
            const list = document.getElementById('rgList');
            list.innerHTML = '<div class="p-4"><div class="ztims-empty">Loading…</div></div>';
            try {
                current = await api(`/register/${p._id}/${year}/${month}`);
            } catch (e) {
                if (e.message !== 'Signed out') list.innerHTML = `<div class="p-4"><div class="ztims-empty tone-danger">${escapeHtml(e.message)}</div></div>`;
                return;
            }
            document.getElementById('rgAdd').disabled = !current.mayEdit;
            const t = current.totals;
            const male = t.counts.reduce((n, c) => n + c.male, 0), female = t.counts.reduce((n, c) => n + c.female, 0);
            const tile = (label, value) => `<div class="stat-tile"><p>${label}</p><p>${fmt(value)}</p></div>`;
            document.getElementById('rgTiles').innerHTML = stay
                ? tile('Guests arrived', t.arrivals) + tile('Room-nights', t.roomNights) + tile('Guest nights', t.guestNights) + tile('Stays', t.entries)
                : tile('Visitors', t.arrivals) + tile('Male', male) + tile('Female', female) + tile('Groups', t.entries);
            document.getElementById('rgByCountry').innerHTML = t.counts.length
                ? `By country: ${t.counts.map(c => `${escapeHtml(nameOf(c.code))} ${c.male ? c.male + ' M' : ''}${c.male && c.female ? ', ' : ''}${c.female ? c.female + ' F' : ''}`).join(' · ')}`
                : '';
            if (!current.entries.length) {
                list.innerHTML = `<div class="p-4"><div class="ztims-empty">No ${stay ? 'stays' : 'groups'} yet for this month.</div></div>`;
                return;
            }
            const monthStart = `${year}-${String(month).padStart(2, '0')}-01`;
            list.innerHTML = current.entries.map(e => {
                const d = shortDay(e.date);
                const people = e.guests.reduce((n, g) => n + g.male + g.female, 0);
                const before = e.date < monthStart;
                return `
                <div class="rg-row" data-id="${escapeHtml(e._id)}">
                    <div class="bk-row__date"><span class="bk-row__day">${d.d}</span><span>${d.mon}</span></div>
                    <div class="dest-row__body">
                        <h3 class="dest-row__name">${stay ? `${e.nights} night${e.nights === 1 ? '' : 's'} · ${e.rooms} room${e.rooms === 1 ? '' : 's'}` : `${people} visitor${people === 1 ? '' : 's'}`}</h3>
                        <p class="rg-guests">${guestsLine(e.guests)}</p>
                        ${before ? `<div class="dest-row__issues"><span class="tone-pill tone-neutral rounded-pill text-xs font-bold px-2.5 py-0.5">Checked in ${d.mon} ${d.d}: only its nights count here</span></div>` : ''}
                    </div>
                    ${current.mayEdit ? `<div class="dest-row__actions">
                        <button type="button" data-edit class="btn btn-secondary btn-sm min-h-[40px]">Edit</button>
                        <button type="button" data-remove class="btn btn-cancel btn-sm min-h-[40px]">Remove</button>
                    </div>` : ''}
                </div>`;
            }).join('');
        }

        /* ---- the window ------------------------------------------------ */
        function residenceOptions(selected) {
            const groups = [];
            for (const r of residenceList) {
                const label = r.section === 'philippine' ? 'Philippine residents' : r.section === 'foreign' ? r.region : 'Other';
                let g = groups.find(x => x.label === label);
                if (!g) groups.push(g = { label, rows: [] });
                g.rows.push(r);
            }
            return groups.map(g => `<optgroup label="${escapeHtml(g.label)}">${g.rows.map(r =>
                `<option value="${escapeHtml(r.code)}"${r.code === selected ? ' selected' : ''}>${escapeHtml(r.name)}</option>`).join('')}</optgroup>`).join('');
        }
        const qty = (name, value, label) => `<div class="qty"><button type="button" data-step="-1" aria-label="${label} less">−</button><input type="number" min="0" max="10000" value="${value}" data-sex="${name}" aria-label="${label}"/><button type="button" data-step="1" aria-label="${label} more">+</button></div>`;
        function guestRow(g) {
            const row = document.createElement('div');
            row.className = 'rg-guest-row';
            row.innerHTML = `<select class="field min-h-[44px]" aria-label="Country of residence">${residenceOptions(g.code)}</select>
                <div class="rg-q"><span class="rg-sex">Male</span>${qty('male', g.male, 'Male')}</div>
                <div class="rg-q"><span class="rg-sex">Female</span>${qty('female', g.female, 'Female')}</div>
                <button type="button" data-remove-row class="rg-x" aria-label="Remove this country"><span class="material-symbols-outlined">close</span></button>`;
            return row;
        }
        function readGuests() {
            return [...document.querySelectorAll('#entryGuests .rg-guest-row')].map(r => ({
                code: r.querySelector('select').value,
                male: parseInt(r.querySelector('[data-sex="male"]').value, 10) || 0,
                female: parseInt(r.querySelector('[data-sex="female"]').value, 10) || 0
            }));
        }
        function updateTotal() {
            const n = readGuests().reduce((a, g) => a + g.male + g.female, 0);
            document.getElementById('entryTotal').textContent = `${n} ${isStay() ? 'guest' : 'visitor'}${n === 1 ? '' : 's'}`;
            const rows = document.querySelectorAll('#entryGuests .rg-guest-row');
            rows.forEach(r => { r.querySelector('[data-remove-row]').hidden = rows.length === 1; });
        }
        function setError(m) { const b = document.getElementById('entryError'); b.textContent = m || ''; b.hidden = !m; }

        function openEntry(entry) {
            editing = entry || null;
            const stay = isStay();
            const [year, month] = period();
            document.getElementById('entryTitle').textContent = `${entry ? 'Change' : 'Add'} a ${stay ? 'stay' : 'group'}`;
            document.getElementById('entryDateLabel').textContent = stay ? 'Check-in date' : 'Date';
            document.getElementById('entrySave').textContent = stay ? 'Save stay' : 'Save group';
            document.querySelectorAll('#entryForm [data-stay]').forEach(el => { el.hidden = !stay; });
            const date = document.getElementById('entryDate');
            date.max = manilaToday();
            const first = `${year}-${String(month).padStart(2, '0')}-01`;
            date.value = entry ? entry.date : (manilaToday().slice(0, 7) === first.slice(0, 7) ? manilaToday() : first);
            document.getElementById('entryNights').value = entry && entry.nights ? entry.nights : 1;
            document.getElementById('entryRooms').value = entry && entry.rooms ? entry.rooms : 1;
            const host = document.getElementById('entryGuests');
            host.innerHTML = '';
            (entry ? entry.guests : [{ code: 'ph-filipino', male: 0, female: 0 }]).forEach(g => host.appendChild(guestRow(g)));
            updateTotal();
            setError('');
            document.getElementById('entryModal').hidden = false;
            date.focus();
        }
        function closeEntry() { document.getElementById('entryModal').hidden = true; editing = null; }

        async function saveEntry(event) {
            event.preventDefault();
            const guests = readGuests().filter(g => g.male + g.female > 0);
            const codes = guests.map(g => g.code);
            if (new Set(codes).size !== codes.length) return setError('A country appears twice. Put its guests on one row.');
            if (!guests.length) return setError('Add at least one guest.');
            const body = { date: document.getElementById('entryDate').value, guests };
            if (isStay()) Object.assign(body, {
                nights: parseInt(document.getElementById('entryNights').value, 10),
                rooms: parseInt(document.getElementById('entryRooms').value, 10)
            });
            const btn = document.getElementById('entrySave');
            btn.disabled = true;
            try {
                const r = editing
                    ? await api(`/register/entries/${editing._id}`, 'PUT', body)
                    : await api(`/register/${place()._id}`, 'POST', body);
                closeEntry();
                showToast(r.message, 'success');
                // A stay entered for another month shows in that month.
                const [y, m] = body.date.split('-').map(Number);
                const key = `${y}-${m}`;
                const sel = document.getElementById('rgPeriod');
                if ([...sel.options].some(o => o.value === key)) sel.value = key;
                await load();
            } catch (e) {
                if (e.message !== 'Signed out') setError(e.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function removeEntry(entry) {
            const ok = await ztimsDialog.confirm({
                title: `Remove this ${isStay() ? 'stay' : 'group'}?`,
                message: `${entry.date} · ${entry.guests.reduce((n, g) => n + g.male + g.female, 0)} people. It is taken out of the register's totals.`,
                confirmLabel: 'Remove', cancelLabel: 'Keep it', tone: 'danger'
            });
            if (!ok) return;
            try {
                const r = await api(`/register/entries/${entry._id}`, 'DELETE');
                showToast(r.message, 'success');
                await load();
            } catch (e) {
                if (e.message !== 'Signed out') showToast(e.message, 'error');
            }
        }

        function wire() {
            document.getElementById('rgPlace').addEventListener('change', load);
            document.getElementById('rgPeriod').addEventListener('change', load);
            document.getElementById('rgAdd').addEventListener('click', () => openEntry(null));
            document.getElementById('rgList').addEventListener('click', event => {
                const row = event.target.closest('.rg-row');
                if (!row || !current) return;
                const entry = current.entries.find(e => e._id === row.dataset.id);
                if (!entry) return;
                if (event.target.closest('[data-edit]')) openEntry(entry);
                else if (event.target.closest('[data-remove]')) removeEntry(entry);
            });
            const modal = document.getElementById('entryModal');
            modal.addEventListener('click', event => {
                if (event.target === modal || event.target.closest('[data-close]')) return closeEntry();
                const step = event.target.closest('[data-step]');
                if (step) {
                    const input = step.parentElement.querySelector('input');
                    const min = Number(input.min) || 0, max = Number(input.max) || 10000;
                    input.value = Math.min(max, Math.max(min, (parseInt(input.value, 10) || 0) + Number(step.dataset.step)));
                    updateTotal();
                    return;
                }
                const x = event.target.closest('[data-remove-row]');
                if (x) { x.closest('.rg-guest-row').remove(); updateTotal(); }
            });
            modal.addEventListener('input', updateTotal);
            document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) closeEntry(); });
            document.getElementById('entryAddCountry').addEventListener('click', () => {
                const used = new Set(readGuests().map(g => g.code));
                const next = residenceList.find(r => !used.has(r.code));
                document.getElementById('entryGuests').appendChild(guestRow({ code: next ? next.code : 'unspecified', male: 0, female: 0 }));
                updateTotal();
            });
            document.getElementById('entryForm').addEventListener('submit', saveEntry);
        }

        async function start() {
            if (!window.ZTIMS_STATS) return setTimeout(start, 50);
            const list = document.getElementById('rgList');
            try {
                [myPlaces, residenceList] = await Promise.all([api('/places'), api('/residences')]);
            } catch (e) {
                if (e.message !== 'Signed out') list.innerHTML = `<div class="p-4"><div class="ztims-empty tone-danger">${escapeHtml(e.message)}</div></div>`;
                return;
            }
            if (!myPlaces.length) {
                list.innerHTML = '<div class="p-4"><div class="ztims-empty">Your establishment has no listing yet. Add it under Establishment first.</div></div>';
                return;
            }
            const placeSelect = document.getElementById('rgPlace');
            for (const p of myPlaces) placeSelect.add(new Option(p.title, p._id));
            document.getElementById('rgPlaceWrap').hidden = myPlaces.length < 2;
            if (myPlaces.length === 1) {
                const name = document.getElementById('rgPlaceName');
                name.hidden = false;
                name.querySelector('p').textContent = myPlaces[0].title;
            }
            const periodSelect = document.getElementById('rgPeriod');
            for (const p of window.ZTIMS_STATS.periodOptions()) periodSelect.add(new Option(p.label, `${p.year}-${p.month}`));
            wire();
            load();
        }

        document.addEventListener('DOMContentLoaded', () => {
            mountPortalAccountMenu();
            if (!guardEstablishmentManagerSession()) return;
            start();
        });
    </script>
<script>
/* Collapsed sidebar state, shared across every portal page via one key. */
(function () {
    var btn = document.getElementById('sidebarToggleBtn');
    var icon = document.getElementById('sidebarToggleIcon');
    if (!btn || !icon) return;

    function apply(collapsed) {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        icon.textContent = collapsed ? 'left_panel_open' : 'left_panel_close';
        var label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        btn.title = label;
        btn.setAttribute('aria-label', label);
    }

    btn.addEventListener('click', function () {
        var collapsed = !document.body.classList.contains('sidebar-collapsed');
        apply(collapsed);
        try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) { /* private browsing */ }
    });

    try { apply(localStorage.getItem('sidebarCollapsed') === '1'); }
    catch (e) { apply(false); }
})();
</script>

<script>
/* Signing out goes straight back to the public site: the session is cleared here
   and the person lands on the main page, instead of stopping at a page whose only
   purpose was to say they had left. */
(function () {
    var link = document.getElementById('logoutLink');
    if (!link) return;

    link.addEventListener('click', function (event) {
        event.preventDefault();
        try {
            window.ztimsTheme.clearStorage();
            sessionStorage.clear();
        } catch (e) { /* private browsing */ }

        if (typeof showToast === 'function') showToast('Signed out.', 'success', { duration: 2000 });
        // replace(), not href: the portal must not come back with the back button.
        setTimeout(function () { window.location.replace('../../index.html'); }, 600);
    });
})();
</script>

<script>
/* The drawer's open state. Only ever active below 640px, where the CSS above
   turns the rail into one; above that the button and scrim are hidden and this
   does nothing. */
(function () {
    var openBtn = document.getElementById('navOpenBtn');
    var scrim = document.getElementById('navScrim');
    var aside = document.querySelector('aside');
    if (!openBtn || !scrim || !aside) return;

    function setOpen(open) {
        document.body.classList.toggle('nav-open', open);
        openBtn.setAttribute('aria-expanded', String(open));
    }

    openBtn.addEventListener('click', function () {
        setOpen(!document.body.classList.contains('nav-open'));
    });
    scrim.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

    // Choosing a destination should take you there, not leave the drawer over it.
    aside.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
    });

    // Rotating to landscape or resizing past the breakpoint must not leave the
    // body locked by a drawer that is no longer on screen.
    window.addEventListener('resize', function () {
        if (window.innerWidth >= 640) setOpen(false);
    });
})();
</script>
<script type="module" src="../shared/ztims-dialog.js"></script>
</body>
