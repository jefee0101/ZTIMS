<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <script src="../shared/theme.js"></script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Signed Out - Zamboanguita</title>
    <link rel="icon" href="../../favicon.ico" sizes="32x32"/>
    <link rel="icon" type="image/png" href="../../favicon-192.png" sizes="192x192"/>
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    // Sharp edges: every rounded-* utility draws a square corner.
                    borderRadius: { none: "0", sm: "0", DEFAULT: "0", md: "0", lg: "0", xl: "0", "2xl": "0", "3xl": "0", full: "0" },
                    transitionTimingFunction: { DEFAULT: 'cubic-bezier(.2, 0, 0, 1)', standard: 'cubic-bezier(.2, 0, 0, 1)', decelerate: 'cubic-bezier(.05, .7, .1, 1)', accelerate: 'cubic-bezier(.3, 0, .8, .15)', spring: 'cubic-bezier(.34, 1.56, .64, 1)' },
                    transitionDuration: { DEFAULT: '220ms' },
                    colors: {
                        "primary": "rgb(var(--ztims-primary) / <alpha-value>)",
                        "on-primary": "rgb(var(--ztims-on-primary) / <alpha-value>)",
                        "background": "rgb(var(--ztims-background) / <alpha-value>)",
                        "surface": "rgb(var(--ztims-surface) / <alpha-value>)",
                        "on-surface": "rgb(var(--ztims-on-surface) / <alpha-value>)",
                        "on-surface-variant": "rgb(var(--ztims-on-surface-variant) / <alpha-value>)",
                        "outline-variant": "rgb(var(--ztims-outline) / <alpha-value>)",
                        "gold": "rgb(var(--ztims-gold) / <alpha-value>)",
                        "orange": "rgb(var(--ztims-orange) / <alpha-value>)",
                        "success": "rgb(var(--ztims-success) / <alpha-value>)"
                    },
                    fontFamily: {
                        headline: ["Poppins", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Manrope', sans-serif; background-color: rgb(var(--ztims-on-surface)); }
        .headline-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    
/* An uploaded photo with its own dimensions must not decide the page's width,
   and a long unbroken word — a URL in a review, an establishment name — must
   wrap rather than push the layout sideways. */
img, svg, video, canvas { max-width: 100%; height: auto; }
body { overflow-x: hidden; }

/* ==========================================================
   SCROLLBARS ON DESKTOP
   Hidden on pointer devices from 768px up, where the page still scrolls
   exactly as before — only the bar itself is gone. Touch screens are left
   alone: their scrollbars are already overlays that fade away, and hiding
   them there would remove the only hint that a list continues.
   ========================================================== */
@media (min-width: 768px) and (pointer: fine) {
    html, body, * {
        scrollbar-width: none;          /* Firefox */
        -ms-overflow-style: none;       /* old Edge */
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {              /* Chrome, Safari */
        width: 0;
        height: 0;
        display: none;
    }
}
</style>
    <!-- Zamboanguita Coastal Tourism palette. Linked after the page's own
         styles so the tokens win over anything left hardcoded. -->
    <link rel="stylesheet" href="../shared/theme.css"/>
    <!-- Motion tokens, page transitions, and the one reduced-motion block. -->
    <link rel="stylesheet" href="../shared/motion.css"/>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-x-hidden">


    <main class="page-enter relative flex-grow flex items-center justify-center p-6 md:p-12">
        <div class="relative z-10 w-full max-w-xl">
            <div class="bg-surface/50 backdrop-blur-2xl rounded-3xl border border-outline-variant/15 p-8 md:p-14 text-center shadow-2xl">
                <div class="mb-8">
                    <span class="text-3xl font-black text-primary tracking-tighter headline-font uppercase">Zamboanguita</span>
                    <div class="h-1 w-12 bg-primary mx-auto mt-2 rounded-full"></div>
                </div>
                <div class="mb-8">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary/20 text-primary mb-6">
                        <span class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    </div>
                    <h1 class="headline-font text-4xl md:text-5xl font-extrabold tracking-tight text-on-surface mb-4">Signed Out</h1>
                    <p class="text-on-surface-variant text-base md:text-lg font-medium leading-relaxed max-w-sm mx-auto">
                        You have been successfully logged out of your Tourist Establishment Manager account.
                    </p>
                </div>
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <a class="btn btn-primary group relative headline-font w-full sm:w-auto" href="../../index.html">
                        <span class="material-symbols-outlined mr-2 !text-xl">home</span>
                        Return to Home
                    </a>
                    <a class="inline-flex items-center justify-center px-6 py-3.5 text-primary headline-font font-bold transition-all duration-300 hover:underline underline-offset-8 w-full sm:w-auto group" href="../staff_login.html">
                        <span class="material-symbols-outlined mr-2 !text-xl group-hover:-translate-x-1 transition-transform">login</span>
                        Sign In Again
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        localStorage.clear();
        sessionStorage.clear();

        // Nothing links here any more — signing out now returns straight to the
        // public site. Kept for old bookmarks, which land on the main page too.
        window.location.replace('../../index.html');

        function preventBack() { window.history.forward(); }
        setTimeout(preventBack, 0);
        window.history.pushState(null, document.title, window.location.href);
        window.addEventListener('popstate', function () {
            window.history.pushState(null, document.title, window.location.href);
        });
    </script>
</body>
</html>
