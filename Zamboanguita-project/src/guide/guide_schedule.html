<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <script src="../shared/theme.js"></script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tourist Guide | Schedule &amp; Availability</title>
    <link rel="icon" href="../../favicon.ico" sizes="32x32"/>
    <link rel="icon" type="image/png" href="../../favicon-192.png" sizes="192x192"/>
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          // Sharp edges: every rounded-* utility draws a square corner.
          borderRadius: { none: "0", sm: "0", DEFAULT: "0", md: "0", lg: "0", xl: "0", "2xl": "0", "3xl": "0", full: "0" },
          transitionTimingFunction: { DEFAULT: 'cubic-bezier(.2, 0, 0, 1)', standard: 'cubic-bezier(.2, 0, 0, 1)', decelerate: 'cubic-bezier(.05, .7, .1, 1)', accelerate: 'cubic-bezier(.3, 0, .8, .15)', spring: 'cubic-bezier(.34, 1.56, .64, 1)' },
          transitionDuration: { DEFAULT: '220ms' },
          colors: {
              "primary": "rgb(var(--ztims-primary) / <alpha-value>)",
              "on-primary": "rgb(var(--ztims-on-primary) / <alpha-value>)",
              "surface": "rgb(var(--ztims-surface) / <alpha-value>)",
              "background": "rgb(var(--ztims-background) / <alpha-value>)",
              "surface-variant": "rgb(var(--ztims-surface-variant) / <alpha-value>)",
              "on-surface": "rgb(var(--ztims-on-surface) / <alpha-value>)",
              "on-surface-variant": "rgb(var(--ztims-on-surface-variant) / <alpha-value>)",
              "outline-variant": "rgb(var(--ztims-outline) / <alpha-value>)",
              "primary-container": "rgb(var(--ztims-primary-container) / <alpha-value>)",
              "secondary-container": "rgb(var(--ztims-secondary-container) / <alpha-value>)",
              "on-secondary-container": "rgb(var(--ztims-on-secondary-container) / <alpha-value>)",
              "gold": "rgb(var(--ztims-gold) / <alpha-value>)",
              "orange": "rgb(var(--ztims-orange) / <alpha-value>)",
              "success": "rgb(var(--ztims-success) / <alpha-value>)"
          },
          fontFamily: {
            headline: ["Poppins", "sans-serif"],
            body: ["Inter", "sans-serif"],
          }
        }
      }
    }
    </script>

    <link rel="stylesheet" href="../shared/theme.css"/>
    <link rel="stylesheet" href="../shared/motion.css"/>
    <link rel="stylesheet" href="../shared/portal-flat.css"/>
    <link rel="stylesheet" href="../shared/guide-portal.css"/>
</head>

<body class="bg-background text-on-surface font-body selection:bg-primary selection:text-on-primary min-h-screen transition-colors duration-300">

    <!-- The sidebar and header are drawn by ../shared/guide-portal.js. -->
    <main class="page-enter w-full sm:w-[calc(100%-16rem)] sm:ml-64 pt-20 sm:pt-24 px-4 sm:px-6 lg:px-10 pb-10 sm:pb-12 min-h-screen transition-colors duration-300">
        <div class="max-w-[1200px] mx-auto space-y-8">

            <div class="space-y-1">
                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black font-headline tracking-tighter text-on-surface">Schedule &amp; Availability</h2>
            </div>

            <div id="scheduleLoading"></div>

            <div id="scheduleContent" hidden class="grid grid-cols-1 lg:grid-cols-5 gap-8">

                <!-- My tours, built for a phone in the field: the next tour first,
                     large, with Call, Text and Directions; then the rest by day. -->
                <section class="glass-panel rounded-2xl p-4 sm:p-6 space-y-4 lg:col-span-3">
                    <h3 class="text-xl font-headline font-black text-on-surface flex items-center gap-2">
                        <span class="material-symbols-outlined text-accent">calendar_month</span> My tours
                    </h3>
                    <div role="tablist" aria-label="Which tours" class="tour-seg">
                        <button type="button" role="tab" id="tabUpcoming" aria-selected="true">Upcoming <span id="countUpcoming" class="tour-seg__n"></span></button>
                        <button type="button" role="tab" id="tabPast" aria-selected="false">Past <span id="countPast" class="tour-seg__n"></span></button>
                    </div>
                    <div id="tourList" class="space-y-5"></div>
                </section>

                <div class="space-y-8 lg:col-span-2">
                    <section class="glass-panel rounded-2xl p-5 sm:p-6 space-y-4">
                        <h3 class="text-xl font-headline font-black text-on-surface flex items-center gap-2">
                            <span class="material-symbols-outlined text-accent">event_available</span> Availability
                        </h3>

                        <form id="availabilityForm" class="space-y-5">
                            <fieldset class="space-y-2">
                                <legend class="text-label font-bold uppercase tracking-wider mb-2">Taking new bookings?</legend>
                                <label class="flex items-start gap-3 cursor-pointer p-3 border border-outline-variant/40 min-h-[44px]">
                                    <input type="radio" name="status" value="available" class="mt-1 text-primary focus:ring-primary"/>
                                    <span><span class="font-bold text-on-surface block">Available</span>
                                        <span class="text-support">The office can assign me tours on my working days.</span></span>
                                </label>
                                <label class="flex items-start gap-3 cursor-pointer p-3 border border-outline-variant/40 min-h-[44px]">
                                    <input type="radio" name="status" value="unavailable" class="mt-1 text-primary focus:ring-primary"/>
                                    <span><span class="font-bold text-on-surface block">Unavailable</span>
                                        <span class="text-support">Pause new bookings for now, for leave or a day you cannot guide. Tours already assigned stay assigned.</span></span>
                                </label>
                            </fieldset>

                            <fieldset>
                                <legend class="text-label font-bold uppercase tracking-wider mb-2">Working days</legend>
                                <div id="dayChoices" class="grid grid-cols-4 sm:grid-cols-7 lg:grid-cols-4 xl:grid-cols-7 gap-2"></div>
                            </fieldset>

                            <p id="availabilityMessage" hidden class="text-sm rounded-xl px-4 py-3"></p>
                            <button type="submit" id="saveAvailabilityBtn" class="btn btn-primary w-full min-h-[44px]">Save availability</button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script>
        let myBookings = [];

        const STATUS_TONE = {
            pending_payment: ['tone-warning', 'To confirm'],
            confirmed: ['tone-info', 'Confirmed'],
            completed: ['tone-success', 'Completed'],
            no_show: ['tone-danger', 'No-show'],
            cancelled: ['tone-neutral', 'Cancelled']
        };

        let showingPast = false;

        // Today and other days in the guide's own calendar (not UTC).
        const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        function dayName(date) {
            const P = window.GuidePortal;
            const now = new Date();
            const today = isoDay(now);
            const tomorrow = isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));
            if (date === today) return 'Today';
            if (date === tomorrow) return 'Tomorrow';
            return P.formatDate(date, { weekday: 'long', month: 'short', day: 'numeric' });
        }
        const isUpcoming = b => b.preferredDate >= isoDay(new Date()) && ['pending_payment', 'confirmed'].includes(b.status);

        // The three things a guide does from a tour: ring, text, find the way.
        function tourActions(b, big) {
            const P = window.GuidePortal;
            const phone = (b.contactNumber || '').replace(/[^\d+]/g, '');
            const size = big ? 'min-h-[48px]' : 'btn-sm min-h-[40px]';
            return `<div class="tour-actions">
                ${phone ? `<a href="tel:${P.escapeHtml(phone)}" class="btn btn-primary ${size}"><span class="material-symbols-outlined !text-base" aria-hidden="true">call</span> Call</a>
                <a href="sms:${P.escapeHtml(phone)}" class="btn btn-secondary ${size}"><span class="material-symbols-outlined !text-base" aria-hidden="true">sms</span> Text</a>` : ''}
                <a href="../spot.html?spotId=${encodeURIComponent(b.spot._id)}#directionsSection" class="btn btn-secondary ${size}"><span class="material-symbols-outlined !text-base" aria-hidden="true">directions</span> Directions</a>
            </div>`;
        }

        function tourCard(b, { next = false, past = false } = {}) {
            const P = window.GuidePortal;
            const [tone, label] = STATUS_TONE[b.status] || ['tone-neutral', b.status];
            const time = P.formatTime(b.preferredTime);
            return `
            <li class="tour-card${next ? ' tour-card--next' : ''}">
                ${next ? `<p class="tour-card__kicker">Next tour · ${P.escapeHtml(dayName(b.preferredDate))}</p>` : ''}
                <div class="tour-card__main">
                    <div class="tour-card__time">
                        <span class="tour-card__clock">${P.escapeHtml(time.replace(/ (AM|PM)$/, ''))}</span>
                        <span class="tour-card__ampm">${P.escapeHtml((time.match(/AM|PM/) || [''])[0])}</span>
                    </div>
                    <div class="min-w-0 flex-1">
                        <p class="tour-card__place">${P.escapeHtml(b.spot.title)}</p>
                        <p class="tour-card__who">
                            <span class="material-symbols-outlined !text-base" aria-hidden="true">group</span>
                            <b>${b.visitors}</b> visitor${b.visitors === 1 ? '' : 's'} · ${P.escapeHtml(b.fullName)}
                        </p>
                        <span class="tone-pill ${tone} inline-block mt-1.5">${label}</span>
                    </div>
                </div>
                ${b.notes ? `<p class="tour-card__note"><span class="material-symbols-outlined !text-base" aria-hidden="true">sticky_note_2</span><span>${P.escapeHtml(b.notes)}</span></p>` : ''}
                ${past ? '' : tourActions(b, next)}
                <p class="text-support">Reference ${P.escapeHtml(b.reference)}</p>
            </li>`;
        }

        function renderTours() {
            const P = window.GuidePortal;
            const upcoming = myBookings.filter(isUpcoming);
            const past = myBookings.filter(b => !isUpcoming(b))
                .sort((a, b) => (b.preferredDate + b.preferredTime).localeCompare(a.preferredDate + a.preferredTime));
            document.getElementById('countUpcoming').textContent = upcoming.length;
            document.getElementById('countPast').textContent = past.length;
            document.getElementById('tabUpcoming').setAttribute('aria-selected', String(!showingPast));
            document.getElementById('tabPast').setAttribute('aria-selected', String(showingPast));

            const box = document.getElementById('tourList');
            const list = showingPast ? past : upcoming;
            if (!list.length) {
                box.innerHTML = `<div class="ztims-empty">${showingPast
                    ? 'No past tours yet.'
                    : 'No upcoming tours. The office assigns them here as visitors book.'}</div>`;
                return;
            }

            // Upcoming: the next tour on its own, large; the rest by day.
            const [first, ...rest] = list;
            const head = showingPast ? '' : `<ul>${tourCard(first, { next: true })}</ul>`;
            const byDate = new Map();
            (showingPast ? list : rest).forEach(b => {
                if (!byDate.has(b.preferredDate)) byDate.set(b.preferredDate, []);
                byDate.get(b.preferredDate).push(b);
            });
            box.innerHTML = head + [...byDate.entries()].map(([date, tours]) => `
                <div>
                    <h4 class="tour-day">${P.escapeHtml(showingPast
                        ? P.formatDate(date, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
                        : dayName(date))}</h4>
                    <ul class="space-y-2">${tours.map(b => tourCard(b, { past: showingPast })).join('')}</ul>
                </div>`).join('');
        }

        function fillAvailability(guide) {
            const P = window.GuidePortal;
            document.querySelectorAll('input[name="status"]').forEach(radio => {
                radio.checked = radio.value === guide.status;
            });
            const working = new Set(guide.availableDays || []);
            document.getElementById('dayChoices').innerHTML = P.weekdays.map(day => `
                <label class="flex flex-col items-center gap-1 cursor-pointer border border-outline-variant/40 py-2 min-h-[44px] has-[:checked]:bg-primary/10 has-[:checked]:border-primary">
                    <input type="checkbox" name="day" value="${day.value}" ${working.has(day.value) ? 'checked' : ''}
                           class="w-5 h-5 rounded border-outline-variant/60 bg-surface text-primary focus:ring-primary focus:ring-offset-0"/>
                    <span class="text-xs font-bold text-on-surface" title="${day.label}">${day.short}</span>
                </label>`).join('');
        }

        async function saveAvailability(event) {
            event.preventDefault();
            const P = window.GuidePortal;
            P.showMessage('availabilityMessage', '');
            const status = (document.querySelector('input[name="status"]:checked') || {}).value;
            const availableDays = [...document.querySelectorAll('input[name="day"]:checked')].map(box => box.value);
            if (!availableDays.length) {
                P.showMessage('availabilityMessage', 'Choose at least one working day, or set yourself as unavailable instead.', 'error');
                return;
            }
            const restore = P.setButtonLoading(document.getElementById('saveAvailabilityBtn'), 'Saving...');
            try {
                const { result } = await P.api('/guides/me/availability', { method: 'PATCH', body: { status, availableDays } });
                fillAvailability(result.guide);
                P.showMessage('availabilityMessage', result.message);
            } catch (error) {
                P.showMessage('availabilityMessage', error.message, 'error');
            } finally {
                restore();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const P = window.GuidePortal;
            if (!P || !P.start()) return;

            document.getElementById('availabilityForm').addEventListener('submit', saveAvailability);
            document.getElementById('tabUpcoming').addEventListener('click', () => { showingPast = false; renderTours(); });
            document.getElementById('tabPast').addEventListener('click', () => { showingPast = true; renderTours(); });

            const loading = document.getElementById('scheduleLoading');
            const done = P.showLoading(loading, 'Loading your schedule...');
            try {
                const [{ result: me }, { result: data }] = await Promise.all([
                    P.api('/guides/me'),
                    P.api('/guides/me/bookings')
                ]);
                done();
                loading.innerHTML = '';
                P.rememberGuide(me.guide);
                myBookings = data.bookings || [];
                fillAvailability(me.guide);
                renderTours();
                document.getElementById('scheduleContent').hidden = false;
            } catch (error) {
                done();
                P.showLoadError(loading, 'your schedule', error);
            }
        });
    </script>
    <script type="module" src="../shared/guide-portal.js"></script>
</body>
</html>
