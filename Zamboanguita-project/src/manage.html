           which any Tailwind display class (.flex here) outranks. Without this,
           elements toggled via el.hidden stay on screen. */

        /* The identity gradient. It was gold into orange, which on the sand
           ground was both unreadable and the loudest thing on the page — the

           template. Ocean into teal carries the same emphasis and is legible
           in both themes. */
        .text-gradient {

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        /* Likewise: a primary button is ocean into coastal blue. Gold is for the
           occasional highlight, not for every call to action. */

/* An uploaded photo with its own dimensions must not decide the page's width,

/* ==========================================================

   Hidden on pointer devices from 768px up, where the page still scrolls

<script>
/* ==========================================================
   TOAST NOTIFICATIONS
   Replaces window.alert for anything the person doesn't have to answer —
   signing in and out, and every create, update or delete. A browser alert
   freezes the page and has to be dismissed before anything else can happen;
   a toast says the same thing at the top of the page and gets out of the way.

   showToast(message, tone, { duration })
     tone     : 'success' | 'error' | 'info'   (default 'info')
     duration : milliseconds, or 0 to stay until closed — used when the
                message contains something that has to be read and copied,
                like a newly issued password.
   ========================================================== */
(function () {
    var TONES = {
        success: { icon: 'check_circle', accent: 'rgb(var(--ztims-success))' },
        error:   { icon: 'error',        accent: 'rgb(var(--ztims-error))' },
        info:    { icon: 'info',         accent: 'rgb(var(--ztims-secondary))' }
    };

    function host() {
        var existing = document.getElementById('toastHost');
        if (existing) return existing;

        var el = document.createElement('div');
        el.id = 'toastHost';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        // Inline styles so a toast looks the same on every page, whichever
        // Tailwind palette that page happens to define.
        el.style.cssText = [
            // Centred at the top: the avatar and theme button live in the right
            // corner, and a notification that matters belongs where the eye
            // already is rather than tucked beside them.
            'position:fixed', 'top:1rem', 'left:50%', 'transform:translateX(-50%)',
            'z-index:2147483000',
            'display:flex', 'flex-direction:column', 'align-items:center', 'gap:.6rem',
            'width:min(26rem, calc(100vw - 2rem))',
            'pointer-events:none'
        ].join(';');
        document.body.appendChild(el);
        return el;
    }

    if (!document.getElementById('toastKeyframes')) {
        var style = document.createElement('style');
        style.id = 'toastKeyframes';
        style.textContent =
            '@keyframes toastIn{from{opacity:0;transform:translateY(-.9rem)}to{opacity:1;transform:none}}' +
            '@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-.9rem)}}' +
            '@media (prefers-reduced-motion: reduce){#toastHost > *{animation:none !important}}';
        document.head.appendChild(style);
    }

    window.showToast = function (message, tone, options) {
        var settings = TONES[tone] || TONES.info;
        var duration = options && typeof options.duration === 'number'
            ? options.duration
            : (tone === 'error' ? 6000 : 4000);

        var toast = document.createElement('div');
        toast.style.cssText = [
            'pointer-events:auto', 'width:100%', 'box-sizing:border-box',
            'display:flex', 'align-items:flex-start', 'gap:.65rem',
            'padding:.85rem 1rem',
            'border-radius:0',
            'background:rgb(var(--glass-fill) / var(--glass-alpha-overlay))',
            '-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate))',
            'color:rgb(var(--ztims-on-surface))',
            'border:1px solid var(--glass-hairline)',
            'border-left:4px solid ' + settings.accent,
            'box-shadow:inset 0 1px 0 var(--glass-edge), var(--ztims-shadow-overlay)',
            'font-family:inherit', 'font-size:.85rem', 'line-height:1.45',
            'animation:toastIn var(--dur-moderate, 300ms) var(--ease-decelerate, ease-out)'
        ].join(';');

        var icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.textContent = settings.icon;
        icon.style.cssText = 'color:' + settings.accent + ';font-size:1.25rem;flex-shrink:0;line-height:1.2';

        var text = document.createElement('div');
        // textContent, never innerHTML: these messages carry server text and
        // names people typed, which must never be able to become markup.
        text.textContent = message;
        text.style.cssText = 'flex:1;white-space:pre-line;word-break:break-word';

        var close = document.createElement('button');
        close.type = 'button';
        close.setAttribute('aria-label', 'Dismiss');
        close.textContent = '×';
        close.style.cssText = 'background:none;border:0;color:rgb(var(--ztims-on-surface-variant));font-size:1.1rem;line-height:1;cursor:pointer;padding:0 .15rem;flex-shrink:0';

        toast.appendChild(icon);
        toast.appendChild(text);
        toast.appendChild(close);
        host().appendChild(toast);

        var timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            toast.style.animation = 'toastOut 200ms var(--ease-accelerate, ease-in) forwards';
            setTimeout(function () { toast.remove(); }, 200);
        }
        close.addEventListener('click', dismiss);
        if (duration > 0) timer = setTimeout(dismiss, duration);

        return dismiss;
    };
})();
</script>

<script>
/* Move or cancel: one ticket or booking of the signed-in visitor's own
   account (?code=, from My account or an email). There is no public search:
   the server opens it only for the account that holds it. This page shows
   what the server says and asks before anything that cannot be undone. */
(function () {
    const API_BASE = "/api";
    const box = document.getElementById('itemBox');
    let current = null;          // { code } of what is on screen
    const token = (() => { try { return localStorage.getItem('ztimsVisitorToken') || ''; } catch (e) { return ''; } })();
    const signIn = () => location.replace('user/sign_in.html?next=' + encodeURIComponent(location.pathname + location.search));

    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const peso = n => '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const METHOD = { cash: 'Cash', gcash: 'GCash', maya: 'Maya', card: 'Card', grabpay: 'GrabPay', shopeepay: 'ShopeePay', qrph: 'QR Ph', bank: 'Bank transfer', otc: 'Over the counter' };
    const STATUS = {
        valid: ['tone-success', 'Valid'], used: ['tone-info', 'Used at the entrance'], cancelled: ['tone-neutral', 'Cancelled'],
        pending_payment: ['tone-warning', 'Waiting for payment'], expired: ['tone-neutral', 'Not paid'],
        closed: ['tone-warning', 'Date closed by the office']
    };
    function niceDate(value) {
        const [y, m, d] = String(value || '').slice(0, 10).split('-').map(Number);
        if (!y) return esc(value);
        return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-PH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }
    const row = (label, value) => `
        <div class="flex justify-between gap-4 py-2 border-b border-outline-variant/20 text-sm">
            <span class="text-on-surface-variant">${label}</span><span class="font-bold text-on-surface text-right">${value}</span>
        </div>`;

    // Why a date cannot be chosen, from what the server sent (the same rule it enforces).
    const WEEKDAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const WEEKDAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    function closedDayReason(dateKey, cal) {
        if (!cal || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return '';
        const day = new Date(dateKey + 'T00:00:00Z').getUTCDay();
        if (Array.isArray(cal.openDays) && !cal.openDays.includes(WEEKDAY_KEYS[day])) return `Closed on ${WEEKDAY_NAMES[day]}s. Open: ${cal.openDaysText}.`;
        const closed = (cal.closedDates || []).find(c => c.date === dateKey);
        return closed ? `Closed on that date${closed.reason ? ` (${closed.reason})` : ''}.` : '';
    }

    async function call(path, extra) {
        const response = await fetch(`${API_BASE}${path}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ ...current, ...(extra || {}) })
        });
        if (response.status === 401) { signIn(); throw new Error('Please sign in.'); }
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.success === false) throw new Error(data.message || 'That did not work. Please try again.');
        return data;
    }

    function render(item, notice) {
        if (item.kind === 'booking') return renderBooking(item, notice);
        const [tone, label] = STATUS[item.status] || ['tone-neutral', item.status];
        const details = [
            row('Ticket code', `<span class="font-mono">${esc(item.code)}</span>`),
            row('Attraction', esc(item.spot && item.spot.title)),
            row('Date', niceDate(item.visitDate)),
            row('People', `${esc(item.people)} · ${esc(item.kindsText)}`)
        ];
        if (item.paid) {
            details.push(row('Paid', `${peso(item.paid.amount)} · ${esc(METHOD[item.paid.method] || item.paid.method)}${item.paid.channel === 'online' ? ' · online' : ' · at the office'}`));
            if (item.paid.refundedAt) details.push(row('Refunded', peso(item.paid.refundAmount)));
        }

        const minDate = item.today;
        const moveForm = item.canMove ? `
            <form id="moveForm" class="space-y-3 border-t border-outline-variant/30 pt-4" novalidate>
                <h2 class="font-bold text-on-surface">Move to another date</h2>
                <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3 items-end">
                    <label class="block"><span class="bk-label">New date</span>
                        <input id="moveDate" type="date" required min="${esc(minDate)}" max="${esc(item.maxDate)}" class="bk-field"/></label>
                    <button type="submit" id="moveBtn" class="btn btn-pill btn-secondary min-h-[44px]">Move</button>
                </div>
                <p id="moveNote" class="text-support">The price and the ticket code stay the same.</p>
            </form>` : '';
        const closureForm = item.canRefundClosure ? `
            <div class="space-y-3 border-t border-outline-variant/30 pt-4">
                <h2 class="font-bold text-on-surface">Take a full refund</h2>
                <p class="text-sm text-on-surface-variant">You get all of it back: <b>${peso(item.refund)}</b>, to the way you paid.</p>
                <button type="button" id="closureRefundBtn" class="btn btn-pill btn-secondary min-h-[44px]">Refund me in full</button>
            </div>` : '';
        const cancelForm = item.canCancel ? `
            <div class="space-y-3 border-t border-outline-variant/30 pt-4">
                <h2 class="font-bold text-on-surface">Cancel</h2>
                <p class="text-sm text-on-surface-variant">${item.paid && !item.paid.refundedAt
                    ? `You get <b>${peso(item.refund)}</b> back${item.kept > 0 ? `; the office keeps ${esc(item.keepPercent)}% (${peso(item.kept)})` : ''}. This cannot be undone.`
                    : 'Nothing has been paid, so nothing is refunded. This cannot be undone.'}</p>
                <button type="button" id="cancelBtn" class="btn btn-pill btn-danger-solid min-h-[44px]">Cancel this ticket</button>
            </div>` : '';

        box.innerHTML = `
            ${notice ? `<p class="tone-success text-sm font-bold border border-outline-variant/30 p-3">${esc(notice)}</p>` : ''}
            <div class="flex flex-wrap items-start justify-between gap-3">
                <h2 class="text-2xl font-display font-extrabold tracking-tight text-on-surface">Your entrance ticket</h2>
                <span class="${tone} tone-pill rounded-pill text-xs font-bold px-3 py-1">${esc(label)}</span>
            </div>
            <div>${details.join('')}</div>
            ${item.closedByOffice || !(item.canMove || item.canCancel)
                ? `<p class="text-sm tone-warning">${esc(item.why || 'This can no longer be changed here.')}</p>`
                : `<p class="text-support">You can change this until 11:59 PM on ${niceDate(item.changeUntil)}.</p>`}
            ${moveForm}
            ${closureForm}
            ${cancelForm}
            <p id="actionError" hidden class="text-sm text-error bg-error/10 border border-error/20 px-4 py-3"></p>`;
        box.hidden = false;
        wireActions(item);
    }

    /* ---- a room booking (bookings.js' describeForVisitor) ------------ */
    const BOOKING = {
        requested: ['tone-warning', 'Waiting for the resort'], confirmed: ['tone-success', 'Confirmed'],
        checked_in: ['tone-info', 'Checked in'], completed: ['tone-neutral', 'Stay completed'],
        declined: ['tone-neutral', 'Declined'], expired: ['tone-neutral', 'Expired'],
        cancelled: ['tone-neutral', 'Cancelled'], no_show: ['tone-danger', 'No-show']
    };
    const wholePeso = n => { const v = Number(n) || 0; return '₱' + v.toLocaleString('en-PH', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
    const clock = hhmm => { if (!hhmm) return ''; const [h, m] = hhmm.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
    const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
    const addDay = (key, n) => { const d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const answerBy = iso => new Intl.DateTimeFormat('en-PH', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Manila' }).format(new Date(iso));

    function renderBooking(b, notice) {
        const [tone, label] = BOOKING[b.status] || ['tone-neutral', b.status];
        const place = b.enterpriseName || (b.spot && b.spot.title) || 'The resort';
        const details = [
            row('Booking code', `<span class="font-mono">${esc(b.code)}</span>`),
            row('Place to stay', b.spot ? `<a class="underline" href="spot.html?spotId=${encodeURIComponent(b.spot._id)}">${esc(place)}</a>` : esc(place)),
            row('Check-in', `${niceDate(b.checkIn)}${b.checkInTime ? `, from ${clock(b.checkInTime)}` : ''}`),
            row('Check-out', `${niceDate(b.checkOut)}${b.checkOutTime ? `, by ${clock(b.checkOutTime)}` : ''}`),
            row('Guests', `${plural(b.adults, 'adult')}${b.children ? `, ${plural(b.children, 'child', 'children')}` : ''}`),
            ...b.rooms.map(r => row(`${r.units} × ${esc(r.name)}`, `${wholePeso(r.ratePerNight)} a night`)),
            row(`Total · ${plural(b.nights, 'night')}`, wholePeso(b.totalAmount))
        ];
        const state = b.status === 'requested' && b.expiresAt
            ? `<p class="text-sm tone-warning border border-outline-variant/30 p-3">${esc(place)} answers by ${esc(answerBy(b.expiresAt))}. Nothing is booked until it confirms.</p>`
            : b.status === 'declined' && b.declineReason ? `<p class="text-sm tone-neutral border border-outline-variant/30 p-3">The resort's reason: ${esc(b.declineReason)}</p>` : '';
        // How to pay: only once the resort has accepted the stay.
        const pay = b.paymentInstructions ? `
            <div class="space-y-2 border-t border-outline-variant/30 pt-4">
                <h2 class="font-bold text-on-surface">How to pay ${esc(place)}</h2>
                <p class="text-sm text-on-surface whitespace-pre-line">${esc(b.paymentInstructions)}</p>
            </div>` : '';
        // Pay at the property, or online once the resort confirms (booking-payments.js).
        const p = b.payment || {};
        const live = b.status === 'requested' || b.status === 'confirmed';
        const switchBtn = p.canSwitchToProperty ? '<button type="button" data-pay-choice="property" class="btn btn-pill btn-secondary min-h-[44px]">Pay at the property instead</button>'
            : p.canSwitchToOnline ? '<button type="button" data-pay-choice="online" class="btn btn-pill btn-secondary min-h-[44px]">Pay online instead</button>' : '';
        const paidRows = (p.paidOnline || []).map(x => `
                <div>${row('Paid online', `<b>${wholePeso(x.amount)}</b>`)}${row('Paid with', esc(METHOD[x.method] || 'Online'))}${row('Paid on', niceDate(x.paidOn))}${row('Reference', `<span class="font-mono">${esc(x.reference)}</span>`)}</div>`).join('')
            + (p.refunded || []).map(x => row('Refunded', `${wholePeso(x.amount)}`)).join('');
        let payBox = '';
        if (p.hasOnlinePayment) {
            payBox = `
            <div class="space-y-2 border-t border-outline-variant/30 pt-4" id="payPanel">
                <div class="flex items-center gap-2"><span class="material-symbols-outlined tone-success rounded-full p-1" aria-hidden="true">check</span>
                    <h2 class="font-bold text-on-surface">Paid online</h2></div>
                ${paidRows}
                ${p.owed > 0 ? `<p class="text-sm">Still to pay: <b>${wholePeso(p.owed)}</b>.</p>` : '<p class="rb-pay__box">Nothing to pay at the property. Show your booking code at check-in.</p>'}
                ${p.canPayOnline ? `<button type="button" id="payNowBtn" class="btn btn-pill btn-primary min-h-[44px]">Pay ${wholePeso(p.owed)}</button>` : ''}
            </div>`;
        } else if (p.choice === 'online' && live) {
            payBox = `
            <div class="space-y-3 border-t border-outline-variant/30 pt-4" id="payPanel">
                <h2 class="font-bold text-on-surface">Payment</h2>
                ${b.status === 'requested'
                    ? `<p class="rb-pay__box rb-pay__box--due"><b>You pay ${wholePeso(p.owed)} online after ${esc(place)} confirms.</b> Nothing is charged if it declines.</p>`
                    : p.canPayOnline
                        ? `<p class="rb-pay__box rb-pay__box--due"><b>Pay ${wholePeso(p.owed)} online.</b> GCash, Maya, QR Ph, card or bank transfer, on the secure checkout page.</p>`
                        : `<p class="text-sm tone-warning">Online payment is not available just now. You can pay at the property.</p>`}
                <div class="flex flex-wrap gap-2">
                    ${switchBtn}
                    ${p.canPayOnline ? `<button type="button" id="payNowBtn" class="btn btn-pill btn-primary min-h-[44px]">Pay ${wholePeso(p.owed)}</button>` : ''}
                </div>
                ${p.canPayOnline ? '<p class="text-support flex gap-2"><span class="material-symbols-outlined !text-base" aria-hidden="true">lock</span>You pay on the payment service\'s secure page. ZTIMS never sees your card or wallet details.</p>' : ''}
            </div>`;
        } else if (live) {
            payBox = `
            <div class="space-y-3 border-t border-outline-variant/30 pt-4" id="payPanel">
                <h2 class="font-bold text-on-surface">Payment</h2>
                <p class="rb-pay__box"><b>You pay the resort when you arrive${p.owed ? `: ${wholePeso(p.owed)}` : ''}.</b>${b.status === 'requested' ? ' How to pay comes with its confirmation.' : ''}</p>
                ${switchBtn ? `<div class="flex flex-wrap gap-2">${switchBtn}</div>` : ''}
            </div>`;
        } else if ((p.refunded || []).length) {
            payBox = `<div class="border-t border-outline-variant/30 pt-4">${paidRows}</div>`;
        }
        const nightsLimit = b.minNights === b.maxNights ? plural(b.minNights, 'night') : `${b.minNights} to ${b.maxNights} nights`;
        const moveForm = b.canMove ? `
            <form id="bookingMoveForm" class="space-y-3 border-t border-outline-variant/30 pt-4" novalidate>
                <h2 class="font-bold text-on-surface">Ask for new dates</h2>
                <div class="bk-row bk-row--2">
                    <label class="block"><span class="bk-label">Check-in</span>
                        <input id="moveIn" type="date" required min="${esc(b.today)}" max="${esc(b.lastCheckIn)}" value="${esc(String(b.checkIn).slice(0, 10))}" class="bk-field"/></label>
                    <label class="block"><span class="bk-label">Check-out</span>
                        <input id="moveOut" type="date" required min="${esc(addDay(b.today, 1))}" value="${esc(String(b.checkOut).slice(0, 10))}" class="bk-field"/></label>
                </div>
                <p class="text-support">The same rooms, ${esc(nightsLimit)}. The resort confirms the new dates again.</p>
                <button type="submit" id="moveBtn" class="btn btn-pill btn-secondary min-h-[44px]">Send new dates</button>
            </form>` : '';
        const cancelForm = b.canCancel ? `
            <div class="space-y-3 border-t border-outline-variant/30 pt-4">
                <h2 class="font-bold text-on-surface">Cancel</h2>
                <p class="text-sm text-on-surface-variant">The resort is told and the rooms are freed.${p.hasOnlinePayment ? ` Your online payment of <b>${wholePeso(p.paidTotal)}</b> is returned in full.` : ''} This cannot be undone.</p>
                <button type="button" id="cancelBtn" class="btn btn-pill btn-danger-solid min-h-[44px]">Cancel this booking</button>
            </div>` : '';
        box.innerHTML = `
            ${notice ? `<p class="tone-success text-sm font-bold border border-outline-variant/30 p-3">${esc(notice)}</p>` : ''}
            <div class="flex flex-wrap items-start justify-between gap-3">
                <h2 class="text-2xl font-display font-extrabold tracking-tight text-on-surface">Your room booking</h2>
                <span class="${tone} tone-pill rounded-pill text-xs font-bold px-3 py-1">${esc(label)}</span>
            </div>
            ${state}
            <div>${details.join('')}</div>
            ${payBox}
            ${p.choice === 'online' ? '' : pay}
            ${b.moveWhy ? `<p class="text-sm tone-warning">${esc(b.moveWhy)}</p>` : ''}
            ${b.canMove || b.canCancel
                ? `<p class="text-support">You can change this until 11:59 PM on ${niceDate(b.changeUntil)}.</p>${b.why ? `<p class="text-sm tone-warning">${esc(b.why)}</p>` : ''}`
                : (b.why ? `<p class="text-sm tone-warning">${esc(b.why)}</p>` : '')}
            ${moveForm}
            ${cancelForm}
            <p id="actionError" hidden class="text-sm text-error bg-error/10 border border-error/20 px-4 py-3"></p>`;
        box.hidden = false;

        const move = document.getElementById('bookingMoveForm');
        if (move) {
            const a = document.getElementById('moveIn'), z = document.getElementById('moveOut');
            a.addEventListener('change', () => { z.min = addDay(a.value, 1); if (z.value <= a.value) z.value = addDay(a.value, b.nights); });
            move.addEventListener('submit', async event => {
                event.preventDefault();
                showError('actionError', '');
                if (!a.value || !z.value) return showError('actionError', 'Choose the check-in and check-out dates.');
                if (z.value <= a.value) return showError('actionError', 'Check-out must be after check-in.');
                const button = document.getElementById('moveBtn');
                button.disabled = true;
                try {
                    const result = await call('/manage/move', { checkIn: a.value, checkOut: z.value });
                    render(result.item, result.message + (result.emailed ? ' We have emailed you.' : ''));
                } catch (error) {
                    showError('actionError', error.message);
                    button.disabled = false;
                }
            });
        }
        const payNow = document.getElementById('payNowBtn');
        if (payNow) payNow.addEventListener('click', async () => {
            payNow.disabled = true;
            showError('actionError', '');
            try {
                const result = await call('/bookings/pay');
                location.assign(result.payUrl);
            } catch (error) { showError('actionError', error.message); payNow.disabled = false; }
        });
        box.querySelectorAll('[data-pay-choice]').forEach(btn => btn.addEventListener('click', async () => {
            btn.disabled = true;
            showError('actionError', '');
            try {
                const result = await call('/bookings/payment-choice', { choice: btn.dataset.payChoice });
                render(result.item, result.message);
            } catch (error) { showError('actionError', error.message); btn.disabled = false; }
        }));
        wireActions({});
    }

    function showError(id, message) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = message || '';
        el.hidden = !message;
    }

    function wireActions(item) {
        const move = document.getElementById('moveForm');
        if (move) {
            const dateInput = document.getElementById('moveDate');
            const button = document.getElementById('moveBtn');
            dateInput.addEventListener('change', () => {
                const reason = closedDayReason(dateInput.value, item.calendar);
                showError('actionError', reason);
                button.disabled = Boolean(reason);
            });
            move.addEventListener('submit', async event => {
                event.preventDefault();
                showError('actionError', '');
                if (!dateInput.value) return showError('actionError', 'Choose the new date.');
                button.disabled = true;
                try {
                    const result = await call('/manage/move', { date: dateInput.value });
                    render(result.item, result.message + (result.emailed ? ' We have emailed you.' : ''));
                } catch (error) {
                    showError('actionError', error.message);
                    button.disabled = false;
                }
            });
        }
        const full = document.getElementById('closureRefundBtn');
        if (full) {
            full.addEventListener('click', async () => {
                if (!full.dataset.sure) { full.dataset.sure = '1'; full.textContent = 'Yes, refund me'; return; }
                full.disabled = true;
                showError('actionError', '');
                try {
                    const result = await call('/manage/refund-closure');
                    render(result.item, result.message + (result.emailed ? ' We have emailed you.' : ''));
                } catch (error) {
                    showError('actionError', error.message);
                    full.disabled = false;
                }
            });
        }
        const cancel = document.getElementById('cancelBtn');
        if (cancel) {
            // Asked twice: the second press is the decision.
            cancel.addEventListener('click', async () => {
                if (!cancel.dataset.sure) {
                    cancel.dataset.sure = '1';
                    cancel.textContent = 'Yes, cancel it';
                    return;
                }
                cancel.disabled = true;
                showError('actionError', '');
                try {
                    const result = await call('/manage/cancel');
                    render(result.item, result.message + (result.emailed ? ' We have emailed you.' : ''));
                } catch (error) {
                    showError('actionError', error.message);
                    cancel.disabled = false;
                }
            });
        }
    }

    // Signed in, with a code: open it. Without a code, the list is My account.
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    // Back from the payment page: ?paid=<checkout> (and &cancelled=1 when they left it).
    const backFromPay = params.has('paid'), payLeft = params.get('cancelled') === '1';
    if (!token) { signIn(); return; }
    if (!code) { location.replace('user/account.html#tickets'); return; }
    current = { code };
    call('/manage/lookup')
        .then(result => {
            const paidNow = backFromPay && result.item.payment && result.item.payment.hasOnlinePayment;
            render(result.item, paidNow ? 'Payment received. Thank you.' : '');
            if (backFromPay && !paidNow) showError('actionError', payLeft ? 'The payment was not completed. You can try again.' : 'We have not received the payment yet. If you paid, refresh in a minute.');
            if (backFromPay) history.replaceState(null, '', location.pathname + '?code=' + encodeURIComponent(code));
        })
        .catch(error => showError('findError', error.message));
})();
</script>
</body>
</html>
