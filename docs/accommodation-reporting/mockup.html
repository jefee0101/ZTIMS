<title>ZTIMS Accommodation Reporting Mockup</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: ZTIMS staff portal — fixed sidebar, glass header, flat outlined panels, pill buttons, folder-line tabs.
   Tokens are ZTIMS's own (theme.css): burnt orange primary, tangerine highlight, ember pressed, ink and paper neutrals. */
:root {
  --bg: 250 247 242; --surface: 253 251 247; --surface-low: 245 241 234; --surface-var: 239 234 226;
  --ink: 28 25 23; --ink2: 87 81 74; --line: 227 220 209;
  --primary: 191 87 0; --primary-text: 163 74 0; --ember: 122 46 0; --tangerine: 242 133 0; --gold-text: 150 66 0;
  --on-primary: 250 247 242; --primary-soft: 252 237 222;
  --red: 179 38 30; --green: 46 125 50; --red-soft: 252 231 229; --green-soft: 228 242 229; --tan-soft: 253 238 214;
  --proto: 28 25 23; --on-proto: 245 241 234;
  --font-display: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: 18 17 16; --surface: 28 26 24; --surface-low: 22 20 19; --surface-var: 42 39 36;
  --ink: 245 241 234; --ink2: 181 173 163; --line: 58 53 50;
  --primary-text: 242 133 0; --gold-text: 255 166 77; --primary-soft: 51 26 8;
  --red: 242 139 130; --green: 123 198 126; --red-soft: 58 28 26; --green-soft: 27 44 29; --tan-soft: 58 38 14;
  --proto: 10 9 8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: 18 17 16; --surface: 28 26 24; --surface-low: 22 20 19; --surface-var: 42 39 36;
  --ink: 245 241 234; --ink2: 181 173 163; --line: 58 53 50;
  --primary-text: 242 133 0; --gold-text: 255 166 77; --primary-soft: 51 26 8;
  --red: 242 139 130; --green: 123 198 126; --red-soft: 58 28 26; --green-soft: 27 44 29; --tan-soft: 58 38 14;
  --proto: 10 9 8; color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: rgb(var(--primary-text)); }
.ms { font-family: 'Material Symbols Outlined'; font-weight: 400; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; width: 1em; overflow: hidden; white-space: nowrap; letter-spacing: normal; text-transform: none; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga'; vertical-align: middle; flex: none; }
.ms { visibility: hidden; } html.ms-ok .ms { visibility: visible; }
.ms.sm { font-size: 16px; } .ms.fill { font-variation-settings: 'FILL' 1; }
:focus-visible { outline: 2px solid rgb(var(--tangerine)); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Prototype strip (not part of ZTIMS) ---- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: rgb(var(--proto)); color: rgb(var(--on-proto)); display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .5rem max(16px, env(safe-area-inset-right, 0px)) .5rem max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 70; background: rgb(var(--proto)); }
.proto b { font-family: var(--font-display); font-weight: 600; letter-spacing: .02em; margin-right: .25rem; }
.proto .grp { display: inline-flex; align-items: center; gap: .35rem; }
.proto .seg { display: inline-flex; border: 1px solid rgb(var(--on-proto) / .35); border-radius: 999px; overflow: hidden; }
.proto .seg button { background: none; border: 0; padding: .3rem .75rem; cursor: pointer; font-weight: 600; font-size: 12px; color: rgb(var(--on-proto)); }
.proto .seg button[aria-pressed="true"] { background: rgb(var(--tangerine)); color: #1C1917; }
.proto .pbtn { background: none; border: 1px solid rgb(var(--on-proto) / .35); color: rgb(var(--on-proto)); border-radius: 999px; padding: .3rem .75rem; cursor: pointer; font-weight: 600; font-size: 12px; display: inline-flex; gap: .3rem; align-items: center; }
.proto .pbtn:hover { background: rgb(var(--on-proto) / .12); }
.proto select { background: rgb(var(--on-proto) / .1); color: rgb(var(--on-proto)); border: 1px solid rgb(var(--on-proto) / .35); border-radius: 999px; padding: .28rem .6rem; font-size: 12px; }
.proto select option { color: #1C1917; }
.proto .sp { flex: 1 1 0; }
.proto label { display: inline-flex; gap: .3rem; align-items: center; cursor: pointer; }

/* ---- Portal shell ---- */
.portal { display: grid; grid-template-columns: 16rem minmax(0, 1fr); min-height: calc(100vh - 3rem); }
.side { background: rgb(var(--surface)); border-right: 1px solid rgb(var(--line)); padding: 1rem 1rem 1.5rem max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 1.25rem; position: sticky; top: calc(3rem + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 3rem); overflow: auto; }
.brand { display: flex; gap: .65rem; align-items: center; }
.seal { width: 2.5rem; height: 2.5rem; border-radius: 50%; background: rgb(var(--primary)); color: rgb(var(--on-primary)); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: .8rem; letter-spacing: .02em; }
.brand strong { display: block; font-family: var(--font-display); font-size: .8rem; line-height: 1.15; letter-spacing: .02em; }
.brand span { font-size: .7rem; color: rgb(var(--ink2)); }
.menu { display: flex; flex-direction: column; gap: .25rem; }
.menu a { display: flex; gap: .65rem; align-items: center; padding: .6rem .9rem; border-radius: 999px; font-weight: 600; font-size: .875rem; color: rgb(var(--ink2)); text-decoration: none; min-height: 44px; }
.menu a:hover { background: rgb(var(--surface-var)); color: rgb(var(--ink)); }
.menu a.is-current { background: rgb(var(--primary)); color: rgb(var(--on-primary)); }
.side .foot { margin-top: auto; font-size: .75rem; color: rgb(var(--ink2)); border-top: 1px solid rgb(var(--line)); padding-top: .75rem; }
.head { position: sticky; top: calc(3rem + env(safe-area-inset-top, 0px)); z-index: 30; background: rgb(var(--surface) / .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgb(var(--line)); padding: .6rem max(16px, env(safe-area-inset-right, 0px)) 0 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; min-height: 3.5rem; }
.head .ttl { font-family: var(--font-display); font-weight: 600; font-size: .95rem; margin-right: auto; padding-bottom: .5rem; }
.head .who { display: flex; align-items: center; gap: .6rem; padding-bottom: .5rem; }
.avatar { width: 2.1rem; height: 2.1rem; border-radius: 50%; background: rgb(var(--tangerine)); color: #1C1917; display: grid; place-items: center; font-weight: 700; font-size: .75rem; }
.who small { color: rgb(var(--ink2)); font-size: .75rem; }
.ent-switch { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); border-radius: 999px; padding: 0 .4rem 0 .85rem; min-height: 40px; margin-bottom: .5rem; }
.ent-switch select { appearance: none; background: none; border: 0; font-weight: 700; font-size: .85rem; padding: .5rem 1.4rem .5rem 0; cursor: pointer; max-width: 15rem; }
.ent-switch .ms { margin-left: -1.4rem; pointer-events: none; }
main { padding: 1.5rem max(16px, env(safe-area-inset-right, 0px)) 4rem 1.5rem; min-width: 0; display: flex; flex-direction: column; gap: 1.25rem; }
.pg-title { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem 1rem; }
.pg-title h1 { font-size: 1.6rem; line-height: 1.2; font-weight: 700; margin-right: auto; }
.pg-title .acts { display: flex; flex-wrap: wrap; gap: .5rem; }
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid rgb(var(--line)); overflow-x: auto; margin: 0 -.25rem; padding: 0 .25rem; }
.tab { display: inline-flex; align-items: center; gap: .45rem; min-height: 44px; padding: .6rem 1rem; font-weight: 700; font-size: .875rem; color: rgb(var(--ink2)); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: rgb(var(--ink)); }
.tab[aria-selected="true"] { color: rgb(var(--primary-text)); border-bottom-color: rgb(var(--primary)); }

/* ---- Buttons, pills, fields ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: 0 1.2rem; border-radius: 999px; border: 1px solid transparent; font-weight: 700; font-size: .875rem; cursor: pointer; text-decoration: none; background: rgb(var(--surface)); }
.btn.primary { background: rgb(var(--primary)); color: rgb(var(--on-primary)); } .btn.primary:hover { background: rgb(var(--ember)); }
.btn.outline { border-color: rgb(var(--primary)); color: rgb(var(--primary-text)); } .btn.outline:hover { background: rgb(var(--primary) / .08); }
.btn.plain { border-color: rgb(var(--line)); } .btn.plain:hover { background: rgb(var(--surface-var)); }
.btn.danger { background: #B3261E; color: #FFF8F6; } .btn.danger:hover { background: #8C1D18; }
.btn.cancel { border-color: #B3261E; color: rgb(var(--red)); } .btn.cancel:hover { background: rgb(var(--red) / .1); }
.btn.sm { min-height: 36px; padding: 0 .9rem; font-size: .8rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.rt { display: none; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; background: rgb(var(--ink) / .12); color: inherit; }
body.show-roles .rt { display: inline-block; }
.btn.primary .rt { background: rgb(var(--on-primary) / .25); }
.pill { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .15rem .65rem; font-size: .75rem; font-weight: 700; line-height: 1.5; border: 1px solid transparent; white-space: nowrap; }
.t-ok { background: rgb(var(--green-soft)); color: rgb(var(--green)); } .t-bad { background: rgb(var(--red-soft)); color: rgb(var(--red)); }
.t-wait { background: rgb(var(--tan-soft)); color: rgb(var(--gold-text)); } .t-info { background: rgb(var(--primary-soft)); color: rgb(var(--primary-text)); }
.t-mute { background: rgb(var(--surface-var)); color: rgb(var(--ink2)); } .t-ink { border-color: rgb(var(--ink)); color: rgb(var(--ink)); }
.t-lock { background: rgb(var(--ink)); color: rgb(var(--bg)); }
.fld { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.fld > span, .lbl { font-size: .8rem; font-weight: 700; color: rgb(var(--ink2)); }
.inp { min-height: 44px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); border-radius: 0; padding: .5rem .75rem; width: 100%; min-width: 0; }
.inp:focus { outline: 2px solid rgb(var(--tangerine)); outline-offset: 0; border-color: rgb(var(--primary)); }
select.inp { appearance: auto; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .85rem; }
.stepper { display: inline-flex; align-items: center; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); }
.stepper button { width: 40px; min-height: 44px; border: 0; background: none; cursor: pointer; font-size: 1.1rem; font-weight: 700; }
.stepper button:hover { background: rgb(var(--surface-var)); }
.stepper output { min-width: 2rem; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---- Panels, tiles, tables ---- */
.panel { border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: 1.1rem 1.25rem; min-width: 0; }
.panel > h2, .panel > .ph h2 { font-size: 1rem; font-weight: 600; }
.ph { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; margin-bottom: .85rem; }
.ph .sub { color: rgb(var(--ink2)); font-size: .8rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; }
.tile { border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: .85rem 1rem; display: flex; flex-direction: column; gap: .15rem; }
.tile .k { font-size: .75rem; font-weight: 700; color: rgb(var(--ink2)); }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .n { font-size: .72rem; color: rgb(var(--ink2)); }
.scroll { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: .75rem; font-weight: 700; color: rgb(var(--ink2)); padding: .55rem .6rem; border-bottom: 2px solid rgb(var(--line)); background: rgb(var(--surface-low)); white-space: nowrap; }
table.t td { padding: .5rem .6rem; border-bottom: 1px solid rgb(var(--line)); vertical-align: middle; }
table.t td.n, table.t th.n { text-align: right; }
table.t tr.grp td { background: rgb(var(--surface-low)); font-weight: 700; font-size: .78rem; color: rgb(var(--ink2)); }
table.t tr.sum td { font-weight: 700; background: rgb(var(--surface-low)); }
table.t tr.grand td { font-weight: 700; background: rgb(var(--primary-soft)); border-top: 2px solid rgb(var(--primary)); }
table.t td.dim, table.t .dim { color: rgb(var(--ink2)); }
table.t td.stk, table.t th.stk { position: sticky; left: 0; background: rgb(var(--surface)); z-index: 1; }
table.t th.stk { background: rgb(var(--surface-low)); }
.banner { display: flex; gap: .75rem; align-items: flex-start; padding: .8rem 1rem; border: 1px solid rgb(var(--line)); border-left-width: 4px; background: rgb(var(--surface)); }
.banner.ok { border-left-color: rgb(var(--green)); } .banner.bad { border-left-color: rgb(var(--red)); } .banner.wait { border-left-color: rgb(var(--tangerine)); } .banner.lock { border-left-color: rgb(var(--ink)); } .banner.info { border-left-color: rgb(var(--primary)); }
.banner .ms { margin-top: 1px; } .banner .bd { min-width: 0; flex: 1; } .banner .bd p { margin: .15rem 0 0; color: rgb(var(--ink2)); }
.banner .bd ul { margin: .4rem 0 0; padding-left: 1.1rem; }
.banner .bx { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }
.banner .pill { white-space: normal; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); border-radius: 999px; padding: .3rem .85rem; font-weight: 600; font-size: .8rem; cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; gap: .35rem; }
.chip[aria-pressed="true"] { background: rgb(var(--primary)); color: rgb(var(--on-primary)); border-color: rgb(var(--primary)); }
.mpick { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.mpick .cur { font-family: var(--font-display); font-weight: 600; min-width: 9.5rem; text-align: center; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn:hover { background: rgb(var(--surface-var)); }
.empty { border: 1px dashed rgb(var(--line)); padding: 2rem 1rem; text-align: center; color: rgb(var(--ink2)); }
.empty h3 { color: rgb(var(--ink)); font-size: 1rem; margin-bottom: .35rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0; border: 1px solid rgb(var(--line)); }
.fact { padding: .75rem 1rem; border-right: 1px solid rgb(var(--line)); border-bottom: 1px solid rgb(var(--line)); margin: 0 -1px -1px 0; min-width: 0; }
.fact .k { font-size: .75rem; font-weight: 700; color: rgb(var(--ink2)); } .fact .v { font-weight: 600; overflow-wrap: anywhere; } .fact .v.miss { color: rgb(var(--red)); }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.mut { color: rgb(var(--ink2)); } .sm { font-size: .8rem; } .num { font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.rg-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: .75rem 1rem; align-items: center; padding: .85rem 1rem; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); }
.rg-row + .rg-row { margin-top: -1px; }
.rg-row .ref { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: .04em; }
.rg-row .c { min-width: 0; } .rg-row .c small { display: block; color: rgb(var(--ink2)); }
.rg-row.carry { background: rgb(var(--surface-low)); }

/* ---- Availability grid ---- */
.av { border-collapse: separate; border-spacing: 0; font-size: .72rem; }
.av th, .av td { width: 30px; min-width: 30px; height: 34px; text-align: center; border-right: 1px solid rgb(var(--line)); border-bottom: 1px solid rgb(var(--line)); padding: 0; }
.av th { background: rgb(var(--surface-low)); font-weight: 700; color: rgb(var(--ink2)); height: 40px; line-height: 1.1; }
.av th.today { background: rgb(var(--tangerine)); color: #1C1917; }
.av .rn { position: sticky; left: 0; z-index: 2; background: rgb(var(--surface)); width: 5.5rem; min-width: 5.5rem; text-align: left; padding: 0 .5rem; font-weight: 700; }
.av th.rn { background: rgb(var(--surface-low)); }
.av .occ { background: rgb(var(--primary)); color: rgb(var(--on-primary)); cursor: pointer; font-weight: 700; font-size: .62rem; }
.av .occ:hover { background: rgb(var(--ember)); }
.av .oos { background: repeating-linear-gradient(45deg, rgb(var(--surface-var)), rgb(var(--surface-var)) 4px, rgb(var(--line)) 4px, rgb(var(--line)) 8px); }
.av .cls { background: rgb(var(--surface-var)); }
.av .fut { color: rgb(var(--ink2) / .5); }
.lg { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .78rem; color: rgb(var(--ink2)); }
.lg i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: .35rem; border: 1px solid rgb(var(--line)); }
.sw-occ { background: rgb(var(--primary)); } .sw-oos { background: repeating-linear-gradient(45deg, rgb(var(--surface-var)), rgb(var(--surface-var)) 3px, rgb(var(--line)) 3px, rgb(var(--line)) 6px); } .sw-cls { background: rgb(var(--surface-var)); } .sw-free { background: rgb(var(--surface)); }
/* ---- DAE-1A grid ---- */
.dae td.mk { text-align: center; padding: .3rem .25rem; } .dae td.mk .d { display: inline-block; width: 12px; height: 12px; background: rgb(var(--primary)); } .dae td.mk .o { display: inline-block; width: 12px; height: 12px; background: repeating-linear-gradient(45deg, rgb(var(--surface-var)), rgb(var(--surface-var)) 2px, rgb(var(--line)) 2px, rgb(var(--line)) 4px); }
.dae tr.fut td { color: rgb(var(--ink2) / .55); }
.dae td.hl { background: rgb(var(--tan-soft)); font-weight: 700; }
.dae td.today, .dae td.today.stk { box-shadow: inset 3px 0 0 rgb(var(--tangerine)); }
/* ---- Tracker matrix ---- */
.mx td, .mx th { text-align: center; padding: .35rem .25rem; }
.mx td.en { text-align: left; min-width: 13rem; padding: .6rem .75rem; }
.cell { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 4.2rem; min-height: 2.6rem; padding: .2rem .35rem; border: 1px solid transparent; font-size: .68rem; font-weight: 700; line-height: 1.2; cursor: pointer; background: none; border-radius: 0; }
.cell:hover { outline: 2px solid rgb(var(--primary)); }
.cell small { font-weight: 500; font-size: .62rem; opacity: .85; }
.own { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .1rem .6rem; font-size: .7rem; font-weight: 700; border: 1px solid rgb(var(--ink)); }
/* ---- Dialog ---- */
.ovl { position: fixed; inset: 0; z-index: 90; background: rgb(0 0 0 / .5); display: grid; place-items: center; padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px)); overflow: auto; }
.dlg { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); width: min(46rem, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgb(0 0 0 / .35); }
.dlg.narrow { width: min(30rem, 100%); } .dlg.wide { width: min(64rem, 100%); }
.dlg .dh { padding: 1rem 1.25rem; border-bottom: 1px solid rgb(var(--line)); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.dlg .dh h2 { font-size: 1.05rem; font-weight: 600; }
.dlg .db { padding: 1.1rem 1.25rem; overflow: auto; display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.dlg .df { padding: .85rem 1.25rem; border-top: 1px solid rgb(var(--line)); display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; background: rgb(var(--surface)); }
.err { border: 1px solid rgb(var(--red)); background: rgb(var(--red-soft)); color: rgb(var(--red)); padding: .65rem .85rem; font-size: .85rem; }
.err ul { margin: .25rem 0 0; padding-left: 1.1rem; }

<script>
/* ---------- Engine: pure functions, no DOM ---------- */
const pad = n => String(n).padStart(2, '0');
const dnum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const dstr = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addDays = (s, n) => dstr(dnum(s) + n);
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const ymOf = s => s.slice(0, 7);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const COUNTRIES = { KR:'Korea', JP:'Japan', CN:'China', US:'USA', CA:'Canada', DE:'Germany', FR:'France', GB:'United Kingdom', AU:'Australia', other:'Other countries' };
const KINDS = { phf:'Philippine resident, Filipino nationality', phx:'Philippine resident, foreign nationality', foreign:'Non-Philippine resident (by country of residence)', ofil:'Overseas Filipino (lives abroad)', unspec:'Residence not stated' };
const rowKey = g => g.kind === 'foreign' ? 'foreign:' + g.country : g.kind;
const rowLabel = k => k === 'phf' ? 'Filipino nationality' : k === 'phx' ? 'Foreign nationality' : k === 'ofil' ? 'Overseas Filipinos*' : k === 'unspec' ? 'Guests with unspecified residence' : COUNTRIES[k.split(':')[1]];
const gTotal = g => (g.m | 0) + (g.f | 0);
const stayGuests = s => s.groups.reduce((a, g) => a + gTotal(g), 0);
const stayNights = s => dnum(s.out) - dnum(s.in);
const stayDates = s => { const a = []; for (let d = s.in; d < s.out; d = addDays(d, 1)) a.push(d); return a; };
const monthOfDate = d => ymOf(d);
const monthsTouched = s => { const set = new Set([ymOf(s.in)]); stayDates(s).forEach(d => set.add(ymOf(d))); return [...set]; };
const roomActive = (r, d) => (!r.from || r.from <= d) && (!r.until || d < r.until);
const inClosed = (E, d) => E.closed.find(c => c.from <= d && d <= c.to);
const oosOn = (E, d) => E.oos.filter(o => o.from <= d && d <= o.to);

/* One calendar day of the DAE-1A: guests checked in, guests staying overnight, rooms occupied, rooms available. */
function dayFigures(E, d) {
  let checkin = 0, nights = 0; const occ = new Set();
  for (const s of E.stays) {
    if (s.in === d) checkin += stayGuests(s);
    if (s.in <= d && d < s.out) { nights += stayGuests(s); s.segs.forEach(g => { if (g.from <= d && d < g.to) occ.add(g.room); }); }
  }
  const closed = !!inClosed(E, d);
  const act = E.rooms.filter(r => roomActive(r, d));
  const oosRooms = new Set(oosOn(E, d).map(o => o.room).filter(n => act.some(r => r.no === n)));
  const physical = act.length;
  const available = closed ? 0 : Math.max(0, physical - oosRooms.size);
  return { date: d, checkin, nights, occupied: occ.size, occRooms: occ, available, closed, oosRooms };
}

/* A month's figures. Nights are counted for dates up to the day before `today`; arrivals up to `today`. */
function monthFigures(E, key, today) {
  const [y, m] = key.split('-').map(Number); const days = dim(y, m);
  const first = key + '-01', last = key + '-' + pad(days);
  const lastNight = addDays(today, -1);
  const throughNight = last < lastNight ? last : lastNight;
  const arrivals = {}; let am = 0, af = 0;
  const byDay = {};            // rowKey -> [1..days] arrivals
  const daily = [];
  let guestNights = 0, roomNights = 0, available = 0, closedDays = 0;
  for (let i = 1; i <= days; i++) {
    const d = key + '-' + pad(i);
    const counted = d <= throughNight;
    const f = dayFigures(E, d);
    f.counted = counted;
    daily.push(f);
    if (counted) { guestNights += f.nights; roomNights += f.occupied; available += f.available; if (f.closed) closedDays++; }
  }
  for (const s of E.stays) {
    if (ymOf(s.in) !== key || s.in > today) continue;
    for (const g of s.groups) {
      const k = rowKey(g); const a = arrivals[k] || (arrivals[k] = { m: 0, f: 0 });
      a.m += g.m | 0; a.f += g.f | 0; am += g.m | 0; af += g.f | 0;
      const arr = byDay[k] || (byDay[k] = Array(days).fill(0)); arr[+s.in.slice(8) - 1] += gTotal(g);
    }
  }
  const sum = (ks) => ks.reduce((a, k) => { const r = arrivals[k]; return r ? { m: a.m + r.m, f: a.f + r.f } : a; }, { m: 0, f: 0 });
  const keys = Object.keys(arrivals);
  const vol = {
    ph: sum(keys.filter(k => k === 'phf' || k === 'phx')),
    non: sum(keys.filter(k => k.startsWith('foreign:'))),
    ofil: sum(keys.filter(k => k === 'ofil')),
    other: sum(keys.filter(k => k === 'unspec'))
  };
  const t = am + af;
  const operating = days - closedDays;
  const fullyClosed = [...Array(days)].every((_, i) => inClosed(E, key + '-' + pad(i + 1)));
  return {
    key, days, rooms: E.rooms.filter(r => roomActive(r, last)).length, arrivals, byDay, daily, am, af, arrivalsTotal: t,
    guestNights, roomNights, available,
    alos: t ? guestNights / t : null,
    occ: available ? roomNights / available : null,
    perRoom: roomNights ? guestNights / roomNights : null,
    vol, partial: throughNight < last, through: throughNight, fullyClosed, operating
  };
}

/* What a submitted version keeps: figures only, no guest or stay detail. */
const snapshotOf = f => ({
  rooms: f.rooms, arrivals: JSON.parse(JSON.stringify(f.arrivals)), am: f.am, af: f.af, arrivalsTotal: f.arrivalsTotal,
  guestNights: f.guestNights, roomNights: f.roomNights, available: f.available,
  alos: f.alos, occ: f.occ, vol: JSON.parse(JSON.stringify(f.vol)), days: f.days, key: f.key
});

function diffAgainst(snap, f) {
  const out = []; const chk = (label, a, b) => { if (a !== b) out.push({ label, was: a, now: b }); };
  chk('Guest arrivals', snap.arrivalsTotal, f.arrivalsTotal);
  chk('Male arrivals', snap.am, f.am); chk('Female arrivals', snap.af, f.af);
  const keys = new Set([...Object.keys(snap.arrivals), ...Object.keys(f.arrivals)]);
  keys.forEach(k => { const a = snap.arrivals[k] || { m: 0, f: 0 }, b = f.arrivals[k] || { m: 0, f: 0 };
    if (a.m + a.f !== b.m + b.f) out.push({ label: rowLabel(k) + ' arrivals', was: a.m + a.f, now: b.m + b.f }); });
  chk('Guest-nights', snap.guestNights, f.guestNights);
  chk('Rooms occupied (room-nights)', snap.roomNights, f.roomNights);
  chk('Rooms available (room-nights)', snap.available, f.available);
  chk('Number of rooms', snap.rooms, f.rooms);
  return out;
}

/* Where a month stands. */
function monthState(E, key, today) {
  const [y, m] = key.split('-').map(Number);
  const last = key + '-' + pad(dim(y, m));
  const ev = E.events[key] || [];
  const lastEv = ev[ev.length - 1];
  const subs = E.subs[key] || [];
  if (!E.reportingFrom) return { s: 'notset' };
  if (key > ymOf(today)) return { s: 'future' };
  const fig = monthFigures(E, key, today);
  if (fig.fullyClosed) return { s: 'na', fig };
  if (lastEv && lastEv.type === 'finalized') return { s: 'finalized', v: subs.length, fig };
  if (lastEv && lastEv.type === 'reopened') return { s: 'reopened', v: subs.length, fig, ev: lastEv };
  if (subs.length) { const d = diffAgainst(subs[subs.length - 1].snap, fig); return { s: d.length ? 'changed' : 'submitted', v: subs.length, diff: d, fig }; }
  if (key < E.reportingFrom) return { s: 'missing', fig };
  if (last >= today) return { s: 'open', fig };
  const due = addDays(last, 5);
  return { s: today > due ? 'overdue' : 'due', due, fig };
}

/* ---------- Validation of a stay ---------- */
function validateStay(E, st, today, ignoreId) {
  const errors = [], warnings = [];
  if (!E.reportingFrom) errors.push('Set the reporting start date in the statistical profile first.');
  if (!st.in || !st.out) { errors.push('Enter the check-in and check-out dates.'); return { errors, warnings }; }
  if (st.in > today) errors.push('Check-in cannot be after today. A booking is not an arrival.');
  if (st.out <= st.in) errors.push('Check-out must be at least one night after check-in.');
  if (errors.length) return { errors, warnings };
  const guests = stayGuests(st);
  if (!st.groups.length || guests < 1) errors.push('Add at least one guest.');
  st.groups.forEach((g, i) => {
    if (g.kind === 'foreign' && !g.country) errors.push('Group ' + (i + 1) + ': choose the country of residence.');
    if ((g.m | 0) < 0 || (g.f | 0) < 0 || !Number.isInteger(+g.m) || !Number.isInteger(+g.f)) errors.push('Group ' + (i + 1) + ': guest counts must be whole numbers.');
  });
  const nights = stayDates(st);
  nights.forEach(d => {
    const covering = st.segs.filter(g => g.from <= d && d < g.to);
    if (!covering.length) errors.push('No room is given for the night of ' + fmtD(d) + '.');
    covering.forEach(g => {
      const rm = E.rooms.find(r => r.no === g.room);
      if (!rm) errors.push('Room ' + g.room + ' is not in the room list.');
      else if (!roomActive(rm, d)) errors.push('Room ' + g.room + ' is not available on ' + fmtD(d) + '.');
      const o = oosOn(E, d).find(x => x.room === g.room);
      if (o) errors.push('Room ' + g.room + ' is out of service on ' + fmtD(d) + ' (' + o.reason + ').');
      const other = E.stays.find(s => s.id !== ignoreId && s.in <= d && d < s.out && s.segs.some(x => x.room === g.room && x.from <= d && d < x.to));
      if (other) errors.push('Room ' + g.room + ' is taken on ' + fmtD(d) + ' by ' + other.ref + '.');
    });
    const c = inClosed(E, d); if (c) errors.push(fmtD(d) + ' is in a closed period (' + c.reason + ').');
    const cap = new Set(covering.map(g => g.room)); const sleeps = [...cap].reduce((a, n) => a + ((E.rooms.find(r => r.no === n) || {}).max || 0), 0);
    if (sleeps && guests > sleeps && !warnings.some(w => w.startsWith('Capacity'))) warnings.push('Capacity: ' + guests + ' guests in rooms that sleep ' + sleeps + ' on ' + fmtD(d) + '.');
  });
  st.segs.forEach(g => { if (g.from < st.in || g.to > st.out || g.from >= g.to) errors.push('Room ' + g.room + ': its dates must fall inside the stay.'); });
  return { errors: [...new Set(errors)], warnings };
}
const lockedMonthsFor = (E, st) => monthsTouched(st).filter(k => E.locks[k]);
const fmtD = d => { const [y, m, dd] = d.split('-').map(Number); return dd + ' ' + MON3[m - 1] + (y !== 2026 ? ' ' + y : ''); };
const fmtLong = d => { const [y, m, dd] = d.split('-').map(Number); return dd + ' ' + MONTHS[m - 1] + ' ' + y; };

/* ---------- Scenario data (fictional) ---------- */

const FA_ROWS = [['phf', 'Filipino nationality', 'ph-filipino'], ['phx', 'Foreign nationality', 'ph-foreign'], ['foreign:KR', 'Korea', 'KR'], ['foreign:JP', 'Japan', 'JP'], ['foreign:CN', 'China', 'CN'], ['foreign:US', 'USA', 'US'], ['foreign:CA', 'Canada', 'CA'], ['foreign:DE', 'Germany', 'DE'], ['foreign:FR', 'France', 'FR'], ['foreign:GB', 'United Kingdom', 'GB'], ['foreign:AU', 'Australia', 'AU'], ['foreign:other', 'All other countries', 'other'], ['ofil', 'Overseas Filipinos*', 'overseas-filipino'], ['unspec', 'Guests with unspecified residence', null]];
function muniMonth(year, i) {   // i: 0..11 → { rows, rn, av, gn, vol, from } or null when nothing reported
  if (year === 2025) { const m = Y25[i], rows = {}; FA_ROWS.forEach(r => { rows[r[0]] = r[2] ? m[r[2]] : 0; }); const av = m.rooms * dim(2025, i + 1); return { rows, arr: Object.keys(rows).reduce((a, k) => a + rows[k], 0), rn: m.rn, av, gn: m.gn, src: 'imported' }; }
  const snaps = Object.values(S.ents).map(e => (e.subs['2026-' + pad(i + 1)] || []).slice(-1)[0]).filter(Boolean).map(s => s.snap); if (!snaps.length) return null;
  const rows = {}; FA_ROWS.forEach(r => rows[r[0]] = 0);
  snaps.forEach(s => Object.keys(s.arrivals).forEach(k => { const key = rows[k] !== undefined ? k : (k.startsWith('foreign:') ? 'foreign:other' : null); if (key) rows[key] += s.arrivals[k].m + s.arrivals[k].f; }));
  const vol = snaps.reduce((a, s) => ({ ph: a.ph + s.vol.ph.m + s.vol.ph.f, non: a.non + s.vol.non.m + s.vol.non.f, of: a.of + s.vol.ofil.m + s.vol.ofil.f }), { ph: 0, non: 0, of: 0 });
  return { rows, arr: snaps.reduce((a, s) => a + s.arrivalsTotal, 0), rn: snaps.reduce((a, s) => a + s.roomNights, 0), av: snaps.reduce((a, s) => a + s.available, 0), gn: snaps.reduce((a, s) => a + s.guestNights, 0), n: snaps.length, src: 'reports', male: snaps.reduce((a, s) => a + s.am, 0), female: snaps.reduce((a, s) => a + s.af, 0) };
}
SCREENS['o-stats-forma'] = () => {
  const yr = +ui.formaYear, cur = [...Array(12)].map((_, i) => muniMonth(yr, i));
  const prevAll = yr === 2026 ? [...Array(12)].map((_, i) => muniMonth(2025, i)) : null;
  const covered = cur.map((m, i) => m ? i : -1).filter(i => i >= 0);
  const prev = prevAll ? (ui.compare === 'same' ? prevAll.map((m, i) => covered.includes(i) ? m : null) : prevAll) : null;
  const sumRow = (ms, k) => ms.reduce((a, m) => a + (m ? m.rows[k] : 0), 0);
  const totalOf = (ms, ks) => ks.reduce((a, k) => a + sumRow(ms, k), 0);
  const grand = totalOf(cur, FA_ROWS.map(r => r[0])), pgrand = prev ? totalOf(prev, FA_ROWS.map(r => r[0])) : null;
  const pctd = (c, p) => p == null ? '–' : p ? ((c - p) / p * 100).toFixed(1) + '%' : 'n/a';
  const line = (label, ks, cls) => { const t = totalOf(cur, ks), p = prev ? totalOf(prev, ks) : null; return '<tr class="' + (cls || '') + '"><td class="stk">' + label + '</td>' + cur.map(m => '<td class="n ' + (m ? '' : 'dim') + '">' + (m ? ks.reduce((a, k) => a + m.rows[k], 0) : '–') + '</td>').join('') + '<td class="n"><b>' + nf(t) + '</b></td><td class="n">' + pct(t, grand) + '</td><td class="n">' + (p == null ? '–' : nf(p)) + '</td><td class="n">' + pctd(t, p) + '</td></tr>'; };
  const sec = t => '<tr class="grp"><td class="stk" colspan="17">' + t + '</td></tr>';
  const foreignKeys = FA_ROWS.filter(r => r[0].startsWith('foreign:')).map(r => r[0]);
  const ind = (label, fn, fmt) => { const ms = cur.filter(Boolean), t = ms.length ? fn(ms) : null; const ps = prev ? prev.filter(Boolean) : []; const p = ps.length ? fn(ps) : null;
    return '<tr><td class="stk">' + label + '</td>' + cur.map(m => '<td class="n ' + (m ? '' : 'dim') + '">' + (m ? fmt(fn([m])) : '–') + '</td>').join('') + '<td class="n"><b>' + (t == null ? '–' : fmt(t)) + '</b></td><td class="n">–</td><td class="n">' + (p == null ? '–' : fmt(p)) + '</td><td class="n">' + (t == null || p == null || !p ? '–' : ((t - p) / p * 100).toFixed(1) + '%') + '</td></tr>'; };
  const sum = (ms, k) => ms.reduce((a, m) => a + m[k], 0);
  const cover = yr === 2026 ? (() => { const reporting = Object.values(S.ents).filter(e => Object.keys(e.subs).length), all = Object.values(S.ents); return { reporting, all, months: covered.map(i => MON3[i]).join(', ') }; })() : null;
  const head = '<thead><tr><th class="stk">Country of residence</th>' + MON3.map(m => '<th class="n">' + m + '</th>').join('') + '<th class="n">Total (' + yr + ')</th><th class="n">% share of arrivals</th><th class="n">Total (' + (yr - 1) + (prev && ui.compare === 'same' ? ', same months' : '') + ')</th><th class="n">% difference</th></tr></thead>';
  return { html:
    '<div class="row" style="justify-content:space-between"><div class="row"><div class="chips" role="group" aria-label="Year">' + [2026, 2025].map(y => '<button class="chip" data-act="ui" data-k="formaYear" data-v="' + y + '" aria-pressed="' + (y === yr) + '">' + y + '</button>').join('') + '</div><b>FORM A · Annual report · Zamboanguita, Negros Oriental</b></div>' + (yr === 2026 ? '<div class="chips" role="group" aria-label="Previous year basis"><button class="chip" data-act="ui" data-k="compare" data-v="full" aria-pressed="' + (ui.compare === 'full') + '">Previous year: full year (as the form)</button><button class="chip" data-act="ui" data-k="compare" data-v="same" aria-pressed="' + (ui.compare === 'same') + '">Previous year: same months only</button></div>' : '') + '</div>' +
    (yr === 2026 ? '<div class="banner wait">' + ico('event_busy') + '<div class="bd"><b>2026 is incomplete: ' + (covered.length ? covered.length + ' month' + (covered.length > 1 ? 's' : '') + ' (' + cover.months + ')' : 'no month') + ' from ' + cover.reporting.length + ' of ' + cover.all.length + ' enterprises in this scenario.</b><p>' + (ui.compare === 'full' ? 'The form compares with the whole of 2025, so the % difference is far below zero by construction. It does not say tourism fell.' : 'Previous year is limited to the same months. Only months with a 2026 report are compared.') + ' Enterprises without a submitted version are not counted and not estimated.</p></div></div>'
      : '<div class="banner info">' + ico('inventory_2') + '<div class="bd"><b>2025 comes from the paper Form A4, imported as municipal totals.</b><p>No enterprise detail and no split by sex exist for it, so Volume per sex is blank. Rooms available is rooms × days in each month. 2024 was not recorded, so there is no comparison. The printed sheet\'s March grand total (1,568) is 10 above its rows (1,558); ZTIMS keeps the rows.</p></div></div>') +
    '<section class="panel"><div class="ph"><h2>Part I. Guest arrivals</h2><span class="sub">A condensed set of the form\'s rows; "All other countries" holds the rest of the list.</span></div><div class="scroll"><table class="t">' + head + '<tbody>' +
    sec('PHILIPPINE RESIDENTS') + line('Filipino nationality', ['phf']) + line('Foreign nationality', ['phx']) + line('Total Philippine residents', ['phf', 'phx'], 'sum') +
    sec('NON-PHILIPPINE RESIDENTS') + FA_ROWS.filter(r => r[0].startsWith('foreign:')).map(r => line(r[1], [r[0]])).join('') + line('Total non-Philippine residents', foreignKeys, 'sum') +
    line('Overseas Filipinos*', ['ofil'], 'sum') + line('Guests with unspecified residence', ['unspec'], 'sum') + line('GRAND TOTAL GUEST ARRIVALS', FA_ROWS.map(r => r[0]), 'grand') + '</tbody></table></div></section>' +
    '<section class="panel"><div class="ph"><h2>Part II. Occupancy rate and length of stay</h2></div><div class="scroll"><table class="t">' + head + '<tbody>' +
    ind('Rooms occupied (room-nights)', ms => sum(ms, 'rn'), nf) + ind('Rooms available (room-nights)', ms => sum(ms, 'av'), nf) + ind('Total guest-nights', ms => sum(ms, 'gn'), nf) +
    ind('Average occupancy rate', ms => sum(ms, 'av') ? sum(ms, 'rn') / sum(ms, 'av') * 100 : null, v => v == null ? 'n/a' : v.toFixed(1) + '%') + ind('Average length of stay (nights)', ms => sum(ms, 'arr') ? sum(ms, 'gn') / sum(ms, 'arr') : null, v => v == null ? 'n/a' : v.toFixed(2)) + '</tbody></table></div>' +
    '<p class="mut sm" style="margin:.75rem 0 0">Totals for the year are ratios of sums over the months shown, not averages of monthly rates. Division by zero shows n/a. * Philippine passport holders permanently residing abroad; excludes overseas Filipino workers.</p></section>' +
    '<section class="panel"><div class="ph"><h2>Volume per sex</h2></div>' + (yr === 2025 ? '<div class="empty">Not recorded. The paper Form A4 for 2025 gives totals only.</div>' : '<div class="scroll"><table class="t"><thead><tr><th>Reported months</th><th class="n">Male</th><th class="n">Female</th><th class="n">Total</th></tr></thead><tbody><tr><td>All places, ' + (cover.months || 'none') + '</td><td class="n">' + cur.filter(Boolean).reduce((a, m) => a + m.male, 0) + '</td><td class="n">' + cur.filter(Boolean).reduce((a, m) => a + m.female, 0) + '</td><td class="n">' + grand + '</td></tr></tbody></table></div>') + '</section>' };
};

/* ---------- Notes and scenario ---------- */
const NOTES = {
  'm-enterprise': { who: 'Manager', src: ['Listing: enterprise name, barangay (existing)', 'New: kind of place, DOT classification, AE ID code, reporting start, closed periods'], calc: ['A month with every day closed is N/A, not zero.', 'Available room-nights skip closed days.'], ref: 'DAE-1B header: type of accommodation, DOT accreditation, AE ID code, municipality, province, region.', lim: 'The profile never holds guest data. Region label needs confirming (see conventions).' },
  'm-rooms': { who: 'Manager', src: ['Room numbers (new): number, type, beds, sleeps, available from', 'Out of service periods (new): room, first and last day, reason'], calc: ['Rooms available on a night = rooms in the list that night − rooms out of service − closed days.', 'A stay cannot use a room on a night it is out of service or taken.'], ref: 'DAE-1A item (4) Total number of rooms and the Room identification columns.', lim: 'Online booking is optional. Its room types keep working; numbered rooms are what statistics use.' },
  'm-register': { who: 'Manager', src: ['Stay: check-in date, check-out date, room allocation by dates, guest groups', 'Guest group: residence class, country of residence (non-residents), male, female'], calc: ['Arrivals: each guest once, on the check-in date.', 'Guest-nights: guests × nights from check-in up to the night before check-out.', 'Rooms occupied (7): distinct rooms with a guest that night.', 'A room transfer moves nights between rooms. It adds no arrival.'], ref: 'DAE-1A columns (5) check-in guests, (6) guests staying overnight, (7) rooms occupied, and the formulas under the grid.', lim: 'No guest names, contacts or ID details. A booking or reservation is not an arrival; only a recorded stay counts. Guests per room are not recorded.' },
  'm-report': { who: 'Manager (submits) · Officer (finalizes)', src: ['Stays and rooms for the month, through the latest night that has happened', 'Submitted versions: figures only, saved at submission'], calc: ['Occupancy = room-nights occupied ÷ room-nights available.', 'Average length of stay = guest-nights ÷ arrivals, same month.', 'Annual figures are ratios of sums over reported months.', 'A month can be submitted after it ends. Due on the 5th of the next month.'], ref: 'DAE-1B Part I (arrivals by nationality or country of residence, overseas Filipinos footnote) and Part II (rooms occupied, rooms available, guest-nights, occupancy rate, length of stay, volume per sex).', lim: 'The length of stay is a period measure, not a cohort measure. A saved version never changes; later register edits show as differences.' },
  'o-stats': { who: 'Officer', src: ['Latest submitted version of each enterprise-month', '2025 municipal totals imported from the paper Form A4 (read only)'], calc: ['Municipal figures add enterprise versions, never the live register.', '% share = row total ÷ grand total. % difference = (current − previous) ÷ previous. Zero in the previous year shows n/a.', 'Finalize needs a submitted version that matches the register. Reopen needs a reason.'], ref: 'FORM A: months January to December, total, % share of arrivals, previous year total, % difference, and Part II.', lim: 'The officer does not edit stays or the register. No approval queue. Enterprises that have not reported are not estimated.' }
};
const CONVS = [
  ['C1 · Night of check-out', 'Not counted. A guest is counted overnight from check-in up to the night before check-out. The DAE-1A note says guests are counted "until the day he checks out", which can be read either way.', 'Default: exclude the check-out night.'],
  ['C2 · Guests who join or leave mid-stay', 'Record the later guests as a separate stay with their own check-in. One stay has one set of dates for all its guests.', 'Default: separate stays.'],
  ['C3 · Day use and same-day check-out', 'Not an accommodation stay. Check-out must be at least one night after check-in.', 'Default: refuse; confirm if day-use should be counted.'],
  ['C4 · Available room-nights', 'Rooms in the list × days of operation, minus nights a room is out of service. Closed days count nothing.', 'Default: deduct out-of-service nights.'],
  ['C5 · Month in progress', 'Figures run through the last night that has happened. A month is submitted after it ends.', 'Default: submit after month end.'],
  ['C6 · Overseas Filipino', 'Philippine passport holders permanently residing abroad. Overseas Filipino workers are not in this group. The country they live in is not asked.', 'Default: no country.'],
  ['C7 · Philippine residents by nationality', 'Philippine residents are split Filipino or foreign nationality. Everyone else is counted by country of residence.', 'Default: as the form.'],
  ['C8 · Region on exports', 'The code says Region VII. Negros Oriental is in the Negros Island Region. Exported forms keep the label the Tourism Office confirms.', 'Needs the office\'s answer.'],
  ['C9 · Country list', 'The database has 72 rows. The 2019 templates list fewer. The database list stays; export maps to the template rows.', 'Needs the office\'s answer.']
];
function notesHtml() {
  const g = groupOf(curRoute()), n = NOTES[g];
  return '<div class="dh"><h2>Notes for this screen</h2><button class="iconbtn" data-act="closeDrawer" aria-label="Close notes">' + ico('close') + '</button></div><div class="dbd">' +
    '<div class="kv"><b>Screen</b><span>' + TITLES[g] + '</span><b>Who uses it</b><span>' + n.who + '</span><b>Template</b><span>' + n.ref + '</span></div>' +
    '<div><h3>Source fields</h3><ul>' + n.src.map(x => '<li>' + x + '</li>').join('') + '</ul></div><div><h3>Calculation and date rules</h3><ul>' + n.calc.map(x => '<li>' + x + '</li>').join('') + '</ul></div><div><h3>Limits</h3><p>' + n.lim + '</p></div>' +
    '<div><h3>Counting conventions to confirm</h3><div style="display:flex;flex-direction:column;gap:.5rem">' + CONVS.map(c => '<div class="conv"><b>' + c[0] + '</b><span class="sm">' + c[1] + '</span><div class="d">' + c[2] + '</div></div>').join('') + '</div></div>' +
    '<div><h3>What changes from today</h3><ul><li>Arrivals counted per place, now for accommodations only. Attractions stay separate and are not in this mockup.</li><li>The "no percentages" rule gives way to the rates and shares the templates require. Occupancy, length of stay, % share and % difference are shown. Revenue is not.</li><li>The monthly report is built from the stays, not typed.</li><li>A submitted report is a saved version. Edits create a new version, never overwrite.</li><li>Finalize and Reopen act on one enterprise and one month. Finalizing also locks that month\'s register.</li><li>A month with carry-over guests only is valid (the old "guest nights but no guests" rule goes).</li></ul></div></div>';
}
function scenarioHtml() {
  return '<div class="dh"><h2>The scenario</h2><button class="iconbtn" data-act="closeDrawer" aria-label="Close">' + ico('close') + '</button></div><div class="dbd">' +
    '<p>Everything here is fictional. A sample manager runs <b>Casa Marina Beach Resort</b> (six numbered rooms) and <b>Lagoon View Cottages</b> (not set up yet). Today is the date in the top bar.</p>' +
